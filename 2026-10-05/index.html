<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>土星裏側探索</title><style>body{margin:0;background:#0a0a1f;color:#ddd;font-family:system-ui;display:flex;flex-direction:column;height:100vh}header{padding:8px;text-align:center;font-size:14px;border-bottom:1px solid #333}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center}button{background:#222;color:#ddd;border:1px solid #555;padding:14px 24px;margin:8px;font-size:16px;border-radius:8px}button:active{background:#444}.stage{display:none}.active{display:flex;flex-direction:column;align-items:center}.desc{font-size:15px;line-height:1.5;max-width:90%;margin:12px 0}.score{font-size:13px;color:#888;margin-top:20px}</style></head><body><header>土星裏側探索</header><main><div id="start" class="active"><h2>土星衝の謎</h2><p class="desc">日常の裏側に広がる惑星世界を3ステージ探索。<br>タップで選択肢を選び、謎を解明しよう。</p><button onclick="startGame()">探索を開始</button></div><div id="s1" class="stage"><p class="desc">ステージ1：土星の輪の隙間<br>光る粒子が舞う。どちらへ進む？</p><button onclick="choose(1,2)">粒子に触れる</button><button onclick="choose(1,1)">影に隠れる</button></div><div id="s2" class="stage"><p class="desc">ステージ2：裏側の大気<br>濃い霧の中、振動が伝わる。どうする？</p><button onclick="choose(2,2)">振動に同調</button><button onclick="choose(2,1)">霧を払う</button></div><div id="s3" class="stage"><p class="desc">ステージ3：核心の光<br>最後の謎。光の源に近づく方法は？</p><button onclick="choose(3,2)">光に溶け込む</button><button onclick="choose(3,1)">観測を続ける</button></div><div id="end" class="stage"><h3>探索完了</h3><p id="result"></p><div class="score">調和スコア：<span id="score">0</span>/3</div><button onclick="location.reload()">もう一度</button></div></main><script>let stage=0,score=0;function show(id){document.querySelectorAll('.stage,#start').forEach(el=>el.classList.remove('active'));document.getElementById(id).classList.add('active');}function startGame(){stage=0;score=0;show('s1');}function choose(s,act){if(stage+1!==s)return;score+=act;stage++;if(stage===1)show('s2');else if(stage===2)show('s3');else if(stage===3){document.getElementById('score').innerText=score;document.getElementById('result').innerHTML=score>=5?'完全調和！土星の秘密が明かされた。':'謎の一部を発見。次はより深く。';show('end');}}</script></body></html>
