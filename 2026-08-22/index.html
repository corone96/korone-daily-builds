<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夏祭り提灯リレー</title>
<style>
body{margin:0;background:#112;font-family:sans-serif;color:#fff;text-align:center;touch-action:none}
#title{font-size:18px;margin:8px 0 4px}
#ui{display:flex;justify-content:space-around;margin:4px 10px;font-size:15px}
#game{position:relative;width:100%;max-width:420px;height:240px;margin:0 auto;background:#001;border:4px solid #f80;border-radius:12px;overflow:hidden}
.lantern{position:absolute;width:42px;height:56px;border-radius:50% 50% 40% 40%;background:linear-gradient(#f44,#f80,#f44);box-shadow:0 0 4px #000;border:3px solid #c60;top:80px;transition:all .1s}
.lantern.lit{background:linear-gradient(#ff8,#ff0,#ff8);box-shadow:0 0 20px #ff0,0 0 40px #f80}
#line{position:absolute;height:4px;background:#ff8;opacity:0;top:108px;pointer-events:none}
#result{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;text-shadow:0 0 8px #000;display:none}
button{margin:10px 4px;padding:8px 20px;font-size:16px;background:#f80;border:none;border-radius:20px;color:#000}
</style>
</head>
<body>
<div id="title">夏祭り提灯リレー</div>
<div id="ui"><div>連鎖: <span id="chain">0</span></div><div>スコア: <span id="score">0</span></div><div>残り: <span id="time">30</span>s</div></div>
<div id="game">
<div id="line"></div>
<div id="result"></div>
</div>
<button id="start">スタート</button>
<script>
const game=document.getElementById('game');
const line=document.getElementById('line');
const chainEl=document.getElementById('chain');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const result=document.getElementById('result');
const startBtn=document.getElementById('start');
let lanterns=[],current=0,chain=0,score=0,time=30,timer=null,running=false;
function createLanterns(){
  game.innerHTML='<div id="line"></div><div id="result"></div>';
  lanterns=[];
  for(let i=0;i<7;i++){
    const l=document.createElement('div');
    l.className='lantern';
    l.style.left=(22+i*55)+'px';
    l.dataset.idx=i;
    game.appendChild(l);
    lanterns.push(l);
    l.addEventListener('pointerdown',()=>tap(i));
  }
}
function tap(i){
  if(!running||i!==current)return;
  lanterns[i].classList.add('lit');
  if(current>0){
    line.style.left=(22+(current-1)*55+21)+'px';
    line.style.width='55px';
    line.style.opacity='0.9';
    setTimeout(()=>{line.style.opacity='0'},120);
  }
  chain++;score+=chain*10;
  chainEl.textContent=chain;
  scoreEl.textContent=score;
  current++;
  if(current>=lanterns.length){
    setTimeout(nextWave,180);
  }else{
    setTimeout(()=>{lanterns[current].classList.add('lit')},180);
  }
}
function nextWave(){
  lanterns.forEach(l=>l.classList.remove('lit'));
  current=0;
  lanterns[0].classList.add('lit');
}
function miss(){
  if(!running)return;
  chain=0;
  chainEl.textContent=0;
  lanterns.forEach(l=>l.classList.remove('lit'));
  setTimeout(()=>{
    if(running){
      current=0;
      lanterns[0].classList.add('lit');
    }
  },300);
}
function startGame(){
  createLanterns();
  chain=score=0;
  time=30;
  current=0;
  running=true;
  chainEl.textContent=0;
  scoreEl.textContent=0;
  timeEl.textContent=30;
  result.style.display='none';
  startBtn.style.display='none';
  lanterns[0].classList.add('lit');
  timer=setInterval(()=>{
    time--;
    timeEl.textContent=time;
    if(time<=0)endGame();
  },1000);
  game.addEventListener('pointerdown',e=>{
    if(!running)return;
    const rect=game.getBoundingClientRect();
    const x=e.clientX-rect.left;
    let hit=false;
    lanterns.forEach((l,i)=>{
      const lx=parseFloat(l.style.left)+21;
      if(Math.abs(x-lx)<30&&i===current)hit=true;
    });
    if(!hit)miss();
  },{once:false});
}
function endGame(){
  running=false;
  clearInterval(timer);
  result.innerHTML=`ゲームオーバー<br>スコア ${score}`;
  result.style.display='block';
  startBtn.style.display='inline-block';
  startBtn.textContent='もう一度';
}
startBtn.onclick=()=>startGame();
createLanterns();
</script>
</body>
</html>
