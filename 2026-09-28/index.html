<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ビール注ぎパズル</title><style>body{margin:0;background:#f5e8c7;font-family:sans-serif;text-align:center;touch-action:none}canvas{display:block;margin:0 auto;border:4px solid #8b4513;border-radius:8px;background:#fff}header{font-size:14px;color:#8b4513;margin:8px} #info{font-size:13px;margin:4px}button{padding:8px 16px;font-size:14px;background:#d2691e;color:#fff;border:none;border-radius:20px;margin:4px}</style></head><body><header>🍺 ビール注ぎパズル</header><div id="info">角度: <span id="ang">0</span>°　注ぎ: <span id="pour">0</span>%　スコア: <span id="score">0</span></div><canvas id="c" width="320" height="240"></canvas><div><button id="start">スタート</button><button id="reset">リセット</button></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let angle=0,pour=0,score=0,filling=false,target=45,started=false;function draw(){ctx.clearRect(0,0,320,240);ctx.fillStyle='#deb887';ctx.fillRect(40,60,60,140);ctx.fillStyle='#fff';ctx.fillRect(42,62,56,136);ctx.strokeStyle='#8b4513';ctx.lineWidth=3;ctx.strokeRect(40,60,60,140);ctx.save();ctx.translate(200,140);ctx.rotate(angle*Math.PI/180);ctx.fillStyle='#f4a460';ctx.fillRect(-25,-80,50,160);ctx.restore();ctx.fillStyle='#ffd700';ctx.fillRect(175,180-pour*1.2,50,pour*1.2);ctx.fillStyle='#fff';ctx.fillRect(175,175-pour*1.2,50,8);ctx.font='12px sans-serif';ctx.fillStyle='#333';ctx.fillText('目標角度:'+target+'°',10,20);}function updateUI(){document.getElementById('ang').textContent=Math.round(angle);document.getElementById('pour').textContent=Math.round(pour);document.getElementById('score').textContent=score;}let startY=0,startT=0;function onDown(e){if(!started)return;startY=e.clientY||e.touches[0].clientY;startT=Date.now();filling=true;}function onMove(e){if(!started||!filling)return;const y=e.clientY||e.touches[0].clientY;angle=Math.max(-60,Math.min(60,(y-startY)*-0.6));if(Math.abs(angle-target)<8)pour=Math.min(100,pour+0.8);updateUI();draw();}function onUp(){if(!started)return;filling=false;const ok=Math.abs(angle-target)<10&&pour>70;if(ok){score+=Math.floor(100-Math.abs(angle-target)*1.5);alert('完璧！高得点！🍺');}else{alert('溢れた！失敗…(笑)');}pour=0;angle=0;updateUI();draw();}c.addEventListener('pointerdown',onDown);c.addEventListener('pointermove',onMove);c.addEventListener('pointerup',onUp);c.addEventListener('touchstart',e=>{e.preventDefault();onDown(e);});c.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);});c.addEventListener('touchend',e=>{e.preventDefault();onUp();});document.getElementById('start').onclick=()=>{started=true;target=30+Math.random()*40|0;score=0;pour=0;angle=0;updateUI();draw();};document.getElementById('reset').onclick=()=>{started=false;pour=0;angle=0;score=0;updateUI();draw();};draw();</script></body></html>
