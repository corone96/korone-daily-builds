<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クリシュナの月舞</title><style>body{margin:0;background:#0a0a1f;color:#ddd;font-family:sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100vh}#ui{position:absolute;top:8px;left:8px;right:8px;font-size:13px;display:flex;justify-content:space-between;pointer-events:none}#title{font-size:11px;opacity:.6}</style></head><body><div id="ui"><div id="title">クリシュナの月舞</div><div id="stage">STAGE 1/3</div><div id="score">SCORE: 0000</div></div><canvas id="c"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),stageEl=document.getElementById('stage');let W,H,stage=1,score=0,beats=[],beatIdx=0,lastTap=0,playing=false;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();const AC=new(window.AudioContext||window.webkitAudioContext)();function playFlute(t){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=680+t*30;f.type='lowpass';f.frequency.value=1200;o.connect(f);f.connect(g);g.connect(AC.destination);g.gain.value=.2;o.start();g.gain.linearRampToValueAtTime(0,AC.currentTime+.6);setTimeout(()=>o.stop(),700)}function genBeats(n){beats=[];for(let i=0;i<n;i++)beats.push(800+i*520+Math.random()*80)}function draw(t){ctx.fillStyle='#0a0a1f';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe4a0';ctx.beginPath();ctx.arc(W*.75,120,38,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#334';ctx.lineWidth=3;ctx.beginPath();ctx.arc(W*.5,H*.72,140,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#4a6';ctx.fillRect(W*.3,H*.7, W*.4,40);ctx.fillStyle='#88f';const p=beatIdx<beats.length?(beats[beatIdx]-t)/400:0;ctx.beginPath();ctx.arc(W*.5,H*.55+Math.sin(t/180)*18,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(W*.48,H*.52,8,30);if(playing){ctx.fillStyle='#ff8';ctx.globalAlpha=.6+Math.sin(t/120)*.4;ctx.fillRect(W*.2,H*.82, W*.6,4);ctx.globalAlpha=1;for(let i=0;i<beats.length;i++){const x=W*.2+(beats[i]-t)*.0006*W;ctx.fillStyle=i===beatIdx?'#ff0':'#555';ctx.fillRect(x,H*.81,4,8)}}ctx.fillStyle='#ddd';ctx.font='14px sans-serif';ctx.fillText('TAP TO DANCE',W*.5-55,H*.95)}function loop(){const t=Date.now();draw(t);if(playing&&beatIdx<beats.length&&t>beats[beatIdx]+280){beatIdx++;if(beatIdx>=beats.length){playing=false;setTimeout(nextStage,600)}}requestAnimationFrame(loop)}function hit(){const t=Date.now();if(!playing)return;let best=999,bi=-1;for(let i=beatIdx;i<Math.min(beatIdx+2,beats.length);i++){const d=Math.abs(beats[i]-t);if(d<best){best=d;bi=i}}if(bi===beatIdx&&best<260){const acc=1-Math.min(best,200)/200;score+=Math.floor(120*acc);scoreEl.textContent='SCORE: '+score.toString().padStart(4,'0');playFlute(acc);beatIdx++}else if(bi>-1&&best<380){score+=30;scoreEl.textContent='SCORE: '+score.toString().padStart(4,'0');playFlute(.3);beatIdx=bi+1}}function startStage(){genBeats(7+stage*2);beatIdx=0;playing=true;lastTap=0}function nextStage(){if(stage<3){stage++;stageEl.textContent='STAGE '+stage+'/3';startStage()}else{playing=false;ctx.fillStyle='#ff0';ctx.font='20px sans-serif';ctx.fillText('FINISH! '+score+' pts',W*.5-70,H*.6)}}c.addEventListener('pointerdown',e=>{e.preventDefault();if(AC.state==='suspended')AC.resume();if(!playing){startStage();score=0;scoreEl.textContent='SCORE: 0000';stage=1;stageEl.textContent='STAGE 1/3'}else hit()});loop();setTimeout(()=>{ctx.fillStyle='#88f';ctx.font='16px sans-serif';ctx.fillText('画面をタップして開始',W*.5-80,H*.6)},1200);</script></body></html>
