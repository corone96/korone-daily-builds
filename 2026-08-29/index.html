<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>救助ゾーンプランナー</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#eee;overflow:hidden}
header{padding:8px 12px;font-size:14px;background:#222;display:flex;justify-content:space-between;align-items:center}
#map{display:block;margin:0 auto;background:#334;border:2px solid #555;touch-action:none}
#stats,#result{padding:8px 12px;font-size:13px;background:#222}
button{background:#0a0;color:#fff;border:none;padding:8px 14px;margin:4px;font-size:14px;border-radius:4px}
#ctrl{padding:6px;text-align:center}
</style>
</head>
<body>
<header>救助ゾーンプランナー <span id="title">被災地効率捜索ツール</span></header>
<canvas id="map" width="360" height="420"></canvas>
<div id="stats">カバー率: <span id="cov">0</span>%　発見スコア: <span id="scr">0</span></div>
<div id="ctrl">
<button id="sim">シミュレーション実行</button>
<button id="reset">リセット</button>
</div>
<div id="result"></div>
<script>
const c=document.getElementById('map'),ctx=c.getContext('2d');
let teams=[],zones=[{x:20,y:40,w:160,h:170,id:0},{x:190,y:40,w:150,h:170,id:1},{x:20,y:220,w:160,h:180,id:2},{x:190,y:220,w:150,h:180,id:3}];
let score=0,cov=0;
function draw(){
  ctx.fillStyle='#223';ctx.fillRect(0,0,c.width,c.height);
  zones.forEach((z,i)=>{
    ctx.fillStyle=['#522','#252','#225','#442'][i];ctx.fillRect(z.x,z.y,z.w,z.h);
    ctx.strokeStyle='#888';ctx.strokeRect(z.x,z.y,z.w,z.h);
    ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.fillText('ゾーン'+(i+1),z.x+8,z.y+18);
  });
  teams.forEach(t=>{
    ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(t.x,t.y,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.font='bold 11px sans-serif';ctx.fillText('T',t.x-4,t.y+4);
  });
  document.getElementById('cov').textContent=cov;
  document.getElementById('scr').textContent=score;
}
function placeTeam(x,y){
  let placed=false;
  zones.forEach(z=>{
    if(x>z.x&&x<z.x+z.w&&y>z.y&&y<z.y+z.h&&teams.length<8&&!placed){
      teams.push({x:x,y:y,zone:z.id});
      placed=true;
    }
  });
  updateStats();
  draw();
}
function updateStats(){
  let perZone=[0,0,0,0];
  teams.forEach(t=>perZone[t.zone]++);
  cov=Math.min(100,Math.floor(perZone.reduce((a,b)=>a+b,0)*12.5));
  score=Math.floor(cov*1.3+perZone.filter(v=>v>1).length*8);
}
function simulate(){
  if(teams.length===0){document.getElementById('result').innerHTML='チームを配置してください';return;}
  let perZone=[0,0,0,0];
  teams.forEach(t=>perZone[t.zone]++);
  let found=0,msg='';
  perZone.forEach((n,i)=>{
    let f=Math.min(100,Math.floor(n*28+Math.random()*10));
    found+=f;
    msg+='ゾーン'+(i+1)+': '+f+'%発見　';
  });
  score=Math.floor(found/2);
  document.getElementById('result').innerHTML='結果: 総発見 '+found+'%　'+msg+'<br>再配置で改善可能';
  draw();
}
function reset(){
  teams=[];cov=0;score=0;
  document.getElementById('result').innerHTML='';
  draw();
}
c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect();
  placeTeam((e.clientX-r.left)* (c.width/r.width),(e.clientY-r.top)*(c.height/r.height));
}, {passive:false});
document.getElementById('sim').onclick=simulate;
document.getElementById('reset').onclick=reset;
draw();
</script>
</body>
</html>
