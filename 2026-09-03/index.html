<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ダム水守り村</title>
<style>
body{margin:0;background:#0a3d2e;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;touch-action:none}
header{padding:8px;text-align:center;font-size:14px;background:#05251c}
#game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
#valve{width:180px;height:180px;border:12px solid #f4d35e;border-radius:50%;background:#3a2f1f;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;margin:20px 0;cursor:pointer;user-select:none}
#valve.open{background:#5dade2;border-color:#aed6f1}
#village{display:flex;gap:12px;justify-content:center;width:100%;max-width:420px}
.area{flex:1;background:#1a5c48;border-radius:8px;padding:8px;text-align:center;font-size:13px}
.bar{height:18px;background:#fff3;border-radius:9px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:#5dade2;width:0%;transition:width .1s}
#info{display:flex;justify-content:space-between;width:100%;max-width:420px;font-size:15px;margin-bottom:10px}
#msg{position:absolute;bottom:20px;font-size:13px;opacity:.8}
</style>
</head>
<body>
<header>ダム水守り村</header>
<div id="game">
<div id="info"><div>スコア: <span id="score">0</span></div><div>水位: <span id="water">50</span>%</div></div>
<div id="valve">バルブ<br>タップ</div>
<div id="village">
<div class="area">田<br><div class="bar"><div id="f1" class="fill"></div></div></div>
<div class="area">畑<br><div class="bar"><div id="f2" class="fill"></div></div></div>
<div class="area">家<br><div class="bar"><div id="f3" class="fill"></div></div></div>
</div>
<div id="msg">タイミングよくタップして水を分配！</div>
</div>
<script>
let open=false,score=0,water=50,time=60;
const valve=document.getElementById('valve');
const wEl=document.getElementById('water');
const sEl=document.getElementById('score');
const f1=document.getElementById('f1'),f2=document.getElementById('f2'),f3=document.getElementById('f3');
function update(){wEl.textContent=Math.max(0,Math.min(100,Math.floor(water)));f1.style.width=Math.min(100,water*1.1)+'%';f2.style.width=Math.min(100,water*0.9)+'%';f3.style.width=Math.min(100,water*0.7)+'%';}
function tap(){open=!open;valve.classList.toggle('open',open);if(open)score+=2;}
valve.addEventListener('pointerdown',tap);
setInterval(()=>{if(open)water=Math.min(100,water+4);else water=Math.max(0,water-3);water-=0.8;if(water<15||water>92)score=Math.max(0,score-1);update();sEl.textContent=score;},180);
setInterval(()=>{time--;if(time<=0){alert('終了！スコア:'+score);location.reload();}},1000);
update();
</script>
</body>
</html>
