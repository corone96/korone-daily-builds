<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>くんち影探検</title><style>body{margin:0;background:#0a0a12;color:#ddd;font-family:sans-serif;touch-action:none}header{padding:8px 12px;font-size:13px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}#stage{padding:16px 12px;min-height:70vh}#scene{background:#111;border:1px solid #444;border-radius:8px;padding:20px;margin:12px 0;line-height:1.5;font-size:15px}#choices{display:flex;flex-direction:column;gap:10px;margin-top:20px}button{padding:14px;border:none;border-radius:8px;background:#222;color:#ddd;font-size:15px}button:active{background:#3a3a4a}.frag{color:#ffcc66;font-weight:bold}.end{text-align:center;margin-top:30px}</style></head><body><header><div>くんち影探検</div><div>調和の欠片 <span id="frag">0</span>/9　スコア <span id="score">0</span></div></header><div id="stage"><div id="scene">長崎くんちの山車が通り過ぎた後。路地裏に微かな光が揺れている…</div><div id="choices"></div></div><script>let stage=0,fr=0,sc=0;const scene=document.getElementById('scene'),ch=document.getElementById('choices'),fEl=document.getElementById('frag'),sEl=document.getElementById('score');function upd(){fEl.textContent=fr;sEl.textContent=sc}function next(s){stage=s;render()}function add(f,s){fr+=f;sc+=s;upd()}function render(){ch.innerHTML='';if(stage===0){scene.innerHTML='路地裏の影が揺れる。タップして進路を選ぶ';['左の細道','正面の蔵','右の提灯'] .forEach((t,i)=>mkBtn(t,()=>{add(1,10);next(i+1)}))}else if(stage===1){scene.innerHTML='細い路地。壁に浮かぶ影が動いた。';['影を触る','静かに待つ','引き返す'].forEach((t,i)=>mkBtn(t,()=>{add(i===0?2:1,15);next(4)}))}else if(stage===2){scene.innerHTML='蔵の奥。祭りの残響が聞こえる。';['扉を押す','耳を澄ます','戻る'].forEach((t,i)=>mkBtn(t,()=>{add(i===0?3:1,20);next(4)}))}else if(stage===3){scene.innerHTML='提灯の光が影を照らす。不思議な世界が広がる。';['光の中へ','影を追う','提灯を振る'].forEach((t,i)=>mkBtn(t,()=>{add(2+i,25);next(4)}))}else if(stage===4){scene.innerHTML='影の祭りが静かに終わる。'+(fr>=6?'調和が戻った。':'まだ欠片が足りない…');mkBtn('もう一度',()=>{fr=0;sc=0;stage=0;upd();render()});mkBtn('結果を見る',end)}upd()}function mkBtn(t,fn){const b=document.createElement('button');b.textContent=t;b.addEventListener('pointerdown',fn,{passive:true});ch.appendChild(b)}function end(){scene.innerHTML='<div class="end"><h2>探索終了</h2><p>調和の欠片：'+fr+'/9</p><p>スコア：'+sc+'</p><p>くんちの裏に隠れた世界を、'+(fr>6?'完全に':'少し')+'見つけた。</p></div>';ch.innerHTML=''}render();</script></body></html>
