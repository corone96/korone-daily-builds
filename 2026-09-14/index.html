<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花火タイミング撃ち</title><style>body{margin:0;background:#0a0a2e;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100vh}#ui{position:absolute;top:0;left:0;right:0;pointer-events:none;padding:12px;text-align:center}#title{font-size:14px;opacity:.7;margin-bottom:4px}#score{font-size:28px;font-weight:700}#combo{font-size:18px;color:#ff0;margin-top:-4px}#msg{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:15px;opacity:.85}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="title">花火タイミング撃ち</div><div id="score">0</div><div id="combo"></div></div><div id="msg">画面中央をリズムに合わせてタップ！</div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,score=0,combo=0,last=0,particles=[],beats=[],running=true;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();function addBeat(t){beats.push(t)}function launch(x,y,big){for(let i=0;i<(big?28:14);i++){const a=Math.random()*Math.PI*2,v=(big?2.8:1.6)*(0.7+Math.random());particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,r:2+Math.random()*2.5,c:`hsl(${Math.random()*50+20},100%,${70+Math.random()*25}%)`,l:38+Math.random()*22})}}function tap(){const now=Date.now();if(!running)return;let hit=false;for(let i=beats.length-1;i>=0;i--){const d=Math.abs(now-beats[i]);if(d<180){hit=true;const big=d<70;score+=big?120:60;combo++;launch(W/2,H*0.58,big);beats.splice(i,1);break}}if(!hit){combo=0;score=Math.max(0,score-20);if(particles.length>4)particles.length=Math.floor(particles.length*0.6)}document.getElementById('score').textContent=score;document.getElementById('combo').textContent=combo>1?combo+' COMBO':'';if(combo>0&&combo%4===0)launch(W/2+Math.random()*40-20,H*0.55,true)}c.addEventListener('pointerdown',e=>{e.preventDefault();tap()});c.addEventListener('touchstart',e=>{e.preventDefault();tap()},{passive:false});function loop(){ctx.fillStyle='#0a0a2e';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<38;i++){const x=(i*67)%W,y=(i*31+Math.sin(Date.now()/900+i)*9)%(H*0.6);ctx.fillRect(x,y,1.4,1.4)}const t=Date.now();if(t-last>720){last=t;addBeat(t+80);if(combo>3)addBeat(t+380)}ctx.strokeStyle='#f90';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(W/2,H*0.72);ctx.lineTo(W/2,H*0.44);ctx.stroke();ctx.fillStyle='#f44';ctx.beginPath();ctx.arc(W/2,H*0.44,9,0,Math.PI*2);ctx.fill();for(let i=beats.length-1;i>=0;i--){const d=t-beats[i];if(d>420)beats.splice(i,1);else{const r=26+(d/420)*38;ctx.strokeStyle=`hsla(50,100%,95%,${1-d/420})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2,H*0.44,r,0,Math.PI*2);ctx.stroke()}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.09;p.l--;if(p.l<0)particles.splice(i,1);else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}}requestAnimationFrame(loop)}loop();setInterval(()=>{if(running&&Math.random()<0.4)addBeat(Date.now()+120)},650);setTimeout(()=>{document.getElementById('msg').style.display='none'},4200)</script></body></html>
