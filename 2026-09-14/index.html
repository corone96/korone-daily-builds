<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花火タイミングタップ</title><style>body{margin:0;background:#112;font-family:sans-serif;color:#fff;overflow:hidden;touch-action:none}header{text-align:center;padding:4px;font-size:14px;background:#223}h1{margin:0;font-size:16px}.game{display:flex;flex-direction:column;height:100vh}canvas{background:#001;width:100%;flex:1;max-height:70vh;touch-action:none}#ui{padding:8px;text-align:center;font-size:18px}#score{font-size:24px;color:#ff8}#msg{margin:4px 0;height:20px}button{background:#f84;color:#fff;border:none;padding:10px 20px;font-size:16px;border-radius:20px;margin:4px}</style></head><body><div class="game"><header><h1>花火タイミングタップ</h1></header><canvas id="c"></canvas><div id="ui"><div id="score">SCORE: 0</div><div id="msg"></div><button id="btn">スタート</button></div></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),msgEl=document.getElementById('msg'),btn=document.getElementById('btn');let W=320,H=480,score=0,combo=0,song=0,playing=false,notes=[],parts=[],t=0,lastT=0,beatTimes=[];function resize(){W=Math.min(380,window.innerWidth-20);H=Math.min(520,window.innerHeight*0.65);c.width=W;c.height=H}window.onresize=resize;resize();const songs=[[800,1400,2000,2600,3200,3800,4400,5000,5600,6200,6800,7400,8000,8600,9200,9800,10400,11000,11600,12200],[600,1100,1600,2100,2600,3100,3600,4100,4600,5100,5600,6100,6600,7100,7600,8100,8600,9100,9600,10100,10600,11100],[400,900,1400,1900,2400,2900,3400,3900,4400,4900,5400,5900,6400,6900,7400,7900,8400,8900,9400,9900,10400,10900,11400,11900]];function startSong(){notes=[];parts=[];beatTimes=songs[song].slice();t=0;lastT=Date.now();playing=true;combo=0;msgEl.textContent=`曲 ${song+1}/3 スタート！`;btn.style.display='none'}function endSong(){playing=false;song++;if(song<3){msgEl.textContent=`曲クリア！ +${score} 次の曲へ`;btn.textContent='次の曲';btn.style.display='inline'}else{msgEl.textContent=`全曲終了！ 合計 ${score}点`;btn.textContent='もう一度';btn.style.display='inline';song=0}}function hit(x){if(!playing)return;let best=999,bi=-1;for(let i=0;i<notes.length;i++){const d=Math.abs(notes[i].y-(H-60));if(d<best){best=d;bi=i}}let pts=10;if(best<25){pts=100;combo++}else if(best<50){pts=40;combo=0}else{combo=0}if(bi>=0)notes.splice(bi,1);score+=pts* (combo>3?2:1);scoreEl.textContent='SCORE: '+score;for(let i=0;i<(pts>50?18:6);i++)parts.push({x:x||W/2,y:H-50,vx:(Math.random()-0.5)*4,vy:Math.random()*-3-1,r:Math.random()*3+2,life:30,col:pts>50?'#ff0':'#f88'})}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();hit((e.clientX-r.left)/r.width*W)});c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect();hit((e.touches[0].clientX-r.left)/r.width*W)},{passive:false});function loop(){const now=Date.now();if(playing){t=now-lastT;if(t>13000){endSong();return}for(let i=beatTimes.length-1;i>=0;i--){if(beatTimes[i]<t+1200){notes.push({y:-20,bt:beatTimes[i]});beatTimes.splice(i,1)}}for(let i=notes.length-1;i>=0;i--){const n=notes[i];n.y=(t-n.bt)/1200*(H-80)+20;if(n.y>H-30){notes.splice(i,1);combo=0}}}ctx.fillStyle='#001';ctx.fillRect(0,0,W,H);ctx.fillStyle='#334';ctx.fillRect(0,H-55,W,4);ctx.fillStyle='#ff8';ctx.fillRect(0,H-70,W,2);for(const n of notes){ctx.fillStyle=n.y>H-80?'#f44':'#ff0';ctx.beginPath();ctx.arc(W/2,n.y,8,0,7);ctx.fill()}for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;if(p.life<0)parts.splice(i,1);else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}}if(playing&&t%400<50){ctx.fillStyle='#0f8';ctx.fillText('TAP!',W/2-20,H-80)}requestAnimationFrame(loop)}btn.onclick=()=>{if(!playing)startSong()};loop();</script></body></html>
