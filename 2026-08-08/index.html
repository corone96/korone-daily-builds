<!doctype html><html lang="ja"><head><meta charset="UTF-8"><title>文字キャッチ</title><style>body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh} #game{position:relative;width:400px;height:400px;border:2px solid #0f0;overflow:hidden} .letter{position:absolute;font-size:28px;transition:transform .05s} #info{margin:10px;font-size:14px} #score{color:#ff0}</style></head><body><h1 style="font-size:18px;margin:8px">文字キャッチゲーム</h1><div id="info">SCORE: <span id="score">0</span>　PRESS ANY KEY</div><div id="game"></div><script>const game=document.getElementById('game'),scoreEl=document.getElementById('score');let score=0,letters=[];function spawn(){const l=document.createElement('div');l.className='letter';l.textContent=String.fromCharCode(65+Math.random()*26|0);l.style.left=Math.random()*360+'px';l.style.top='0px';game.appendChild(l);letters.push({el:l,y:0,s:1+Math.random()*1.5})}function loop(){letters.forEach((o,i)=>{o.y+=o.s;o.el.style.top=o.y+'px';if(o.y>380){o.el.remove();letters.splice(i,1);score=Math.max(0,score-5);scoreEl.textContent=score}})}setInterval(spawn,900);setInterval(loop,30);document.addEventListener('keydown',e=>{const k=e.key.toUpperCase();for(let i=0;i<letters.length;i++){if(letters[i].el.textContent===k){letters[i].el.remove();letters.splice(i,1);score+=10;scoreEl.textContent=score;break}}});setTimeout(()=>spawn(),300)</script></body></html>
