<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>衛星軌道プランナー</title><style>body{margin:0;background:#0a0f1e;color:#fff;font-family:sans-serif;touch-action:none}header{padding:6px 10px;font-size:13px;background:#111a2e;text-align:center}canvas{display:block;margin:0 auto;background:#000} #ui{padding:8px;max-width:480px;margin:0 auto} .row{display:flex;gap:8px;margin:6px 0;align-items:center} .row span{flex:1;font-size:13px}button{padding:10px 14px;font-size:15px;border:none;border-radius:6px;background:#2a5cff;color:#fff}button:active{background:#1a3fcc}.stat{font-size:12px;color:#8cf}</style></head><body><header>衛星軌道プランナー <span id="best">最高:0%</span></header><canvas id="c" width="360" height="360"></canvas><div id="ui"><div class="row"><span>角度: <b id="a">45</b>°</span><button id="am">-</button><button id="ap">+</button></div><div class="row"><span>速度: <b id="v">7.8</b> km/s</span><button id="vm">-</button><button id="vp">+</button></div><div class="row"><span>タイミング: <b id="t">0</b>°</span><button id="tm">-</button><button id="tp">+</button></div><div class="row"><button id="launch" style="flex:1">打ち上げ</button><button id="reset" style="flex:1">リセット</button></div><div class="stat">試行 <span id="try">0</span>/10　成功率 <span id="rate">--</span></div></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let angle=45,vel=7.8,timing=0,attempts=0,best=0,successes=0;const params={a:45,v:7.8,t:0};function load(){const s=localStorage.getItem('sat_best');if(s)best=+s;document.getElementById('best').textContent='最高:'+best+'%';}function save(){localStorage.setItem('sat_best',best);}function draw(phase=0,sat=null){ctx.fillStyle='#0a0f1e';ctx.fillRect(0,0,360,360);const cx=180,cy=180,r=48;ctx.fillStyle='#1e90ff';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,92,0,Math.PI*2);ctx.stroke();if(sat){ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(sat.x,sat.y,4,0,Math.PI*2);ctx.fill();}else{const rad=(angle+timing)*Math.PI/180;const x=cx+Math.cos(rad)*92,y=cy+Math.sin(rad)*92;ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();}}function sim(){let x=180+Math.cos((angle+timing)*Math.PI/180)*52,y=180+Math.sin((angle+timing)*Math.PI/180)*52;let vx=Math.cos(angle*Math.PI/180)*vel*0.9,vy=Math.sin(angle*Math.PI/180)*vel*0.9;let stable=0;for(let i=0;i<180;i++){const dx=x-180,dy=y-180,dist=Math.hypot(dx,dy);if(dist<50)return 10;if(dist>160)return Math.min(95,stable*2);const g=3800/(dist*dist);const ax=-g*dx/dist,ay=-g*dy/dist;vx+=ax*0.08;vy+=ay*0.08;x+=vx*0.08;y+=vy*0.08;if(dist>88&&dist<96)stable++;}return Math.floor(Math.min(98,stable*1.1));}function updateUI(){document.getElementById('a').textContent=angle;document.getElementById('v').textContent=vel.toFixed(1);document.getElementById('t').textContent=timing;document.getElementById('try').textContent=attempts;const rate=attempts?Math.floor(successes/attempts*100):'--';document.getElementById('rate').textContent=rate+'%';draw();}function add(n,k,min,max,step){params[k]=Math.max(min,Math.min(max,params[k]+n*step));angle=params.a;vel=params.v;timing=params.t;updateUI();}['am','ap','vm','vp','tm','tp'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('pointerdown',()=>{const map={am:[-5,'a',0,90,1],ap:[5,'a',0,90,1],vm:[-0.2,'v',6,9,0.2],vp:[0.2,'v',6,9,0.2],tm:[-15,'t',0,90,15],tp:[15,'t',0,90,15]};add(...map[id]);});});document.getElementById('launch').addEventListener('pointerdown',()=>{if(attempts>=10)return;const score=sim();attempts++;successes+=score>60?1:0;const rate=Math.floor(successes/attempts*100);if(rate>best){best=rate;save();document.getElementById('best').textContent='最高:'+best+'%';}updateUI();let px=180+Math.cos((angle+timing)*Math.PI/180)*52,py=180+Math.sin((angle+timing)*Math.PI/180)*52;let vx=Math.cos(angle*Math.PI/180)*vel*0.9,vy=Math.sin(angle*Math.PI/180)*vel*0.9;let t=0;const loop=setInterval(()=>{t++;const dx=px-180,dy=py-180,dist=Math.hypot(dx,dy);if(dist<50||dist>170||t>120){clearInterval(loop);draw(0,{x:px,y:py});}else{const g=3800/(dist*dist);vx+=-g*dx/dist*0.08;vy+=-g*dy/dist*0.08;px+=vx*0.08;py+=vy*0.08;draw(0,{x:px,y:py});}},30);});document.getElementById('reset').addEventListener('pointerdown',()=>{attempts=successes=0;updateUI();});load();angle=params.a=45;vel=params.v=7.8;timing=params.t=0;updateUI();</script></body></html>
