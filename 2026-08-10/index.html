<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>風船ポップ</title>
<style>
body{margin:0;background:#0a0a12;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none}
#title{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.6;z-index:10}
canvas{display:block;width:100%;height:100vh;touch-action:none}
</style>
</head>
<body>
<div id="title">風船ポップ</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let w,h,balloons=[];
function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
window.onresize=resize;resize();
function addBalloon(){
  balloons.push({
    x:Math.random()*w,
    y:h+20,
    r:18+Math.random()*14,
    vy:-1.2-Math.random()*0.8,
    hue:200+Math.random()*80
  });
}
for(let i=0;i<8;i++)addBalloon();
function draw(){
  ctx.fillStyle='#0a0a12';
  ctx.fillRect(0,0,w,h);
  for(let b of balloons){
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle=`hsl(${b.hue},70%,75%)`;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x-6,b.y-6,4,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.fill();
  }
}
function update(){
  for(let i=balloons.length-1;i>=0;i--){
    let b=balloons[i];
    b.y+=b.vy;
    b.x+=Math.sin(b.y/30)*0.6;
    if(b.y<-30)balloons.splice(i,1);
  }
  if(Math.random()<0.12)addBalloon();
}
let last=0;
function loop(t=0){
  if(t-last>30){
    update();
    draw();
    last=t;
  }
  requestAnimationFrame(loop);
}
function pop(x,y){
  for(let i=balloons.length-1;i>=0;i--){
    let b=balloons[i];
    let dx=b.x-x,dy=b.y-y;
    if(dx*dx+dy*dy<b.r*b.r*1.1){
      balloons.splice(i,1);
      for(let k=0;k<3;k++)addBalloon();
      return;
    }
  }
}
c.addEventListener('pointerdown',e=>{
  const rect=c.getBoundingClientRect();
  pop(e.clientX-rect.left,e.clientY-rect.top);
});
setInterval(()=>{if(balloons.length<5)addBalloon()},1200);
loop();
</script>
</body>
</html>
