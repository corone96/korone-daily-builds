<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地震ルートタップ</title><style>body{margin:0;background:#111;color:#ddd;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;touch-action:none}header{padding:4px 8px;font-size:12px;text-align:center;border-bottom:1px solid #333}#c{width:100%;flex:1;display:block;background:#222;touch-action:none}#ui{display:flex;justify-content:space-between;padding:4px 8px;font-size:14px;background:#1a1a1a}.bar{height:4px;background:#f44;margin-top:2px}</style></head><body><header>地震ルートタップ - 避難ルートを繋げ</header><canvas id="c"></canvas><div id="ui"><div>SCORE: <span id="sc">0</span></div><div>CHAIN: <span id="ch">0</span></div></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,score=0,chain=0,nodes=[],falls=[],next=0,t=0;function resize(){W=c.clientWidth;H=Math.min(window.innerHeight-80,480);c.width=W;c.height=H}window.onresize=resize;resize();function addNode(){const y=H*0.85-nodes.length*48;nodes.push({x:W/2+Math.sin(nodes.length)*28,y,ok:false})}for(let i=0;i<7;i++)addNode();function addFall(){falls.push({x:Math.random()*W,y:-10,s:Math.random()*1.5+1.5})}setInterval(()=>{if(Math.random()<0.7)addFall()},380);function hitTest(x,y){const n=nodes[next];return n&&Math.hypot(n.x-x,n.y-y)<32}function draw(){ctx.fillStyle='#222';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(nodes[0].x,nodes[0].y);for(let n of nodes)ctx.lineTo(n.x,n.y);ctx.stroke();ctx.strokeStyle='#f44';ctx.lineWidth=6;for(let f of falls){ctx.beginPath();ctx.arc(f.x,f.y,7,0,Math.PI*2);ctx.stroke()}for(let i=0;i<nodes.length;i++){const n=nodes[i];ctx.fillStyle=i===next?'#0f8':'#444';ctx.beginPath();ctx.arc(n.x,n.y,11,0,Math.PI*2);ctx.fill();if(i<next)ctx.fillStyle='#0c0',ctx.fill()}ctx.fillStyle='#ff0';for(let f of falls)ctx.fillRect(f.x-3,f.y-3,6,6);ctx.fillStyle='#ddd';ctx.font='12px sans';ctx.fillText('避難所',W/2-20,22);ctx.fillText('START',W/2-15,H-12)}function loop(){t++;for(let i=falls.length-1;i>=0;i--){falls[i].y+=falls[i].s;if(falls[i].y>H)falls.splice(i,1)}for(let f of falls)if(next<nodes.length&&Math.hypot(f.x-nodes[next].x,f.y-nodes[next].y)<18){chain=0;document.getElementById('ch').textContent=0}draw();requestAnimationFrame(loop)}function tap(x,y){if(hitTest(x,y)){const n=nodes[next];let safe=true;for(let f of falls)if(Math.hypot(f.x-n.x,f.y-n.y)<22)safe=false;if(safe){next++;score+=10*(chain+1);chain++;document.getElementById('sc').textContent=score;document.getElementById('ch').textContent=chain;if(next>=nodes.length){alert('脱出成功! SCORE:'+score);location.reload()}}else{chain=0;document.getElementById('ch').textContent=0}}else{chain=0;document.getElementById('ch').textContent=0}}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top)});c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect(),t=e.touches[0];tap(t.clientX-r.left,t.clientY-r.top)},{passive:false});loop();</script></body></html>
