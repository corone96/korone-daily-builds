<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夏祭り輪投げ</title><style>body{margin:0;background:#112;font-family:sans-serif;color:#fff;text-align:center;touch-action:none}canvas{display:block;margin:4px auto;border:4px solid #f90;border-radius:8px;background:#224}#title{font-size:18px;margin:6px 0 2px}#info{font-size:14px;margin-bottom:4px}#score{font-size:22px;color:#ff0}</style></head><body><div id="title">夏祭り輪投げ</div><div id="info">ラウンド <span id="round">1</span>/3　スコア <span id="score">0</span></div><canvas id="c" width="320" height="420"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W=320,H=420,score=0,round=1,targets=[],rings=[],power=0,charging=false,last=0;function resize(){const s=Math.min(window.innerWidth*0.95,360);c.style.width=s+'px';c.style.height=(s*1.31)+'px';}window.onresize=resize;resize();function resetTargets(){targets=[];for(let i=0;i<5;i++)targets.push({x:40+i*55,y:70+Math.random()*40,vx:1.2+Math.random()*0.8,dir:Math.random()>0.5?1:-1});}function draw(){ctx.fillStyle='#112';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f90';ctx.fillRect(0,0,W,40);ctx.fillStyle='#224';ctx.fillRect(0,40,W,20);targets.forEach(t=>{ctx.fillStyle='#ff8';ctx.beginPath();ctx.arc(t.x,t.y,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c40';ctx.fillRect(t.x-3,t.y-22,6,12);});rings.forEach(r=>{ctx.strokeStyle='#ff0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,11,0,Math.PI*2);ctx.stroke();});if(charging){ctx.fillStyle='#0f0';ctx.fillRect(20,H-30,power*2.4,14);}ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.fillText('長押しでパワー→離して投げ',20,H-8);}function update(){targets.forEach(t=>{t.x+=t.vx*t.dir;if(t.x<30||t.x>W-30)t.dir*=-1;});rings.forEach((r,i)=>{r.y-=r.vy;r.vy*=0.985;r.vy-=0.12;if(r.y<50){targets.forEach((t,j)=>{if(Math.abs(t.x-r.x)<18&&Math.abs(t.y-r.y)<18){score+=100;document.getElementById('score').textContent=score;targets.splice(j,1);}});rings.splice(i,1);}});if(rings.length===0&&round<=3&&!charging&&Date.now()-last>800&&targets.length===0){nextRound();}draw();requestAnimationFrame(update);}function throwRing(){if(power<5)return;const r={x:W/2,y:H-60,vy:power*0.7+3};rings.push(r);power=0;charging=false;last=Date.now();}function nextRound(){round++;document.getElementById('round').textContent=round;if(round>3){alert('ゲーム終了！ スコア:'+score);score=0;round=1;document.getElementById('score').textContent=0;document.getElementById('round').textContent=1;}resetTargets();rings=[];}c.addEventListener('touchstart',e=>{e.preventDefault();charging=true;power=0;}, {passive:false});c.addEventListener('touchend',e=>{e.preventDefault();throwRing();}, {passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();if(charging){power=Math.min(80,Math.max(5,(e.touches[0].clientY-c.getBoundingClientRect().top)*0.6));}}, {passive:false});resetTargets();update();</script></body></html>
