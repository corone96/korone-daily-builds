<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>半導体リズムタップ</title><style>body{margin:0;background:#0a0f1e;color:#0ff;font-family:sans-serif;touch-action:none}canvas{display:block;margin:0 auto;background:#112;border:4px solid #0ff;max-width:100%;height:auto}#ui{text-align:center;padding:4px}#title{font-size:14px;margin:2px}#score{font-size:18px}#btn{padding:8px 20px;font-size:16px;background:#0ff;color:#000;border:none;margin:4px}</style></head><body><div id="ui"><div id="title">半導体リズムタップ by コロネ</div><canvas id="c" width="360" height="520"></canvas><div id="score">SCORE: 0</div><button id="btn">START</button></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),btn=document.getElementById('btn');let parts=[],score=0,combo=0,running=false,t=0;const lanes=3,seed=new Date().getDate()%7+1;function addPart(){const lane=Math.floor(Math.random()*lanes),y=-30+Math.random()*20;parts.push({x:60+lane*90,y, lane, hit:false});}function explode(x,y){for(let i=0;i<12;i++){ctx.fillStyle='#f80';ctx.fillRect(x+Math.random()*30-15,y+Math.random()*30-15,4,4);}}function draw(){ctx.fillStyle='#112';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#0ff';ctx.lineWidth=2;for(let i=0;i<lanes;i++){ctx.strokeRect(40+i*90,80,80,380);}ctx.fillStyle='#0f8';ctx.fillRect(0,420,360,8);parts.forEach(p=>{ctx.fillStyle=p.hit?'#0f0':'#ff0';ctx.fillRect(p.x-20,p.y,40,28);ctx.fillStyle='#000';ctx.fillRect(p.x-10,p.y+6,20,4);ctx.fillRect(p.x-10,p.y+18,20,4);});ctx.fillStyle='#f0f';ctx.font='14px sans';ctx.fillText('COMBO '+combo,20,50);}function update(){if(!running)return;t++;if(t%28===0&&parts.length<7)addPart();for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.y+=2.8+seed*0.1;if(!p.hit&&p.y>410&&p.y<450){p.hit=true;score+=100+combo*10;combo++;scoreEl.textContent='SCORE: '+score;}else if(p.y>520){if(!p.hit){combo=0;explode(p.x,p.y-10);}parts.splice(i,1);}}if(t>420){running=false;btn.textContent='RESTART';alert('FINISH! SCORE:'+score);}}function loop(){update();draw();requestAnimationFrame(loop);}function tap(e){if(!running)return;const rect=c.getBoundingClientRect();const tx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;const lane=Math.floor((tx-40)/90);let hit=false;parts.forEach(p=>{if(!p.hit&&p.lane===lane&&p.y>400&&p.y<460){p.hit=true;score+=120+combo*15;combo++;hit=true;}});if(!hit)combo=0;scoreEl.textContent='SCORE: '+score;}c.addEventListener('touchstart',tap,{passive:false});c.addEventListener('pointerdown',tap);btn.onclick=()=>{parts=[];score=0;combo=0;t=0;scoreEl.textContent='SCORE: 0';running=true;btn.textContent='PLAYING';for(let i=0;i<5;i++)addPart();};loop();</script></body></html>
