<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夏祭り金魚すくい</title><style>body{margin:0;background:#0a3d2e;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;touch-action:none}header{padding:8px;text-align:center;font-size:14px;background:#06291f}h1{margin:0;font-size:16px}#ui{display:flex;justify-content:space-between;padding:6px 12px;font-size:14px;background:#06291f}canvas{flex:1;background:#145c4a;display:block;margin:auto;max-width:100%;max-height:calc(100vh - 90px);touch-action:none}#msg{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.8}</style></head><body><header><h1>夏祭り金魚すくい</h1></header><div id="ui"><div>スコア: <span id="score">0</span></div><div>残り: <span id="time">30</span>s</div><div>連鎖: <span id="combo">0</span></div></div><canvas id="c"></canvas><div id="msg">画面をタップして網を振る</div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,score=0,combo=0,time=30,last=0,fish=[],running=true;function resize(){W=c.width=Math.floor(c.clientWidth*2);H=c.height=Math.floor(c.clientHeight*2)}function addFish(){fish.push({x:W+20,y:40+Math.random()*(H-80),vx:-1.8-Math.random()*1.2,caught:false})}function drawFish(f){if(f.caught)return;ctx.save();ctx.translate(f.x,f.y);ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.ellipse(0,0,18,8,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-28,6);ctx.lineTo(-28,-6);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(8,-2,4,4);ctx.restore()}function scoop(){let hit=false;for(let f of fish){if(f.caught||f.x<40||f.x>140)continue;const d=Math.abs(f.y-H/2);if(d<30){f.caught=true;score+=10+combo*5;combo++;hit=true;break}}if(!hit)combo=0;document.getElementById('score').textContent=score;document.getElementById('combo').textContent=combo}function loop(t){if(!last)last=t;const dt=t-last;last=t;if(running){time-=dt/1000;if(time<=0){running=false;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.fillText('終了！ スコア: '+score,W/2-120,H/2)}}ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a3d2e';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(90,H/2,35,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffeb3b';ctx.beginPath();ctx.moveTo(90,H/2-35);ctx.lineTo(55,H/2-55);ctx.stroke();for(let f of fish){if(!f.caught){f.x+=f.vx;if(f.x<-30)f.x=W+20}}for(let f of fish)drawFish(f);fish=fish.filter(f=>!f.caught||f.x>-30);if(running&&Math.random()<0.08)addFish();document.getElementById('time').textContent=Math.max(0,Math.floor(time));requestAnimationFrame(loop)}function start(){resize();window.addEventListener('resize',resize);for(let i=0;i<5;i++)addFish();c.addEventListener('pointerdown',e=>{e.preventDefault();if(running)scoop()});requestAnimationFrame(loop)}start();</script></body></html>
