<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#000;color:#fff;font:14px/1.4 sans-serif;overflow:hidden;touch-action:none}header{padding:4px 8px;font-size:12px;background:#111;display:flex;justify-content:space-between;align-items:center}canvas{display:block;background:#001122;touch-action:none}#info{padding:4px 8px;background:#111;font-size:12px;display:flex;gap:12px}</style></head><body><header>星揃え夜空パズル <span id="stage">STAGE 1/3</span></header><canvas id="c"></canvas><div id="info"><div>SCORE: <span id="sc">0</span></div><div>TIME: <span id="tm">60</span></div><div>精度: <span id="pr">--</span></div></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,stars=[],targets=[],dragging=null,score=0,stage=1,timeLeft=60,lastT=0,running=true;function resize(){W=c.width=Math.max(320,innerWidth);H=c.height=Math.max(480,innerHeight-80);initStars()}window.onresize=resize;function initStars(){stars=[];targets=[];const cx=W/2,cy=H/2-40;const base=[[ -60,-30],[-20,-50],[20,-25],[-40,10],[10,5],[50,-10],[-10,35]];for(let i=0;i<7;i++){targets.push({x:cx+base[i][0]*1.2,y:cy+base[i][1]*1.2});stars.push({x:cx+(Math.random()-0.5)*W*0.7,y:cy+(Math.random()-0.5)*H*0.6,r:3+i%2,isMoon:false});}stars.push({x:cx+120,y:cy-80,r:14,isMoon:true});}function draw(){ctx.fillStyle='#001122';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<60;i++){const x=(i*37)%W,y=(i*53)%H;ctx.fillRect(x,y,1,1);}for(const t of targets){ctx.strokeStyle='#334455';ctx.beginPath();ctx.arc(t.x,t.y,18,0,Math.PI*2);ctx.stroke();}for(const s of stars){if(s.isMoon){ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#001122';ctx.beginPath();ctx.arc(s.x+5,s.y,s.r*0.9,0,Math.PI*2);ctx.fill();}else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}}}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}function checkAlign(){let ok=0,err=0;for(let i=0;i<7;i++){const d=dist(stars[i],targets[i]);if(d<22)ok++;err+=d;}const pr=Math.max(0,Math.floor(100-err/2));document.getElementById('pr').textContent=pr+'%';if(ok===7&&running){score+=Math.floor(pr*1.2);document.getElementById('sc').textContent=score;nextStage();}}function nextStage(){stage++;if(stage>3){running=false;alert('GAME CLEAR! SCORE:'+score);return;}document.getElementById('stage').textContent='STAGE '+stage+'/3';timeLeft=55-stage*5;initStars();}function loop(t){if(!lastT)lastT=t;if(running){timeLeft-=(t-lastT)/1000;document.getElementById('tm').textContent=Math.ceil(timeLeft);if(timeLeft<=0){running=false;alert('TIME UP! SCORE:'+score);return;}checkAlign();}draw();lastT=t;requestAnimationFrame(loop);}function getPos(e){const r=c.getBoundingClientRect();return{x:(e.clientX||e.touches[0].clientX)-r.left,y:(e.clientY||e.touches[0].clientY)-r.top};}c.addEventListener('pointerdown',e=>{if(!running)return;const p=getPos(e);for(let i=stars.length-1;i>=0;i--){if(dist(stars[i],p)<stars[i].r+18){dragging=i;break;}}});c.addEventListener('pointermove',e=>{if(dragging==null)return;const p=getPos(e);stars[dragging].x=p.x;stars[dragging].y=p.y;});c.addEventListener('pointerup',()=>dragging=null);c.addEventListener('pointerleave',()=>dragging=null);resize();initStars();requestAnimationFrame(loop);</script></body></html>
