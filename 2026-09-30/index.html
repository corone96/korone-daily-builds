<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガム噛みリズム</title><style>body{margin:0;background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}header{padding:8px;font-size:14px} #game{width:100%;max-width:420px;height:70vh;background:#222;border-radius:12px;position:relative;overflow:hidden;margin:8px}canvas{width:100%;height:100%;touch-action:none}#ui{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:18px}#info{text-align:center;margin-top:8px;font-size:13px;opacity:.8}.beat{position:absolute;left:50%;top:50%;width:30px;height:30px;border:3px solid #ff0;border-radius:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .1s}</style></head><body><header>ガム噛みリズム</header><div id="game"><canvas id="c"></canvas><div id="ui"><div>スコア:<span id="sc">0</span></div><div>コンボ:<span id="cb">0</span></div></div></div><div id="info">画面をタップor長押しで噛む<br>ビートに合わせて高得点！</div><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),scEl=document.getElementById('sc'),cbEl=document.getElementById('cb'),game=document.getElementById('game');let W=300,H=500,score=0,combo=0,lastBeat=0,beatInterval=750,holding=false,stretch=0;function resize(){W=c.width=game.clientWidth;H=c.height=game.clientHeight}window.onresize=resize;resize();function draw(t){ctx.fillStyle='#222';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc(W/2,H/2,40+stretch*1.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#0a0';ctx.lineWidth=8;ctx.beginPath();ctx.arc(W/2,H/2,55+stretch,0,Math.PI*2);ctx.stroke();const phase=(t%beatInterval)/beatInterval;ctx.strokeStyle='#ff0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(W/2,H/2,90+Math.sin(phase*Math.PI*4)*8,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.fillText('ビートに合わせよう',W/2-70,H-30)}let raf;function loop(){const t=Date.now();draw(t);if(holding)stretch=Math.min(28,stretch+1.6);else stretch=Math.max(0,stretch-2.2);if(t-lastBeat>beatInterval){lastBeat=t}raf=requestAnimationFrame(loop)}loop();function hit(isLong){const now=Date.now();const diff=Math.abs((now-lastBeat)%beatInterval-beatInterval/2);let pts=10;if(diff<90)pts=50;else if(diff<180)pts=25;if(isLong)pts=Math.floor(pts*1.3);score+=pts*(combo+1);combo++;scEl.textContent=score;cbEl.textContent=combo;stretch=22+ (isLong?12:0)}function resetCombo(){combo=0;cbEl.textContent=0}let startY=0;function onDown(e){e.preventDefault();holding=true;startY=e.touches?e.touches[0].clientY:e.clientY;hit(false)}function onMove(e){if(!holding)return;e.preventDefault();const y=e.touches?e.touches[0].clientY:e.clientY;if(Math.abs(y-startY)>25){hit(true);holding=false}}function onUp(){holding=false;resetCombo()}const area=document.getElementById('game');area.addEventListener('touchstart',onDown,{passive:false});area.addEventListener('touchmove',onMove,{passive:false});area.addEventListener('touchend',onUp);area.addEventListener('pointerdown',onDown);area.addEventListener('pointermove',onMove);area.addEventListener('pointerup',onUp);setInterval(()=>{if(!holding&&combo>0)resetCombo()},1200);</script></body></html>
