<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ニュータイプ500号冒険</title><style>body{margin:0;font-family:sans-serif;background:#111;color:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh} .container{width:100%;max-width:480px;padding:16px} h1{font-size:1.6rem;margin:0 0 12px;text-align:center} .score{display:flex;justify-content:space-between;margin-bottom:16px;font-size:1.1rem} .stage{font-size:1.1rem;margin-bottom:8px;color:#0cf} .text{background:#222;padding:16px;border-radius:8px;margin-bottom:16px;line-height:1.5} .choice{background:#333;border:2px solid #555;padding:14px;margin:8px 0;border-radius:8px;cursor:pointer;touch-action:none} .choice:active{background:#0cf;color:#111;border-color:#0cf} .result{text-align:center;font-size:1.4rem;margin:20px 0} button{background:#0cf;color:#111;border:none;padding:12px 24px;font-size:1rem;border-radius:6px;margin-top:12px}</style></head><body><div class="container"><h1>ニュータイプ500号冒険</h1><div class="score"><div>スコア: <span id="score">0</span></div><div>ステージ <span id="stage">0</span>/5</div></div><div id="main"><div class="stage" id="stageTitle"></div><div class="text" id="story"></div><div id="choices"></div></div><div id="end" style="display:none"><div class="result" id="final"></div><button onclick="restart()">もう一度</button></div></div><script>let score=0;let current=0;const stages=[{title:"ステージ1 昭和50年代",story:"機動戦士ガンダムが放送された。あなたは何を選ぶ？",choices:[{text:"ガンダムに夢中になる",add:100},{text:"他のロボットアニメを見る",add:50}]},{title:"ステージ2 昭和60年代",story:"OVA文化が花開く。次に挑む作品は？",choices:[{text:"エヴァンゲリオンを待つ",add:100},{text:"普通のアニメで満足",add:50}]},{title:"ステージ3 平成初期",story:"セル画からデジタルへ移行。どう対応する？",choices:[{text:"新技術を積極的に学ぶ",add:100},{text:"昔のスタイルを守る",add:50}]},{title:"ステージ4 平成後期",story:"ネット配信が始まる。どの道を選ぶ？",choices:[{text:"ネット発アニメを応援",add:100},{text:"テレビだけ見続ける",add:50}]},{title:"ステージ5 令和",story:"500号記念号が作られる。あなたは？",choices:[{text:"ニュータイプを読み続ける",add:100},{text:"アニメから少し離れる",add:50}]}];function updateUI(){document.getElementById('score').textContent=score;document.getElementById('stage').textContent=current+1;}function showStage(){if(current>=5){endGame();return;}updateUI();const s=stages[current];document.getElementById('stageTitle').textContent=s.title;document.getElementById('story').textContent=s.story;const cdiv=document.getElementById('choices');cdiv.innerHTML='';s.choices.forEach((ch,i)=>{const d=document.createElement('div');d.className='choice';d.textContent=ch.text;d.addEventListener('pointerdown',()=>selectChoice(ch.add));cdiv.appendChild(d);});}function selectChoice(add){score+=add;current++;showStage();}function endGame(){document.getElementById('main').style.display='none';document.getElementById('end').style.display='block';const msg=score>=500?'500号到達！おめでとう！':'スコア '+score+'点。もう少し頑張ろう';document.getElementById('final').innerHTML=msg+'<br>アニメの旅は続く';}function restart(){score=0;current=0;document.getElementById('main').style.display='block';document.getElementById('end').style.display='none';showStage();}window.onload=function(){showStage();};</script></body></html>
