<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流星夜の分岐路</title><style>body{margin:0;background:#0a0f2e;color:#ddd;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh} #game{width:100%;max-width:480px;margin:0 auto;padding:16px;box-sizing:border-box} h1{font-size:18px;margin:0 0 8px;text-align:center} #score{font-size:14px;text-align:right;margin-bottom:12px} #scene{min-height:140px;padding:16px;background:#121a3d;border-radius:12px;line-height:1.5;font-size:15px} .choice{margin-top:10px;padding:14px 18px;background:#2a3a6e;border:none;border-radius:999px;color:#fff;font-size:15px;width:100%;touch-action:none} .choice:active{background:#4459a8} #end{display:none;text-align:center} .star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 1.5s infinite alternate} @keyframes tw{from{opacity:.4}to{opacity:1}}</style></head><body><div id="game"><h1>流星夜の分岐路</h1><div id="score">欠片: <span id="frag">0</span></div><div id="scene"></div><div id="choices"></div><div id="end"><p id="ending"></p><button class="choice" onclick="location.reload()">もう一度</button></div></div><script>const sceneEl=document.getElementById('scene'),choiceEl=document.getElementById('choices'),fragEl=document.getElementById('frag'),endEl=document.getElementById('end'),endTxt=document.getElementById('ending');let frag=0,step=0;function addStars(){const c=sceneEl; c.style.position='relative';for(let i=0;i<18;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=-Math.random()*2+'s';c.appendChild(s)}}function show(t,o){sceneEl.innerHTML=t;choiceEl.innerHTML='';o.forEach(op=>{const b=document.createElement('button');b.className='choice';b.textContent=op[0];b.onpointerdown=()=>op[1]();choiceEl.appendChild(b)})}function next(s){step=s;switch(s){case 0:show('夜空に一筋の光が落ちた。どちらへ向かう？',[['左の丘へ',()=>next(1)],['右の森へ',()=>next(2)]]);break;case 1:frag++;fragEl.textContent=frag;show('丘で小さな欠片を見つけた。次は？',[['川沿いへ',()=>next(3)],['星を見上げる',()=>next(4)]]);break;case 2:show('森で光が分かれた。',[['光を追う',()=>next(5)],['待つ',()=>next(6)]]);break;case 3:show('川辺で二つ目の欠片。',[['受け取る',()=>endA()],['放っておく',()=>endB()]]);break;case 4:frag++;fragEl.textContent=frag;show('空に願いを込めた。',[['そのまま進む',()=>endC()]]);break;case 5:frag++;fragEl.textContent=frag;show('光の正体が近づく。',[['触れる',()=>endA()]]);break;case 6:show('静かに夜が明ける。',[['帰る',()=>endB()]]);break}}function endA(){choiceEl.innerHTML='';endTxt.innerHTML='宇宙船の欠片だった。<br>発見数 '+frag;endEl.style.display='block'}function endB(){choiceEl.innerHTML='';endTxt.innerHTML='ただの石だった。<br>発見数 '+frag;endEl.style.display='block'}function endC(){choiceEl.innerHTML='';endTxt.innerHTML='星の願いが叶った。<br>発見数 '+frag;endEl.style.display='block'}addStars();next(0);</script></body></html>
