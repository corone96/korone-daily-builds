<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花火打ち分け</title><style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100vh} #ui{position:fixed;top:8px;left:8px;font-size:12px;opacity:.8} #title{position:fixed;bottom:8px;right:8px;font-size:11px;opacity:.5}</style></head><body><canvas id="c"></canvas><div id="ui">SCORE: <span id="sc">0</span><br>COMBO: <span id="cb">0</span></div><div id="title">花火打ち分けゲーム</div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,score=0,combo=0;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();let stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.6,r:Math.random()*1.5+0.5});let rockets=[],parts=[];let touchStart={x:0,y:0,t:0,ang:Math.PI/2,p:0};c.addEventListener('pointerdown',e=>{e.preventDefault();touchStart.x=e.clientX;touchStart.y=e.clientY;touchStart.t=Date.now();touchStart.ang=Math.PI/2;touchStart.p=0});c.addEventListener('pointermove',e=>{if(!touchStart.t)return;const dx=e.clientX-touchStart.x,dy=touchStart.y-e.clientY;touchStart.ang=Math.atan2(dy,dx);touchStart.p=Math.min(1,Math.hypot(dx,dy)/180)});c.addEventListener('pointerup',e=>{if(!touchStart.t)return;const dur=Date.now()-touchStart.t;const p=Math.max(0.4,Math.min(1,touchStart.p+(dur>400?0.3:0)));launch(touchStart.ang,p);touchStart.t=0});function launch(ang,power){const x=W/2+Math.cos(ang)*30;const y=H-30;rockets.push({x,y,vx:Math.cos(ang)*power*5.5,vy:-Math.sin(ang)*power*7-4,life:45,power});}function explode(x,y,p){for(let i=0;i<36;i++){const a=i/36*Math.PI*2+Math.random()*0.3;parts.push({x,y,vx:Math.cos(a)*(1.8+p*1.2),vy:Math.sin(a)*(1.8+p*1.2)-0.8,life:42+Math.random()*18,col:`hsl(${Math.random()*60+20},100%,${70+p*20}%)`})}}function loop(){ctx.fillStyle='#0a0a1f';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy+=0.12;r.life--;ctx.fillStyle='#ffdd88';ctx.fillRect(r.x-1,r.y-1,3,3);if(r.life<=0||r.y<80){explode(r.x,r.y,r.power);rockets.splice(i,1);score+=10+combo*3;combo++;document.getElementById('sc').textContent=score;document.getElementById('cb').textContent=combo;if(combo>5)combo=5}}for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.vx*=0.985;p.life--;ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,2,2);if(p.life<=0)parts.splice(i,1)}if(Math.random()<0.03&&parts.length<120)parts.push({x:Math.random()*W,y:H+10,vx:(Math.random()-0.5)*0.6,vy:-1.4-Math.random(),life:25,col:'#444'});requestAnimationFrame(loop)}loop();setInterval(()=>{if(combo>0)combo=Math.max(0,combo-1);document.getElementById('cb').textContent=combo},1800);</script></body></html>
