<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨順並べパズル</title><style>body{margin:0;background:#0a2540;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;touch-action:none}header{text-align:center;margin-bottom:8px}h1{font-size:18px;margin:4px 0;color:#7ec8ff}#status{display:flex;gap:16px;margin-bottom:8px;font-size:14px}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:92vw;max-width:320px;aspect-ratio:1/1;background:#112b55;padding:8px;border-radius:12px}#grid div{background:#1e4a7a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;border:3px solid #3a7bc8;cursor:pointer;user-select:none;transition:transform .1s}.rain{background:#3a7bc8;color:#fff;text-shadow:0 2px 4px #000}.over{opacity:.3}button{margin-top:12px;padding:8px 20px;font-size:14px;background:#7ec8ff;color:#0a2540;border:none;border-radius:20px}</style></head><body><header><h1>雨順並べパズル</h1><div id="status"><div>連続日数: <span id="score">0</span></div><div>雨: <span id="rain">0</span>/5</div></div></header><div id="grid"></div><div style="margin-top:8px;font-size:11px;opacity:.7">隣接タイルをスワイプで入れ替え</div><script>const grid=document.getElementById('grid');let tiles=[],score=0,rain=0,selected=null;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){grid.innerHTML='';tiles.forEach((n,i)=>{const d=document.createElement('div');d.textContent=n;d.className=n===0?'over':'';if(n>0)d.style.borderColor=n===i+1?'#7ec8ff':'#3a7bc8';d.dataset.idx=i;d.addEventListener('pointerdown',e=>startSwap(e,i));grid.appendChild(d)})}function startSwap(e,idx){selected=idx;const el=e.currentTarget||grid.children[idx];el.style.transform='scale(0.9)';function end(ev){el.style.transform='';if(ev.target&&ev.target.dataset){const to=+ev.target.dataset.idx;swapIfAdj(idx,to)}document.removeEventListener('pointerup',end);selected=null}document.addEventListener('pointerup',end,{once:true})}function swapIfAdj(a,b){const [r1,c1]=[Math.floor(a/3),a%3];const [r2,c2]=[Math.floor(b/3),b%3];if(Math.abs(r1-r2)+Math.abs(c1-c2)===1){[tiles[a],tiles[b]]=[tiles[b],tiles[a]];render();checkWin()}}function checkWin(){if(tiles.every((v,i)=>v===i+1)){score++;document.getElementById('score').textContent=score;rain=0;document.getElementById('rain').textContent=0;setTimeout(()=>{tiles=shuffle([...Array(9)].map((_,i)=>i+1));render()},280)}}function addRain(){rain++;document.getElementById('rain').textContent=rain;if(rain>=5){alert('ゲームオーバー！ 連続日数:'+score);score=0;rain=0;document.getElementById('score').textContent=0;document.getElementById('rain').textContent=0;tiles=shuffle([...Array(9)].map((_,i)=>i+1));render()}}setInterval(addRain,4200);tiles=shuffle([...Array(9)].map((_,i)=>i+1));render();</script></body></html>
