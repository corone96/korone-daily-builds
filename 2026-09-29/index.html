<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨粒リズムタップ</title><style>body{margin:0;background:#0a1628;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none}header{padding:8px 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;background:#11253f}#score{font-size:18px;font-weight:bold}#streak{color:#7cf}#canvas{display:block;width:100%;height:calc(100dvh - 52px);touch-action:none}</style></head><body><header><div>雨粒リズムタップ</div><div><span id="score">0</span> <span id="streak">×1</span></div></header><canvas id="canvas"></canvas><script>const c=document.getElementById('canvas'),ctx=c.getContext('2d');let W,H,score=0,streak=1,last=0,drops=[],particles=[],nextSpawn=0;function resize(){W=c.width=innerWidth;H=c.height=innerHeight-52}addEventListener('resize',resize);resize();function spawn(){const x=Math.random()*W; drops.push({x,y:0,r:7+Math.random()*4,t:0});}function hitTest(touchY){let best=null,bd=999;for(let d of drops){const dy=Math.abs(d.y-touchY);if(dy<bd){bd=dy;best=d}}if(best&&bd<60){const acc=1-Math.min(bd,50)/50;score+=Math.floor(100*acc*streak);streak=Math.min(streak+1,99);drops.splice(drops.indexOf(best),1);for(let i=0;i<8;i++)particles.push({x:best.x,y:best.y,vx:(Math.random()-0.5)*4,vy:Math.random()*-3-1,r:2+Math.random()*2});}else{streak=1;score=Math.max(0,score-30);for(let i=0;i<12;i++)particles.push({x:W/2+Math.random()*80-40,y:touchY,vx:(Math.random()-0.5)*5,vy:Math.random()*-2-2,r:3});}}c.addEventListener('pointerdown',e=>{e.preventDefault();hitTest(e.offsetY);});function loop(t){if(!last)last=t;const dt=t-last;last=t;ctx.fillStyle='#0a1628';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#3a5a8a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,H*0.78);ctx.lineTo(W,H*0.78);ctx.stroke();if(t>nextSpawn){spawn();nextSpawn=t+380+Math.random()*120;}for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.y+=2.8;d.t+=dt;if(d.y>H*0.85){drops.splice(i,1);streak=1;score=Math.max(0,score-20);}else{ctx.fillStyle='#7cf';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.r*=0.96;if(p.r<0.3)particles.splice(i,1);else{ctx.fillStyle='#aef';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}}ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.fillText('TAP!',W/2-40,H*0.78-18);document.getElementById('score').textContent=score;document.getElementById('streak').textContent='×'+streak;requestAnimationFrame(loop);}requestAnimationFrame(loop);</script></body></html>
