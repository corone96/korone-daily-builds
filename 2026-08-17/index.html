<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷撃キャッチャー</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}
#title{font-size:14px;margin:8px 0 4px;opacity:.7}
#ui{display:flex;gap:16px;margin:4px 0;font-size:18px}
canvas{background:#0a0a1f;border:2px solid #444;touch-action:none;width:100%;max-width:480px;height:auto}
#msg{margin:6px;font-size:16px;height:20px}
button{background:#222;color:#0f0;border:1px solid #0a0;border-radius:4px;padding:6px 14px;font-size:15px}
</style>
</head>
<body>
<div id="title">雷撃キャッチャー</div>
<div id="ui"><span>スコア: <b id="score">0</b></span><span>成功: <b id="cnt">0</b>/10</span></div>
<canvas id="c" width="480" height="640"></canvas>
<div id="msg"></div>
<button id="btn">リスタート</button>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let score=0,cnt=0,bolts=[],running=true;
const W=480,H=640;
function addBolt(){bolts.push({x:Math.random()*(W-60)+30,y:0,vy:3+Math.random()*2.5,caught:false});}
function reset(){score=0;cnt=0;bolts=[];running=true;document.getElementById('score').textContent=0;document.getElementById('cnt').textContent='0';document.getElementById('msg').textContent='';for(let i=0;i<3;i++)addBolt();}
function draw(){ctx.fillStyle='#0a0a1f';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#ff0';ctx.lineWidth=3;
for(const b of bolts){if(b.caught)continue;
ctx.beginPath();ctx.moveTo(b.x,b.y);
ctx.lineTo(b.x-4,b.y+18);ctx.lineTo(b.x+3,b.y+22);ctx.lineTo(b.x,b.y+40);ctx.stroke();}
ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText('タップでキャッチ',20,30);}
function update(){
if(!running)return;
for(let i=bolts.length-1;i>=0;i--){
const b=bolts[i];b.y+=b.vy;
if(b.y>H){if(!b.caught){score-=5;document.getElementById('score').textContent=score;}bolts.splice(i,1);addBolt();}
}
if(bolts.length<3)addBolt();
draw();
if(cnt>=10){running=false;document.getElementById('msg').textContent='ステージクリア！';}
requestAnimationFrame(update);
}
function tryCatch(x){
if(!running)return;
let hit=false;
for(const b of bolts){
if(b.caught||Math.abs(b.x-x)>28||b.y<120)continue;
b.caught=true;hit=true;score+=10;cnt++;document.getElementById('score').textContent=score;document.getElementById('cnt').textContent=cnt;break;}
if(!hit){score-=5;document.getElementById('score').textContent=score;}
}
c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect();tryCatch((e.touches[0].clientX-r.left)*W/r.width);}, {passive:false});
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();tryCatch((e.clientX-r.left)*W/r.width);});
document.getElementById('btn').onclick=()=>{reset();update();};
reset();update();
</script>
</body>
</html>
