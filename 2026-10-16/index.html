<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>九・九を剥がす</title><style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#d7d0c2;color:#221e1a;font-family:sans-serif;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}#app{height:100%;min-height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 12px 14px;gap:8px}#hud,#meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:800}#stage{flex:1;min-height:0;display:flex;flex-direction:column;background:#f6f1e7;border:3px solid #2b2723;border-radius:28px;padding:12px;box-shadow:0 10px 0 #c9c0b0}#banner{position:relative;background:#d21f28;color:#fff;border-radius:10px;min-height:46%;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .12s,transform .12s}#banner.pop{transform:scale(.97)}#tag{position:absolute;left:10px;top:8px;font-size:12px;letter-spacing:.18em;font-weight:800}#num{font-size:clamp(72px,28vw,128px);font-weight:800;line-height:.9;z-index:1;padding:28px 10px;touch-action:none}#num.bad{transform:scale(.72) rotate(-8deg);opacity:.4}#frags{position:absolute;inset:0;pointer-events:none}.frag{position:absolute;font-weight:800;animation:fall .65s linear forwards}@keyframes fall{to{transform:translateY(42vh) rotate(28deg);opacity:0}}#clues{margin-top:12px}#clues.off{opacity:0}#dlabel{font-size:14px;font-weight:800;margin-bottom:6px}#bar{position:relative;height:18px;background:#e4daca;border-radius:9px;overflow:hidden;border:1px solid #2b2723}#fill{display:block;height:100%;width:0;background:#c45a2a}.tick{position:absolute;top:0;bottom:0;width:2px;background:#2b2723}#scale{position:relative;height:16px;font-size:11px;color:#665}#scale span{position:absolute;transform:translateX(-50%)}#dots{margin-top:8px;font-size:16px;font-weight:800;letter-spacing:.08em}#reveal{min-height:2.6em;margin-top:8px;font-size:14px;font-weight:800;line-height:1.35}#cancel{height:68px;border:none;border-radius:16px;background:#2b2723;color:#fff;font-size:22px;font-weight:800;touch-action:none}#cancel:active{transform:scale(.98);background:#111}#overlay{position:fixed;inset:0;z-index:5;background:rgba(246,241,231,.97);display:flex;align-items:center;justify-content:center;padding:20px}#overlay.hidden{display:none}.card{width:min(440px,100%);text-align:center}h1{font-size:clamp(28px,8vw,40px);margin-bottom:10px}p{line-height:1.55;margin-bottom:8px;font-size:15px}button.go{margin-top:14px;min-height:56px;padding:0 28px;border:none;border-radius:14px;background:#d21f28;color:#fff;font-size:18px;font-weight:800;touch-action:none}button.go:active{transform:scale(.98)}</style></head><body><div id='app'><div id='hud'><span id='sc'>スコア 0</span><span id='tm'>残り --</span><span id='lf'>失敗 0/5</span></div><div id='meta'><span id='cn'>1/10</span><span id='ex'>正確 0</span></div><div id='stage'><div id='banner'><div id='tag'>速報</div><div id='num'>9.9</div><div id='frags'></div></div><div id='clues'><div id='dlabel'>深さ</div><div id='bar'><i id='fill'></i><b class='tick' style='left:36.36%'></b><b class='tick' style='left:63.64%'></b></div><div id='scale'><span style='left:36.36%'>80</span><span style='left:63.64%'>140</span></div><div id='dots'>揺れ点</div></div><div id='reveal'></div></div><button id='cancel' type='button'>取消</button></div><div id='overlay'><div class='card' id='titleBox'><h1>九・九を剥がす</h1><p>数字をタップすると1.0削れ、取消で今の値を確定する。</p><p>深さバーと揺れ点を手がかりに、本当の値だけ残して取り消す。</p><button id='go' class='go' type='button'>はじめる</button></div><div class='card' id='resultBox' style='display:none'><h1 id='resultHead'>結果</h1><p id='resultText'></p><button id='again' class='go' type='button'>もう一度</button></div></div><script>(function(){var state='title',score=0,fails=0,exact=0,idx=0,peels=0,value=9.9,remain=0,elapsed=0,lock=false,last=0,queue=[],cur=null;function pub(){window.__game={score:score,state:state};}pub();var hudS=document.getElementById('sc'),hudT=document.getElementById('tm'),hudL=document.getElementById('lf'),cn=document.getElementById('cn'),ex=document.getElementById('ex'),num=document.getElementById('num'),banner=document.getElementById('banner'),clues=document.getElementById('clues'),dlabel=document.getElementById('dlabel'),fill=document.getElementById('fill'),dots=document.getElementById('dots'),reveal=document.getElementById('reveal'),overlay=document.getElementById('overlay'),titleBox=document.getElementById('titleBox'),resultBox=document.getElementById('resultBox'),resultHead=document.getElementById('resultHead'),resultText=document.getElementById('resultText'),frags=document.getElementById('frags');function stageOf(d){return d==='shallow'?0:d==='mid'?1:2;}function kmOf(d){if(d==='shallow')return 40+Math.floor(Math.random()*41);if(d==='mid')return 81+Math.floor(Math.random()*60);return 141+Math.floor(Math.random()*80);}var six=[['shallow',2],['shallow',1],['mid',2],['mid',1],['deep',2],['deep',1]];function make(i){var d,s,t,flash,km;if(i===0){d='deep';s=1;t=8;flash=false;km=172;}else if(i===1){d='shallow';s=2;t=7;flash=false;km=58;}else if(i===2){d='mid';s=1;t=6;flash=false;km=116;}else{var p=six[Math.floor(Math.random()*6)];d=p[0];s=p[1];t=i<7?4.5:3.2;flash=i>=7;km=kmOf(d);}return {d:d,s:s,t:t,flash:flash,km:km};}function need(c){return stageOf(c.d)+(2-c.s);}function truth(c){return Math.round((9.9-need(c))*10)/10;}function depthName(d){return d==='shallow'?'浅':d==='mid'?'中':'深';}function paint(){hudS.textContent='スコア '+score;hudT.textContent=state==='playing'?('残り '+Math.max(0,remain).toFixed(1)+'秒'):'残り --';hudL.textContent='失敗 '+fails+'/5';cn.textContent=(idx+1)+'/10';ex.textContent='正確 '+exact;if(!cur)return;if(peels>=4||num.classList.contains('bad'))num.textContent='崩';else num.textContent=value.toFixed(1);var cols=['#d21f28','#e07a72','#f3c7be','#f7f3ec'];var inks=['#fff','#fff','#3a2424','#221e1a'];var p=Math.min(peels,3);banner.style.background=cols[p];num.style.color=inks[p];dlabel.textContent='深さ '+cur.km+'km';fill.style.width=Math.min(100,cur.km/220*100)+'%';var ds='揺れ点';for(var i=0;i<2;i++)ds+=i<cur.s?' ●':' ○';dots.textContent=ds;clues.className=(cur.flash&&elapsed>=1&&!lock)?'off':'';}function burst(){banner.classList.remove('pop');void banner.offsetWidth;banner.classList.add('pop');for(var i=0;i<7;i++){var s=document.createElement('span');s.className='frag';s.textContent=['9','.','8','7'][i%4];s.style.left=(12+Math.random()*74)+'%';s.style.top=(18+Math.random()*36)+'%';s.style.fontSize=(16+Math.random()*18)+'px';s.style.color=peels>2?'#8a4038':'#fff';frags.appendChild(s);(function(n){setTimeout(function(){if(n.parentNode)n.parentNode.removeChild(n);},680);})(s);}}function finishCase(ok,reason){if(lock)return;lock=true;var tv=truth(cur);var add=0;if(ok){add=100+Math.floor(Math.max(0,remain)*10);score+=add;exact++;}else fails++;pub();var msg=ok?'正確に取消':reason==='time'?'時間切れ':reason==='big'?'過大なまま発信':'削りすぎ';reveal.textContent=msg+' +'+add+' / 本当 '+tv.toFixed(1)+' / '+depthName(cur.d)+' '+cur.km+'km / 揺れ点'+cur.s;reveal.style.color=ok?'#1e7a3a':'#b4232a';paint();setTimeout(function(){reveal.textContent='';if(fails>=5){state='lost';pub();showEnd();return;}if(idx>=9){state=exact>=7?'won':'lost';pub();showEnd();return;}idx++;begin();},800);}function begin(){cur=queue[idx];peels=0;value=9.9;remain=cur.t;elapsed=0;lock=false;num.classList.remove('bad');reveal.textContent='';state='playing';pub();paint();}function loop(t){if(!last)last=t;var dt=(t-last)/1000;last=t;if(dt>0.1)dt=0.1;if(state==='playing'&&!lock&&cur){remain-=dt;elapsed+=dt;if(remain<=0){remain=0;paint();finishCase(false,'time');}else paint();}requestAnimationFrame(loop);}function start(){score=0;fails=0;exact=0;idx=0;queue=[];for(var i=0;i<10;i++)queue.push(make(i));overlay.classList.add('hidden');titleBox.style.display='none';resultBox.style.display='none';begin();}function showEnd(){overlay.classList.remove('hidden');titleBox.style.display='none';resultBox.style.display='block';var head=state==='won'?'勝ち':'負け';var srank=(state==='won'&&exact===10&&score>=1200)?' / S':'';resultHead.textContent=head;resultText.textContent='スコア '+score+srank+' / 正確取消 '+exact+'/10 / 失敗 '+fails;}num.addEventListener('pointerdown',function(e){e.preventDefault();if(state!=='playing'||lock)return;if(peels>=3){peels=4;num.classList.add('bad');num.textContent='崩';burst();finishCase(false,'over');return;}peels++;value=Math.round((9.9-peels)*10)/10;burst();paint();});document.getElementById('cancel').addEventListener('pointerdown',function(e){e.preventDefault();if(state!=='playing'||lock)return;var tv=truth(cur);if(Math.abs(value-tv)<0.05)finishCase(true,'ok');else if(value>tv)finishCase(false,'big');else finishCase(false,'over');});document.getElementById('go').addEventListener('pointerdown',function(e){e.preventDefault();start();});document.getElementById('again').addEventListener('pointerdown',function(e){e.preventDefault();start();});document.addEventListener('contextmenu',function(e){e.preventDefault();});requestAnimationFrame(loop);paint();})();</script></body></html>
