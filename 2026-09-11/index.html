<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追悼配置論理陣</title><style>body{margin:0;background:#111;color:#ddd;font-family:sans-serif}header{padding:4px 8px;font-size:12px;text-align:center;border-bottom:1px solid #444}.map{display:flex;gap:4px;padding:8px;justify-content:center;flex-wrap:wrap}.site{flex:1;min-width:30%;max-width:32%;border:1px solid #555;border-radius:4px;padding:4px;background:#222}.site h3{margin:0 0 4px;font-size:11px;text-align:center}.slots{display:flex;flex-direction:column;gap:4px}.slot{height:42px;border:1px dashed #666;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;touch-action:none}.slot.occupied{background:#333}.tile{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.info{font-size:10px;margin-top:8px;text-align:center}.btn{margin:8px;padding:6px 12px;background:#444;border:none;color:#ddd;border-radius:4px}.score{text-align:center;font-size:13px;margin:4px}</style></head><body><header>追悼配置論理陣</header><div class="map" id="map"></div><div class="score" id="score">条件: 各遺跡2個・同種隣接禁止・時系列順</div><div style="text-align:center"><button class="btn" id="check">配置確認</button><button class="btn" id="reset">リセット</button></div><div class="info" id="log">タップで移動／長押しで情報</div><script>const sites=['WTC','Pentagon','Shanksville'];let state=[{id:1,t:'🌸',site:0,info:'犠牲者A 2001/9:11'},{id:2,t:'🏮',site:0,info:'犠牲者B 8:46'},{id:3,t:'🌸',site:1,info:'犠牲者C 9:03'},{id:4,t:'🏮',site:1,info:'犠牲者D 9:37'},{id:5,t:'🌸',site:2,info:'犠牲者E 10:03'},{id:6,t:'🏮',site:2,info:'犠牲者F 10:28'}];let sel=null;function render(){const m=document.getElementById('map');m.innerHTML='';sites.forEach((s,i)=>{const d=document.createElement('div');d.className='site';d.innerHTML=`<h3>${s}</h3><div class="slots" id="s${i}"></div>`;m.appendChild(d);});for(let i=0;i<3;i++){const sl=document.getElementById('s'+i);sl.innerHTML='';const here=state.filter(x=>x.site===i);for(let j=0;j<2;j++){const slot=document.createElement('div');slot.className='slot';if(here[j]){const t=here[j];slot.innerHTML=`<div class="tile">${t.t}</div>`;slot.dataset.id=t.id;addTileEvents(slot,t);}else{slot.innerHTML='';}slot.onclick=()=>moveTo(slot,i,j);sl.appendChild(slot);}}document.getElementById('score').textContent='条件: 各遺跡2個・同種隣接禁止・時系列順';}function addTileEvents(el,t){let press=null;el.onpointerdown=e=>{press=setTimeout(()=>{alert(t.info);},600);};el.onpointerup=()=>clearTimeout(press);el.onpointercancel=()=>clearTimeout(press);}function moveTo(slot,site,idx){if(!sel){const id=slot.dataset.id;if(id)sel=state.find(x=>x.id==id);return;}if(sel){const old=sel.site;sel.site=site;const same=state.filter(x=>x.site===site);if(same.length>2)sel.site=old;render();sel=null;}}document.getElementById('check').onclick=()=>{let ok=true,sc=0;const cnt=[0,0,0];state.forEach(x=>cnt[x.site]++);if(cnt.every(c=>c===2))sc+=40;else ok=false;const types=state.map(x=>x.t);if(types[0]!==types[1]&&types[2]!==types[3]&&types[4]!==types[5])sc+=30;else ok=false;if(state[0].id<state[1].id&&state[2].id<state[3].id&&state[4].id<state[5].id)sc+=30;else ok=false;document.getElementById('score').textContent=ok?`完成！スコア:${sc}`:`条件未達 ${sc}点`;};document.getElementById('reset').onclick=()=>{state=[{id:1,t:'🌸',site:0,info:'犠牲者A 2001/9:11'},{id:2,t:'🏮',site:0,info:'犠牲者B 8:46'},{id:3,t:'🌸',site:1,info:'犠牲者C 9:03'},{id:4,t:'🏮',site:1,info:'犠牲者D 9:37'},{id:5,t:'🌸',site:2,info:'犠牲者E 10:03'},{id:6,t:'🏮',site:2,info:'犠牲者F 10:28'}];sel=null;render();};render();</script></body></html>
