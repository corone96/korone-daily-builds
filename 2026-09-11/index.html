<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追悼名配置論理</title><style>body{margin:0;background:#111;color:#ddd;font-family:sans-serif;text-align:center}header{font-size:12px;padding:4px} #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:92vw;margin:8px auto;background:#333;padding:4px;border-radius:4px} .cell{background:#222;height:14vw;max-height:64px;font-size:11px;display:flex;align-items:center;justify-content:center;border:1px solid #555;touch-action:none;user-select:none} .cell.placed{background:#334;color:#9cf} #names{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:8px} .name{padding:4px 8px;background:#222;border:1px solid #555;border-radius:3px;font-size:12px} .name.used{opacity:.3} #info{margin:6px;font-size:13px} button{background:#333;color:#ddd;border:1px solid #555;padding:6px 12px;margin:4px;border-radius:4px}</style></head><body><header>追悼名配置論理</header><div id="info">残り <span id="remain">9</span> / スコア <span id="score">0</span></div><div id="grid"></div><div id="names"></div><button onclick="reset()">リセット</button><script>const names=["山田","田中","鈴木","佐藤","高橋","渡辺","伊藤","小林","加藤"];const groups=[[0,1,2],[3,4,5],[6,7,8]];let grid=Array(25).fill(null);let placed=0;let score=0;function createGrid(){const g=document.getElementById("grid");g.innerHTML="";for(let i=0;i<25;i++){const c=document.createElement("div");c.className="cell";c.dataset.i=i;let press=null;c.addEventListener("pointerdown",e=>{press=setTimeout(()=>{if(grid[i]){grid[i]=null;placed--;render();}},450);});c.addEventListener("pointerup",e=>{clearTimeout(press);if(!grid[i]&&placed<9){const idx=names.findIndex((_,j)=>!grid.includes(j));if(idx>-1){grid[i]=idx;placed++;checkWin();render();}}});c.addEventListener("pointerleave",()=>clearTimeout(press));g.appendChild(c);}}function createNames(){const n=document.getElementById("names");n.innerHTML="";names.forEach((nm,i)=>{const d=document.createElement("div");d.className="name";d.textContent=nm;d.onclick=()=>{const pos=grid.indexOf(i);if(pos>-1){grid[pos]=null;placed--;render();}};n.appendChild(d);});}function render(){const cells=document.querySelectorAll(".cell");cells.forEach((c,i)=>{c.innerHTML=grid[i]!==null?names[grid[i]]+"<br><small>"+(grid[i]+1)+"</small>":"";c.className="cell"+(grid[i]!==null?" placed":"");});document.querySelectorAll(".name").forEach((d,i)=>{d.className="name"+(grid.includes(i)?" used":"");});document.getElementById("remain").textContent=9-placed;document.getElementById("score").textContent=score;}function checkWin(){if(placed!==9)return;let ok=true;const pos=[];for(let i=0;i<25;i++)if(grid[i]!==null)pos.push({r:Math.floor(i/5),c:i%5,g:groups.findIndex(gr=>gr.includes(grid[i]))});for(let a=0;a<pos.length;a++)for(let b=a+1;b<pos.length;b++){if(pos[a].r===pos[b].r||pos[a].c===pos[b].c)ok=false;if(Math.abs(pos[a].r-pos[b].r)<=1&&Math.abs(pos[a].c-pos[b].c)<=1)ok=false;if(pos[a].g===pos[b].g&&pos[a].r===pos[b].r)ok=false;}if(ok){score+=100;alert("クリア！ +100");nextLevel();}render();}function nextLevel(){grid=Array(25).fill(null);placed=0;}function reset(){grid=Array(25).fill(null);placed=0;score=0;render();}createGrid();createNames();render();</script></body></html>
