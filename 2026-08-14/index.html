<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指先の柔波</title>
<style>
body{margin:0;background:#0a0f1e;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100vh}
#title{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:#556688;font:14px/1 sans-serif;pointer-events:none;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">指先の柔波</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,ripples=[],parts=[];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
addEventListener('resize',resize);resize();
class Ripple{constructor(x,y){this.x=x;this.y=y;this.r=0;this.a=0.6}
update(){this.r+=2.2;this.a-=0.008}
draw(){ctx.strokeStyle=`rgba(120,170,255,${this.a})`;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.stroke()}}
class Part{constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*1.2;this.vy=(Math.random()-0.5)*1.2;this.a=0.7;this.life=60}
update(){this.x+=this.vx;this.y+=this.vy;this.vx*=0.985;this.vy*=0.985;this.life--;this.a=this.life/60}
draw(){ctx.fillStyle=`rgba(160,200,255,${this.a})`;ctx.fillRect(this.x-1,this.y-1,2,2)}}
function addRipple(x,y){ripples.push(new Ripple(x,y));for(let i=0;i<8;i++)parts.push(new Part(x,y))}
function loop(){ctx.fillStyle='rgba(10,15,30,0.35)';ctx.fillRect(0,0,W,H);
ripples=ripples.filter(r=>{r.update();r.draw();return r.a>0.05});
parts=parts.filter(p=>{p.update();p.draw();return p.life>0});
requestAnimationFrame(loop)}
loop();
function handle(e){e.preventDefault();const t=e.touches?e.touches[0]:e;addRipple(t.clientX,t.clientY)}
c.addEventListener('touchstart',handle,{passive:false});
c.addEventListener('pointerdown',handle);
</script>
</body>
</html>
