<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雷雨ドッジラン</title><style>body{margin:0;background:#0a1628;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}header{padding:8px;font-size:14px;opacity:.8}#score{font-size:18px;margin:4px}#c{border:3px solid #334455;background:#112233;border-radius:8px;max-width:95vw;max-height:80vh}</style></head><body><header>雷雨ドッジラン</header><div id="score">0.0s</div><canvas id="c" width="360" height="600"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let playerX=180,objs=[],score=0,startT=0,running=false;function reset(){playerX=180;objs=[];score=0;startT=Date.now();running=true}function addObj(){const t=Math.random()<.2?'thunder':'rain';objs.push({x:20+Math.random()*320,y:-20,type:t,s:1.8+Math.random()*1.2})}function hit(o){const d=Math.abs(o.x-playerX);return o.type==='rain'?d<18&&o.y>540&&o.y<590:d<22&&o.y>535&&o.y<595}c.addEventListener('pointerdown',e=>{if(!running){reset();return}const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*360;playerX=x<180?Math.max(30,playerX-70):Math.min(330,playerX+70)});function loop(){ctx.fillStyle='#112233';ctx.fillRect(0,0,360,600);if(running){score=(Date.now()-startT)/1000;document.getElementById('score').textContent=score.toFixed(1)+'s';if(Math.random()<.12)addObj();for(let i=objs.length-1;i>=0;i--){const o=objs[i];o.y+=o.s;ctx.fillStyle=o.type==='rain'?'#7cf':'#ff0';if(o.type==='rain'){ctx.fillRect(o.x-2,o.y,4,14)}else{ctx.fillRect(o.x-3,o.y,6,22);ctx.fillRect(o.x-8,o.y+8,16,4)}if(hit(o)){running=false;break}if(o.y>610)objs.splice(i,1)}}ctx.fillStyle='#4af';ctx.fillRect(playerX-14,555,28,35);ctx.fillStyle='#fff';ctx.fillRect(playerX-5,540,10,18);ctx.fillStyle='#222';ctx.fillRect(playerX-8,562,6,6);ctx.fillRect(playerX+2,562,6,6);if(!running){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,360,600);ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.fillText('GAME OVER',100,280);ctx.font='18px sans-serif';ctx.fillText('タップでリスタート',95,320)}requestAnimationFrame(loop)}reset();loop();</script></body></html>
