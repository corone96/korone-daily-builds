<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>体育の日軌道探検</title><style>body{margin:0;background:#0a1628;color:#eee;font-family:sans-serif;line-height:1.5}header{padding:8px 12px;font-size:13px;background:#112b4a;border-bottom:2px solid #3a7}main{padding:12px;max-width:640px;margin:0 auto}.stage{background:#112b4a;border-radius:12px;padding:16px;margin-bottom:12px}.scene{font-size:15px;margin:8px 0 16px}.choice{display:block;width:100%;margin:8px 0;padding:14px 18px;background:#1e4a7a;border:none;border-radius:999px;color:#fff;font-size:15px;text-align:left} .choice:active{background:#2a6ab0}.info{font-size:12px;color:#8ab}.end{padding:20px;background:#1a3a5e;border-radius:12px;text-align:center}.bar{height:6px;background:#3a7;border-radius:3px;margin:8px 0}</style></head><body><header>体育の日軌道探検 <span style="font-size:10px;color:#68a">v1.0</span></header><main><div id="ui"><div class="stage"><div class="info">ステージ <span id="st">1</span>/4　収集 <span id="cnt">0</span>/5</div><div class="bar"><div id="prog" style="width:25%;height:100%;background:#6cf"></div></div><div id="scene" class="scene">体育の日の朝。東京駅のホームに立つ。左の特急か、右の普通列車か？</div><button class="choice" onclick="choose(0)">左：特急「スポーツ号」へ</button><button class="choice" onclick="choose(1)">右：各停で裏路線へ</button></div></div><div id="end" style="display:none" class="end"><div id="result"></div><button onclick="reset()" style="margin-top:12px;padding:10px 20px;border-radius:999px;background:#3a7;border:none;color:#fff">もう一度探検</button></div></main><script>let stage=1,col=0,seen=new Set();const scenes=[["特急車両の運転席裏。隠しエピソード：スポーツ選手の団体移動を担当した車両だった。","各停の車内広告に体育の日限定の秘密メッセージ。車両基地の話が聞けた。"],["分岐で貨物線へ。意外な保存車両を発見。","普通列車でローカル駅。地域の体育祭エピソードを入手。"],["トンネル内で夜間工事の裏側。","車両の塗装ヒストリーを学んだ。"],["最終到達。スポーツの日鉄道イベントの全貌。","隠し車両基地の写真エピソード。"]];function update(){document.getElementById('st').textContent=stage;document.getElementById('cnt').textContent=col;document.getElementById('prog').style.width=(stage*25)+'%'}function choose(c){const s=scenes[stage-1][c];if(!seen.has(stage+'-'+c)){seen.add(stage+'-'+c);col++;update()}const ui=document.getElementById('ui');if(stage<4){stage++;ui.innerHTML=`<div class="stage"><div class="info">ステージ <span id="st">${stage}</span>/4　収集 <span id="cnt">${col}</span>/5</div><div class="bar"><div id="prog" style="width:${stage*25}%;height:100%;background:#6cf"></div></div><div id="scene" class="scene">${s}</div><button class="choice" onclick="choose(0)">左分岐</button><button class="choice" onclick="choose(1)">右分岐</button></div>`;update()}else{ui.style.display='none';const end=document.getElementById('end');end.style.display='block';document.getElementById('result').innerHTML=`<h3>探検完了！</h3><p>収集数：${col}/5</p><p>${col>=4?'隠れたエピソードをほぼ制覇！':'もう少し分岐を試そう'}<br>体育の日の鉄道裏側を探索した。</p>`}}function reset(){stage=1;col=0;seen.clear();document.getElementById('ui').style.display='block';document.getElementById('end').style.display='none';document.getElementById('ui').innerHTML=`<div class="stage"><div class="info">ステージ <span id="st">1</span>/4　収集 <span id="cnt">0</span>/5</div><div class="bar"><div id="prog" style="width:25%;height:100%;background:#6cf"></div></div><div id="scene" class="scene">体育の日の朝。東京駅のホームに立つ。左の特急か、右の普通列車か？</div><button class="choice" onclick="choose(0)">左：特急「スポーツ号」へ</button><button class="choice" onclick="choose(1)">右：各停で裏路線へ</button></div>`;update()}update();</script></body></html>
