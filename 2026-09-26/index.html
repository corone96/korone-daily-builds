<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>収穫月彩り器</title><style>body{margin:0;background:#0a0f1e;color:#ddd;font-family:sans-serif;text-align:center}canvas{display:block;margin:8px auto;background:#111;border-radius:12px;box-shadow:0 0 20px #334}header{font-size:14px;margin:8px 0 0} #score{font-size:18px;color:#ffcc66;margin:4px} .goal{color:#ff8}</style></head><body><header>収穫月彩り器</header><canvas id="c" width="320" height="420"></canvas><div>調和スコア：<span id="score">0</span>/80</div><div id="msg" style="font-size:13px;margin-top:4px"></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),msgEl=document.getElementById('msg');let W=320,H=420;const moon={x:W/2,y:90,r:42};const crops=[{type:'pumpkin',x:80,y:220,r:38,idx:0},{type:'leaf',x:160,y:280,r:32,idx:0},{type:'apple',x:240,y:220,r:30,idx:0}];const palettes={pumpkin:[['#e85d04','#ffba08'],['#d62828','#f77f00'],['#2d6a4f','#40916c']],leaf:[['#2d6a4f','#52b788'],['#b7e4c7','#95d5b2'],['#d62828','#f48c06']],apple:[['#d62828','#f77f00'],['#e85d04','#ffba08'],['#6c757d','#adb5bd']]};let score=0,completed=false;function draw(){ctx.fillStyle='#0a0f1e';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(moon.x,moon.y,moon.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9c4';ctx.beginPath();ctx.arc(moon.x-12,moon.y-10,8,0,Math.PI*2);ctx.fill();crops.forEach(cr=>{const pal=palettes[cr.type][cr.idx];if(cr.type==='pumpkin'){ctx.fillStyle=pal[0];ctx.beginPath();ctx.ellipse(cr.x,cr.y,cr.r,cr.r*0.75,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=pal[1];ctx.fillRect(cr.x-3,cr.y-cr.r*0.9,6,cr.r*0.5);ctx.fillStyle='#3d5a3d';ctx.fillRect(cr.x-2,cr.y-cr.r*1.1,4,8)}else if(cr.type==='leaf'){ctx.fillStyle=pal[0];ctx.beginPath();ctx.ellipse(cr.x,cr.y,cr.r,cr.r*0.55,0.6,0,Math.PI*2);ctx.fill();ctx.fillStyle=pal[1];ctx.beginPath();ctx.moveTo(cr.x,cr.y-cr.r*0.4);ctx.lineTo(cr.x+cr.r*0.3,cr.y+cr.r*0.2);ctx.strokeStyle='#1b4332';ctx.lineWidth=2;ctx.stroke()}else{ctx.fillStyle=pal[0];ctx.beginPath();ctx.arc(cr.x,cr.y,cr.r,0,Math.PI*2);ctx.fill();ctx.fillStyle=pal[1];ctx.beginPath();ctx.arc(cr.x+cr.r*0.25,cr.y-cr.r*0.25,cr.r*0.35,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3d5a3d';ctx.fillRect(cr.x-2,cr.y+cr.r*0.6,4,14)}});if(completed){ctx.fillStyle='#ffcc66';ctx.font='bold 16px sans-serif';ctx.fillText('🌕 収穫夜！ 月が笑ってる',W/2-110,H-30);ctx.fillStyle='#8d5524';ctx.fillRect(120,340,80,25);ctx.fillStyle='#ffeb3b';ctx.fillText('🍂 満腹',135,357)}}function calcScore(){score=0;crops.forEach((cr,i)=>{const p=palettes[cr.type][cr.idx][0];if(p.includes('e85')||p.includes('d62')||p.includes('2d6'))score+=22});scoreEl.textContent=score;completed=score>=80;if(completed)msgEl.innerHTML='<span class="goal">ユーモア収穫イラスト完成！</span>';else msgEl.textContent='タップで色・形を変更';draw()}c.addEventListener('pointerdown',e=>{if(completed)return;const rect=c.getBoundingClientRect();const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);crops.forEach(cr=>{const d=Math.hypot(x-cr.x,y-cr.y);if(d<cr.r+12){cr.idx=(cr.idx+1)%3;calcScore()}})});function resize(){const max=Math.min(window.innerWidth*0.92,340);c.style.width=max+'px';c.style.height=(max*H/W)+'px'}window.addEventListener('resize',resize);resize();calcScore();</script></body></html>
