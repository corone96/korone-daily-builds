<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時空レイヤーパズル</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center;touch-action:none}
#title{font-size:14px;margin:8px;color:#888}
#scene{width:100%;max-width:360px;height:420px;border:4px solid #444;position:relative;overflow:hidden;background:#222;margin:8px}
.layer{position:absolute;left:0;right:0;height:33.3%;display:flex;align-items:center;justify-content:center;font-size:28px;border-bottom:2px solid #555;cursor:pointer;user-select:none}
.layer:active{filter:brightness(1.3)}
#status{margin:4px;font-size:13px;color:#0f0}
#target{font-size:12px;color:#888;margin-bottom:8px}
.clear{position:absolute;inset:0;background:rgba(0,200,100,.85);display:none;align-items:center;justify-content:center;font-size:32px;font-weight:bold}
</style>
</head>
<body>
<div id="title">時空レイヤーパズル</div>
<div id="scene">
  <div id="l0" class="layer" style="top:0;background:#3a5f7b">空</div>
  <div id="l1" class="layer" style="top:33.3%;background:#2e4a2e">山・森</div>
  <div id="l2" class="layer" style="top:66.6%;background:#4a3a2e;border-bottom:none">建物</div>
  <div id="clear" class="clear">CLEAR!</div>
</div>
<div id="target">目標: すべて「現在」</div>
<div id="status">タップで時代をシフト</div>
<script>
const layers=[0,0,0];
const target=[1,1,1];
const colors=[
  ['#3a5f7b','#2e4a2e','#4a3a2e'],
  ['#87ceeb','#ffd700','#6a5acd'],
  ['#5d4037','#8d6e63','#ffcc80']
];
const names=['過去','現在','未来'];

function update(){
  for(let i=0;i<3;i++){
    const el=document.getElementById('l'+i);
    el.style.background=colors[i][layers[i]];
    el.innerHTML=names[layers[i]];
  }
  if(layers.every((v,i)=>v===target[i])){
    document.getElementById('clear').style.display='flex';
    document.getElementById('status').innerHTML='シーン完成！';
  }
}

function shift(i){
  layers[i]=(layers[i]+1)%3;
  update();
}

for(let i=0;i<3;i++){
  const el=document.getElementById('l'+i);
  el.addEventListener('pointerdown',()=>shift(i),{passive:true});
  el.addEventListener('touchstart',e=>{e.preventDefault();shift(i)},{passive:false});
}

update();
</script>
</body>
</html>
