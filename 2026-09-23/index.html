<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プラス1皿彩り器</title><style>body{margin:0;font-family:sans-serif;background:#f8f1e3;color:#333}header{padding:8px;text-align:center;font-size:14px;color:#666}main{padding:8px;max-width:480px;margin:0 auto}#plate{position:relative;width:100%;aspect-ratio:1/1;max-width:360px;margin:0 auto;background:#fff;border:12px solid #e8b07a;border-radius:50%;box-shadow:inset 0 0 40px #ddd,0 4px 12px #0002;overflow:hidden;touch-action:none}#plate .item{position:absolute;font-size:28px;transition:transform .2s;user-select:none;pointer-events:none}#controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}#controls button{padding:14px 0;font-size:28px;background:#fff;border:2px solid #e8b07a;border-radius:12px;cursor:pointer;touch-action:manipulation}#controls button:active{background:#ffe8c2}#score{text-align:center;margin:12px 0;font-size:18px;font-weight:bold}#comment{text-align:center;font-size:15px;color:#555;min-height:24px}</style></head><body><header>プラス1皿彩り器</header><main><div id="plate"></div><div id="score">多様性:0 / ボリューム:0</div><div id="comment">野菜をタップして皿を彩ろう！</div><div id="controls"></div></main><script>const plate=document.getElementById('plate');const scoreEl=document.getElementById('score');const commentEl=document.getElementById('comment');const controls=document.getElementById('controls');const veggies=['🍅','🥕','🍎','🥦','🍌','🥒','🍊','🥬','🍓'];let items=[];let counts=new Array(9).fill(0);function addItem(i){if(items.length>24)return;counts[i]++;const el=document.createElement('div');el.className='item';el.textContent=veggies[i];const x=30+Math.random()*plate.clientWidth*0.55;const y=30+Math.random()*plate.clientHeight*0.55;el.style.left=x+'px';el.style.top=y+'px';const rot=(Math.random()-0.5)*40;const sc=0.9+Math.min(counts[i]*0.03,0.6);el.style.transform=`rotate(${rot}deg) scale(${sc})`;plate.appendChild(el);items.push(el);updateScore();if(items.length%4===0)commentEl.textContent=getComment();}function updateScore(){const diversity=counts.filter(c=>c>0).length;const volume=items.length;scoreEl.textContent=`多様性:${diversity} / ボリューム:${volume}`;}function getComment(){const v=items.length;if(v<3)return'いいスタート！';if(v<6)return'色が増えてきたね';if(v<10)return'バランス良さそう！';if(v<15)return'栄養満点の山！';return'1日分クリア！ごちそうさま';}veggies.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.addEventListener('pointerdown',e=>{e.preventDefault();addItem(i);});controls.appendChild(b);});plate.addEventListener('pointerdown',e=>{if(items.length===0)commentEl.textContent='まずは下のアイコンをタップ！';});</script></body></html>
