<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>税率お買い物スワイプ</title><style>body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center;overflow:hidden;touch-action:none}canvas{display:block;margin:0 auto;border:2px solid #0f0;background:#222}#info{font-size:14px;margin:4px}#title{font-size:12px;color:#888;margin:2px}</style></head><body><div id="title">税率お買い物スワイプ</div><div id="info">スコア: <span id="score">0</span>　税率: <span id="tax">8%</span></div><canvas id="c" width="360" height="600"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W=360,H=600,cartX=180,score=0,tax=8,bonus=false,items=[],miss=0,playing=true,lastTax=Date.now();function reset(){items=[];score=0;miss=0;cartX=180;tax=8;bonus=false;playing=true;document.getElementById('score').textContent=0;document.getElementById('tax').textContent='8%';}function spawn(){items.push({x:Math.random()*(W-40)+20,y:0});}function draw(){ctx.fillStyle='#222';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0f0';ctx.fillRect(cartX-30,H-60,60,40);ctx.fillStyle='#fff';ctx.fillText('カート',cartX-15,H-35);ctx.fillStyle=bonus?'#ff0':'#0ff';for(let it of items){ctx.beginPath();ctx.arc(it.x,it.y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.fillText('食材',it.x-12,it.y+4);ctx.fillStyle=bonus?'#ff0':'#0ff';}ctx.fillStyle='#fff';ctx.fillText('miss:'+miss,10,20);}function update(){if(!playing)return;let now=Date.now();if(now-lastTax>12000){tax=tax===8?10:8;bonus=(now%17000<5000);lastTax=now;document.getElementById('tax').textContent=tax+'%'+(bonus?'×2':'');}if(Math.random()<0.06)spawn();for(let i=items.length-1;i>=0;i--){let it=items[i];it.y+=2.8+(bonus?0.6:0);if(it.y>H-50&&Math.abs(it.x-cartX)<40){score+=bonus?20:10;items.splice(i,1);document.getElementById('score').textContent=score;}else if(it.y>H){items.splice(i,1);miss++;if(miss>4){playing=false;setTimeout(()=>alert('ゲームオーバー！スコア:'+score),10);}}}}function loop(){update();draw();requestAnimationFrame(loop);}c.addEventListener('pointerdown',e=>{if(!playing)return;cartX=Math.max(30,Math.min(W-30,e.offsetX));});c.addEventListener('pointermove',e=>{if(!playing||!e.pressure)return;cartX=Math.max(30,Math.min(W-30,e.offsetX));});setInterval(()=>{if(playing&&items.length<9)spawn();},900);reset();loop();</script></body></html>
