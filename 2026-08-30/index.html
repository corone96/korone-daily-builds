<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EU交渉バランスツール</title><style>body{margin:0;font-family:sans-serif;background:#f0f4f8;color:#222}header{padding:8px;text-align:center;font-size:13px;color:#555;border-bottom:1px solid #ddd}.scenarios{display:flex;gap:4px;padding:8px;justify-content:center;flex-wrap:wrap}.scenarios button{padding:6px 10px;border:1px solid #888;background:#fff;border-radius:6px;font-size:12px}.balance{margin:10px;padding:10px;background:#fff;border-radius:8px;box-shadow:0 1px 3px #0001}.policy{margin:12px 0}.track{position:relative;height:28px;background:#e0e7ee;border-radius:14px;margin-top:4px}.handle{position:absolute;top:2px;width:64px;height:24px;background:#3b82f6;border-radius:12px;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px #0003;touch-action:none}.meter{height:10px;background:#22c55e;border-radius:5px;margin-top:6px;transition:width .2s}.result{margin:12px;padding:10px;background:#fff;border-radius:8px;border:2px solid #3b82f6;text-align:center;font-size:14px;display:none}</style></head><body><header>EU交渉バランスツール <small>by コロネ</small></header><div class="scenarios"><button onclick="loadScenario(0)">漁業</button><button onclick="loadScenario(1)">農業</button><button onclick="loadScenario(2)">環境</button></div><div class="balance" id="balance"><div id="policies"></div><div style="margin-top:12px;font-size:12px;color:#555">合意ライン: <span id="thresh">75</span>%</div><div class="meter" id="meter" style="width:40%"></div></div><button onclick="negotiate()" style="display:block;margin:10px auto;padding:10px 24px;background:#3b82f6;color:#fff;border:none;border-radius:20px;font-size:15px">合意を試みる</button><div class="result" id="result"></div><script>let current=0;const scenarios=[{name:'漁業',policies:[{label:'EU漁獲枠',pos:30},{label:'国内資源保護',pos:70}],thresh:75},{name:'農業',policies:[{label:'EU補助金',pos:45},{label:'国内自給率',pos:55}],thresh:70},{name:'環境',policies:[{label:'EU基準適合',pos:25},{label:'国内産業保護',pos:80}],thresh:80}];function loadScenario(i){current=i;const s=scenarios[i];document.getElementById('thresh').textContent=s.thresh;const cont=document.getElementById('policies');cont.innerHTML='';s.policies.forEach((p,j)=>{const row=document.createElement('div');row.className='policy';row.innerHTML=`<div style="font-size:12px">${p.label}</div><div class="track" id="track${j}"><div class="handle" id="h${j}" style="left:${p.pos}%">${p.pos}</div></div>`;cont.appendChild(row);const h=document.getElementById('h'+j);const t=document.getElementById('track'+j);let dragging=false;h.addEventListener('pointerdown',e=>{dragging=true;h.setPointerCapture(e.pointerId)});document.addEventListener('pointermove',e=>{if(!dragging)return;const r=t.getBoundingClientRect();let pct=(e.clientX-r.left)/r.width*100;pct=Math.max(5,Math.min(95,pct));h.style.left=pct+'%';h.textContent=Math.round(pct);p.pos=Math.round(pct);updateMeter()});document.addEventListener('pointerup',()=>{dragging=false})});updateMeter()}function updateMeter(){const s=scenarios[current];let avg=s.policies.reduce((a,b)=>a+b.pos,0)/s.policies.length;document.getElementById('meter').style.width=avg+'%'}function negotiate(){const s=scenarios[current];let avg=s.policies.reduce((a,b)=>a+b.pos,0)/s.policies.length;const r=document.getElementById('result');r.style.display='block';if(avg>=s.thresh){r.innerHTML=`<b>成功！</b><br>スコア: ${Math.round(avg)}<br>アイスランドのEU加盟交渉成立`;r.style.borderColor='#22c55e'}else{r.innerHTML=`<b>不成立</b><br>スコア: ${Math.round(avg)}<br>バランスを調整して再挑戦`;r.style.borderColor='#ef4444'}}loadScenario(0)</script></body></html>
