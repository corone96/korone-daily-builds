<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一気差し祭探索</title><style>body{margin:0;font-family:sans-serif;background:#1a120b;color:#f5e8c7;display:flex;flex-direction:column;height:100vh}header{padding:8px;text-align:center;border-bottom:2px solid #e07a3d;font-size:14px}main{flex:1;display:flex;flex-direction:column;padding:8px;gap:8px} #stage{display:flex;justify-content:center;align-items:center;height:120px;background:#2c2118;border:3px solid #e07a3d;position:relative;overflow:hidden} .path{height:6px;background:#e07a3d;width:90%;position:absolute;top:50%;left:5%} .stall{position:absolute;width:60px;height:60px;background:#c2410c;border:4px solid #f5e8c7;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;transition:all .2s} #info{text-align:center;font-size:13px} #actions{display:grid;grid-template-columns:1fr 1fr;gap:8px} button{padding:16px;font-size:15px;background:#e07a3d;color:#1a120b;border:none;border-radius:6px;font-weight:bold} button:active{background:#c2410c;color:#f5e8c7} #msg{padding:6px;text-align:center;font-size:13px;min-height:20px} footer{padding:6px;text-align:center;font-size:10px;opacity:.6}</style></head><body><header>一気差し祭探索</header><main><div id="stage"><div class="path"></div><div id="stall">🏮</div></div><div id="info">ステージ <span id="st">1</span>/3　残り体力 <span id="hp">3</span></div><div id="msg"></div><div id="actions"><button id="b1" ontouchstart="act(0)" onclick="act(0)">左に寄る</button><button id="b2" ontouchstart="act(1)" onclick="act(1)">右に寄る</button><button id="b3" ontouchstart="act(2)" onclick="act(2)">止まる</button><button id="b4" ontouchstart="act(3)" onclick="act(3)">一気に進む</button></div></main><footer>タップでタイミングよく選択</footer><script>let stage=1,hp=3,running=false;const stall=document.getElementById('stall'),msg=document.getElementById('msg'),stEl=document.getElementById('st'),hpEl=document.getElementById('hp');function resetUI(){stEl.textContent=stage;hpEl.textContent=hp;stall.style.left='20%';stall.style.top='40%';msg.textContent='路地を進む…タップ！';running=true}function fail(){hp--;hpEl.textContent=hp;running=false;if(hp<=0){msg.textContent='祭り失敗…リトライ';setTimeout(()=>{stage=1;hp=3;resetUI()},1200)}else{msg.textContent='失敗…もう一度';setTimeout(()=>{resetUI()},900)}}function success(){running=false;msg.textContent='成功！次の舞台へ';stage++;if(stage>3){msg.textContent='一気差し成功！お疲れ様！';setTimeout(()=>{stage=1;hp=3;resetUI()},1800)}else{setTimeout(()=>{resetUI()},1100)}}function act(n){if(!running)return;const s=stall;const pos=parseInt(s.style.left)||20;if(stage===1){if((n===0&&pos<50)||(n===1&&pos>20)||(n===3&&Math.random()>.4))success();else fail()}else if(stage===2){if(n===3&&Math.random()>.5)success();else if(n===2)success();else fail()}else{if(n===0||n===1)success();else fail()}}window.onload=function(){resetUI();setInterval(()=>{if(running){const s=stall;let p=parseInt(s.style.left)||20;p+=Math.random()*6-2.5;s.style.left=Math.max(10,Math.min(75,p))+'%'}},420)}</script></body></html>
