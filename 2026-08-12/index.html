<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指先の光跡</title>
<style>
body{margin:0;overflow:hidden;background:#0a0f1e;touch-action:none}
canvas{display:block}
#title{position:fixed;top:12px;left:12px;font:14px/1 sans-serif;color:#5a6a8a;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">指先の光跡</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,parts=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
addEventListener('resize',resize);resize();
class P{
constructor(x,y,vx,vy,l){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.l=l;this.a=1}
upd(){
this.x+=this.vx;this.y+=this.vy;this.vx*=0.992;this.vy*=0.992;
this.l--;this.a=this.l/80;
if(this.x<0||this.x>w)this.vx*=-1;if(this.y<0||this.y>h)this.vy*=-1;
}
draw(){
ctx.fillStyle=`hsla(200,80%,85%,${this.a})`;
ctx.fillRect(this.x,this.y,2.2,2.2);
}
}
function burst(x,y){
for(let i=0;i<18;i++){
const a=Math.random()*Math.PI*2,v=0.6+Math.random()*0.7;
parts.push(new P(x,y,Math.cos(a)*v,Math.sin(a)*v,80+Math.random()*25));
}
}
function loop(){
ctx.fillStyle='rgba(10,15,30,0.28)';ctx.fillRect(0,0,w,h);
parts=parts.filter(p=>p.l>0);
for(const p of parts){p.upd();p.draw()}
requestAnimationFrame(loop);
}
loop();
function addTouch(e){
const t=e.touches?e.touches[0]:e;
burst(t.clientX,t.clientY);
}
c.addEventListener('pointerdown',addTouch);
c.addEventListener('touchstart',e=>{e.preventDefault();addTouch(e)},{passive:false});
setInterval(()=>{if(parts.length<60)parts.push(new P(Math.random()*w,Math.random()*h,(Math.random()-0.5)*0.3,(Math.random()-0.5)*0.3,120))},1200);
</script>
</body>
</html>
