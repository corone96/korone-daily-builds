<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>船出音楽ミキサー</title>
<style>
body{margin:0;background:#0a2540;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;touch-action:none}
header{padding:8px 12px;background:#112b5c;text-align:center}
h1{margin:0;font-size:18px}
#score{font-size:14px;margin-top:4px;color:#7cf}
#main{flex:1;display:flex;flex-direction:column;padding:10px;gap:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;flex:1}
button.instr{width:100%;height:100%;min-height:78px;border:none;border-radius:12px;background:#1e4a7a;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;flex-direction:column;touch-action:none}
button.instr.active{background:#3a8a5c}
#wave{height:60px;background:#0d2e55;border-radius:8px;position:relative;overflow:hidden}
#wave::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#fff2 0,#fff1 50%,#fff2 100%);animation:wave 2.2s linear infinite}
@keyframes wave{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
#ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#ctrl button{padding:8px 16px;border:none;border-radius:20px;background:#1e4a7a;color:#fff;font-size:14px}
#saved{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#saved button{font-size:12px;padding:4px 8px}
</style>
</head>
<body>
<header>
<h1>船出音楽ミキサー</h1>
<div id="score">スコア: 0</div>
</header>
<div id="main">
<div id="wave"></div>
<div id="grid"></div>
<div id="ctrl">
<button id="reset">リセット</button>
<button id="save">保存</button>
</div>
<div id="saved"></div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let ctx=new AC();
let nodes={};
let active=new Set();
const instruments=[
{name:'波',type:'wave',color:'#3a7ca5'},
{name:'ドラム',type:'drum',color:'#c45'},
{name:'ホーン',type:'horn',color:'#e85'},
{name:'ベル',type:'bell',color:'#7c3'},
{name:'ピアノ',type:'piano',color:'#a3c'}
];
function createSound(type){
  if(nodes[type])return;
  const g=ctx.createGain();
  g.gain.value=0.6;
  let o;
  if(type==='wave'){
    o=ctx.createOscillator();o.type='sine';o.frequency.value=48;
    const n=ctx.createOscillator();n.type='sine';n.frequency.value=62;
    const ng=ctx.createGain();ng.gain.value=0.4;
    n.connect(ng);ng.connect(g);
  }else if(type==='drum'){
    o=ctx.createOscillator();o.type='sine';o.frequency.value=70;
    const ng=ctx.createGain();ng.gain.value=0.8;
    o.connect(ng);ng.connect(g);
    setInterval(()=>{if(active.has('drum')){o.frequency.setValueAtTime(70,ctx.currentTime);ng.gain.setValueAtTime(0.8,ctx.currentTime);ng.gain.linearRampToValueAtTime(0.01,ctx.currentTime+0.4)}},620);
  }else if(type==='horn'){
    o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=98;
  }else if(type==='bell'){
    o=ctx.createOscillator();o.type='sine';o.frequency.value=620;
    setInterval(()=>{if(active.has('bell')){o.frequency.setValueAtTime(620,ctx.currentTime);o.frequency.linearRampToValueAtTime(380,ctx.currentTime+1.8)}},2400);
  }else{
    o=ctx.createOscillator();o.type='triangle';o.frequency.value=330;
  }
  if(o)o.connect(g);
  g.connect(ctx.destination);
  if(o)o.start();
  nodes[type]=g;
}
function toggle(i){
  const t=instruments[i].type;
  if(!ctx)ctx=new AC();
  if(active.has(t)){
    active.delete(t);
    if(nodes[t])nodes[t].gain.value=0;
  }else{
    active.add(t);
    createSound(t);
    nodes[t].gain.value=0.6;
  }
  document.querySelectorAll('#grid button')[i].classList.toggle('active',active.has(t));
  updateScore();
}
function updateScore(){
  const s=active.size*18+12;
  document.getElementById('score').textContent='スコア: '+s;
}
function reset(){
  active.forEach(t=>{if(nodes[t])nodes[t].gain.value=0});
  active.clear();
  document.querySelectorAll('#grid button').forEach(b=>b.classList.remove('active'));
  updateScore();
}
let saves=[];
function saveMix(){
  if(!active.size)return;
  const st=Array.from(active);
  saves.push(st);
  renderSaves();
}
function renderSaves(){
  const c=document.getElementById('saved');
  c.innerHTML='';
  saves.forEach((st,idx)=>{
    const b=document.createElement('button');
    b.textContent='再現#'+(idx+1);
    b.onclick=()=>{reset();st.forEach(t=>{const i=instruments.findIndex(x=>x.type===t);if(i>=0)toggle(i)})};
    c.appendChild(b);
  });
}
function init(){
  const grid=document.getElementById('grid');
  instruments.forEach((ins,i)=>{
    const b=document.createElement('button');
    b.className='instr';
    b.style.background=ins.color;
    b.innerHTML=`<span style="font-size:22px">${ins.name}</span>`;
    b.onpointerdown=()=>toggle(i);
    grid.appendChild(b);
  });
  document.getElementById('reset').onclick=reset;
  document.getElementById('save').onclick=saveMix;
  updateScore();
}
init();
</script>
</body>
</html>
