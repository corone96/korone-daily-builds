<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨粒よけスワイプ</title><style>body{margin:0;background:#0a2540;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}canvas{background:#1a3a6e;border:4px solid #fff;border-radius:12px;margin:8px;max-width:100%;height:auto}#title{font-size:14px;margin:8px 0 0;opacity:.8}#score{font-size:18px;margin:4px;font-weight:bold}.btn{background:#ffcc00;color:#000;border:none;padding:8px 20px;border-radius:20px;font-size:16px;margin:4px;cursor:pointer}</style></head><body><div id="title">雨粒よけスワイプ</div><div id="score">スコア: <span id="sc">0</span></div><canvas id="c" width="320" height="480"></canvas><div><button class="btn" id="start">スタート</button><button class="btn" id="reset">リセット</button></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),scEl=document.getElementById('sc');let umbrella={x:160,y:420,w:60,h:20},rain=[],coins=[],score=0,playing=false,lastSpawn=0;function reset(){rain=[];coins=[];score=0;umbrella.x=160;scEl.textContent=0;playing=false}document.getElementById('start').onclick=()=>{playing=true;lastSpawn=Date.now()};document.getElementById('reset').onclick=reset;function addRain(){rain.push({x:Math.random()*320,y:-10,s:3})}function addCoin(){coins.push({x:Math.random()*280+20,y:-10})}c.addEventListener('touchstart',e=>{e.preventDefault();if(!playing)return;umbrella.x=e.touches[0].clientX-c.getBoundingClientRect().left});c.addEventListener('touchmove',e=>{e.preventDefault();if(!playing)return;umbrella.x=e.touches[0].clientX-c.getBoundingClientRect().left});c.addEventListener('pointerdown',e=>{if(!playing)return;umbrella.x=e.offsetX});c.addEventListener('pointermove',e=>{if(!playing||!e.pressure)return;umbrella.x=e.offsetX});function loop(){ctx.fillStyle='#1a3a6e';ctx.fillRect(0,0,320,480);if(playing){const now=Date.now();if(now-lastSpawn>180){lastSpawn=now;if(Math.random()<0.75)addRain();else addCoin()}for(let i=rain.length-1;i>=0;i--){const r=rain[i];r.y+=2.8;ctx.fillStyle='#7ec8ff';ctx.beginPath();ctx.arc(r.x,r.y,r.s,0,Math.PI*2);ctx.fill();if(r.y>460){if(Math.abs(r.x-umbrella.x)<umbrella.w/2+10){score+=5}else{playing=false}rain.splice(i,1)}}for(let i=coins.length-1;i>=0;i--){const k=coins[i];k.y+=2.2;ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(k.x,k.y,7,0,Math.PI*2);ctx.fill();if(Math.abs(k.x-umbrella.x)<umbrella.w/2+12&&Math.abs(k.y-umbrella.y)<25){score+=20;coins.splice(i,1)}}umbrella.x=Math.max(30,Math.min(290,umbrella.x));ctx.fillStyle='#888';ctx.fillRect(umbrella.x-umbrella.w/2,umbrella.y,umbrella.w,umbrella.h);ctx.fillStyle='#555';ctx.fillRect(umbrella.x-5,umbrella.y-15,10,15);scEl.textContent=score}else{ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText('スワイプして傘を動かそう',40,200);ctx.font='16px sans-serif';ctx.fillText('雨を避けつつコインを拾え！',50,230)}requestAnimationFrame(loop)}loop();</script></body></html>
