<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ピニャータブレイカー</title><style>body{margin:0;background:#1a0f2e;color:#fff;font-family:sans-serif;touch-action:none}header{text-align:center;padding:8px;font-size:14px}canvas{display:block;margin:0 auto;background:#2a1f3d;border-radius:12px;max-width:100%;height:auto}#ui{position:absolute;top:60px;left:50%;transform:translateX(-50%);text-align:center;font-size:18px}#score{font-size:28px;font-weight:bold;color:#ffd700}#combo{color:#ff8cff}</style></head><body><header>ピニャータブレイカー</header><canvas id="c" width="360" height="520"></canvas><div id="ui"><div id="score">0</div><div id="combo">COMBO 0</div></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W=360,H=520,score=0,combo=0,hits=0,swinging=false,swingA=0,t=0,markerX=60,dir=1,particles=[];const piñata={x:W/2,y:220,r:55};function drawPiñata(hp){ctx.save();ctx.translate(piñata.x,piñata.y);ctx.rotate(Math.sin(t/8)*0.05);ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.ellipse(0,0,piñata.r,piñata.r*0.85,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e6007e';ctx.fillRect(-8,-piñata.r-15,16,25);ctx.fillStyle='#fff';ctx.fillRect(-22,-10,12,8);ctx.fillRect(10,-10,12,8);ctx.fillStyle='#222';ctx.fillRect(-18,-8,6,4);ctx.fillRect(14,-8,6,4);if(hp<3){ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-25,15);ctx.lineTo(25,-5);ctx.stroke();}ctx.restore();}function drawBat(){ctx.save();ctx.translate(80,380);ctx.rotate(-0.8+swingA*1.6);ctx.fillStyle='#8b5a2b';ctx.fillRect(-8,-60,16,90);ctx.fillStyle='#444';ctx.fillRect(-12,-70,24,14);ctx.restore();}function drawTiming(){ctx.fillStyle='#444';ctx.fillRect(40,460,280,8);ctx.fillStyle='#0f0';ctx.fillRect(150,458,60,12);ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(markerX,464,9,0,Math.PI*2);ctx.fill();}function drawCandies(){for(let p of particles){ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();}}function update(){t++;markerX+=dir*3.2;if(markerX>300||markerX<60)dir*=-1;if(swinging){swingA+=0.18;if(swingA>1){swinging=false;swingA=0;}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;if(p.y>520)particles.splice(i,1);}}function hit(isGood){if(isGood){combo++;score+=combo*12;hits++;document.getElementById('score').textContent=score;document.getElementById('combo').textContent='COMBO '+combo;if(hits>=4){explode();hits=0;combo=0;}}else{combo=0;document.getElementById('combo').textContent='COMBO 0';}swinging=true;swingA=0;}function explode(){for(let i=0;i<22;i++){particles.push({x:piñata.x+Math.random()*40-20,y:piñata.y+Math.random()*30-10,vx:Math.random()*7-3.5,vy:Math.random()*-6-2,c:['#ff0','#f0f','#0ff','#f80'][i%4]});}score+=combo*30;document.getElementById('score').textContent=score;setTimeout(()=>{hits=0;combo=0;document.getElementById('combo').textContent='COMBO 0';},800);}function loop(){update();ctx.fillStyle='#2a1f3d';ctx.fillRect(0,0,W,H);drawPiñata(4-hits);drawBat();drawTiming();drawCandies();requestAnimationFrame(loop);}c.addEventListener('pointerdown',e=>{e.preventDefault();const good=markerX>150&&markerX<210;hit(good);});loop();</script></body></html>
