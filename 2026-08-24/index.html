<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポンペイ遺跡パズル</title><style>body{margin:0;background:#222;color:#ddd;font-family:sans-serif;text-align:center} h1{font-size:14px;margin:4px} #board{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:92vw;max-width:320px;margin:8px auto;background:#444;padding:4px;border:4px solid #b88} .tile{width:100%;aspect-ratio:1;background:#555;border:1px solid #999;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;user-select:none;touch-action:none;transition:transform .1s} .tile:active{transform:scale(.92)} .correct{background:#3a5} #info{display:flex;justify-content:space-around;font-size:13px;margin:4px} button{padding:6px 14px;font-size:14px;background:#b88;color:#fff;border:none;border-radius:4px}</style></head><body><h1>ポンペイ遺跡パズル</h1><div id="board"></div><div id="info"><div>残り時間: <span id="time">120</span>s</div><div>完成: <span id="score">0</span>/9</div></div><button id="reset">リセット</button><script>const board=document.getElementById('board');const timeEl=document.getElementById('time');const scoreEl=document.getElementById('score');let tiles=[],timer=120,interval;function init(){board.innerHTML='';tiles=[];for(let i=0;i<9;i++){const t={id:i,rot:Math.floor(Math.random()*4)*90,correct:false};tiles.push(t);const d=document.createElement('div');d.className='tile';d.dataset.idx=i;d.style.transform=`rotate(${t.rot}deg)`;d.textContent=['🦁','🌊','🐟','🌿','🔥','🏛️','🦅','🌹','☀️'][i];d.addEventListener('pointerdown',e=>onTap(e,d));board.appendChild(d);}scoreEl.textContent='0';clearInterval(interval);timer=120;timeEl.textContent=timer;interval=setInterval(()=>{timer--;timeEl.textContent=timer;if(timer<=0)end();},1000);}function onTap(e,el){const idx=+el.dataset.idx;const t=tiles[idx];t.rot=(t.rot+90)%360;el.style.transform=`rotate(${t.rot}deg)`;checkWin();}function checkWin(){let ok=0;for(let i=0;i<9;i++){const el=board.children[i];const t=tiles[i];if(t.rot===0){el.classList.add('correct');ok++;}else el.classList.remove('correct');}scoreEl.textContent=ok;if(ok===9){clearInterval(interval);alert('完成！スコア:'+(timer*10));}}function end(){clearInterval(interval);alert('時間切れ');}document.getElementById('reset').onclick=init;init();</script></body></html>
