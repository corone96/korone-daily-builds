<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>花火エンバーキャッチ</title>
<style>
body{margin:0;background:#0a0a1f;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none}
#ui{position:absolute;top:0;left:0;right:0;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px;z-index:10}
#title{font-size:13px;opacity:.7}
#score,#time,#combo{font-weight:bold}
canvas{display:block;width:100%;height:100vh;background:#0a0a1f}
</style>
</head>
<body>
<div id="ui">
<div id="title">花火エンバーキャッチ</div>
<div><span id="score">0</span>pt</div>
<div><span id="time">60</span>s</div>
<div id="combo">×1</div>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,bx=0,by=0,bvy=0,score=0,time=60,combo=1,lastT=Date.now(),embers=[],lastSpawn=0,playing=true;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;bx=W/2;by=H-60}
window.onresize=resize;resize();
function spawn(){embers.push({x:Math.random()*W,y:-10,vy:1.8+Math.random()*1.2,size:4+Math.random()*3,color:['#ff6','#f96','#f6f','#6ff'][Math.floor(Math.random()*4)]})}
function draw(){
ctx.fillStyle='#0a0a1f';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#334';for(let i=0;i<30;i++){ctx.fillRect((i*73)%W,((Date.now()/30+i*17)%H),1,1)}
ctx.fillStyle='#fff';ctx.beginPath();ctx.rect(bx-22,by,44,28);ctx.fill();
ctx.fillStyle='#222';ctx.fillRect(bx-18,by+4,36,8);
for(const e of embers){ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(e.x-1,e.y-1,1.5,0,Math.PI*2);ctx.fill()}
}
function update(){
if(!playing)return;
const now=Date.now();if(now-lastT>1000){time--;lastT=now;document.getElementById('time').textContent=time;if(time<=0)end()}
if(now-lastSpawn>420){spawn();lastSpawn=now}
by+=bvy;bvy+=0.6;if(by>H-55){by=H-55;bvy=0}
bx=Math.max(25,Math.min(W-25,bx));
for(let i=embers.length-1;i>=0;i--){
const e=embers[i];e.y+=e.vy;
if(Math.abs(e.x-bx)<32&&Math.abs(e.y-by+8)<22){score+=10*combo;combo=Math.min(combo+1,8);embers.splice(i,1);document.getElementById('score').textContent=score;document.getElementById('combo').textContent='×'+combo}else if(e.y>H){combo=1;embers.splice(i,1);document.getElementById('combo').textContent='×1'}}
}
function loop(){update();draw();requestAnimationFrame(loop)}
let sx=0;
c.addEventListener('touchstart',e=>{if(!playing){location.reload();return}e.preventDefault();sx=e.touches[0].clientX;const t=e.touches[0].clientY;if(t>H-100)bvy=-7.5}, {passive:false});
c.addEventListener('touchmove',e=>{if(!playing)return;e.preventDefault();bx+=(e.touches[0].clientX-sx)*1.1;sx=e.touches[0].clientX}, {passive:false});
c.addEventListener('touchend',e=>{if(!playing)return;e.preventDefault()}, {passive:false});
function end(){playing=false;ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,H/2-40,W,80);ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('終了！ スコア: '+score,W/2,H/2+5);ctx.font='14px sans-serif';ctx.fillText('タップでリスタート',W/2,H/2+30)}
setInterval(()=>{if(playing&&embers.length<18)spawn()},650);
loop();
</script>
</body>
</html>
