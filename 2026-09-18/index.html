<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バーガースタックタップ</title><style>body{margin:0;background:#fff7e6;font-family:sans-serif;-webkit-tap-highlight-color:transparent;touch-action:none}header{padding:8px;text-align:center;font-size:14px;color:#555}.game{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}.stack{width:100%;max-width:320px;height:220px;border:4px solid #d2691e;border-radius:12px;background:#fff;position:relative;overflow:hidden}.layer{position:absolute;left:50%;transform:translateX(-50%);width:70%;height:22px;border-radius:6px;box-shadow:0 2px 0 #0003}.timer{width:100%;max-width:320px;height:48px;background:#ffe4b3;border-radius:999px;position:relative;overflow:hidden}.bar{height:100%;width:20%;background:#ff8c00;position:absolute;left:0;transition:left .02s linear}.zone{position:absolute;height:100%;background:#4ade80;opacity:.6}.info{display:flex;gap:12px;font-size:18px;font-weight:bold}.btn{padding:12px 32px;font-size:18px;border:none;border-radius:999px;background:#ff8c00;color:#fff}</style></head><body><header>バーガースタックタップ</header><div class="game"><div class="info"><div>スコア: <span id="score">0</span></div><div>連続: <span id="combo">0</span></div></div><div class="stack" id="stack"></div><div class="timer" id="timer"><div class="zone" style="left:35%;width:30%"></div><div class="bar" id="bar"></div></div><button class="btn" id="start">スタート</button></div><script>const stack=document.getElementById('stack'),bar=document.getElementById('bar'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),startBtn=document.getElementById('start'),timer=document.getElementById('timer');let score=0,combo=0,idx=0,playing=false;const ingredients=['#f4d03f','#d35400','#27ae60','#e74c3c','#f39c12','#f4d03f'];function addLayer(c){const l=document.createElement('div');l.className='layer';l.style.background=c;l.style.bottom=(stack.children.length*24)+'px';stack.appendChild(l)}function resetStack(){stack.innerHTML='';for(let i=0;i<idx;i++)addLayer(ingredients[i])}function endGame(){playing=false;startBtn.textContent='もう一度';alert('完成！スコア:'+score)}function next(){if(idx>=ingredients.length){endGame();return}bar.style.transition='none';bar.style.left='-20%';void bar.offsetWidth;bar.style.transition='left 1200ms linear';bar.style.left='100%';setTimeout(()=>{if(playing)miss()},1250)}function hit(t){if(!playing)return;const p=parseFloat(bar.style.left)||0;const perfect=Math.abs(p-50)<15;const good=Math.abs(p-50)<28;let pts=0;if(perfect){pts=100;combo++}else if(good){pts=40;combo=0}else{pts=-20;combo=0}score=Math.max(0,score+pts+combo*5);scoreEl.textContent=score;comboEl.textContent=combo;if(pts>0){addLayer(ingredients[idx]);idx++;next()}else{miss()}}function miss(){combo=0;comboEl.textContent=0;score=Math.max(0,score-30);scoreEl.textContent=score;idx++;if(idx>=ingredients.length)endGame();else next()}function start(){score=0;combo=0;idx=0;playing=true;scoreEl.textContent=0;comboEl.textContent=0;stack.innerHTML='';addLayer(ingredients[0]);idx=1;startBtn.textContent='タップで積む';next()}timer.addEventListener('pointerdown',hit);startBtn.addEventListener('pointerdown',()=>{if(!playing)start()});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});</script></body></html>
