<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選挙連立配置陣</title><style>body{margin:0;font-family:sans-serif;background:#f8f9fa;color:#222}header{padding:8px;text-align:center;font-size:14px;border-bottom:1px solid #ddd} #pal{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:8px} .p{width:38px;height:38px;border:2px solid #333;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;cursor:pointer;touch-action:none} #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:320px;margin:10px auto;padding:8px;background:#fff;border:2px solid #333} .cell{width:100%;aspect-ratio:1;border:1px solid #aaa;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;position:relative;touch-action:none} .cell.placed{border-color:#222;box-shadow:inset 0 0 0 3px #fff} .rot0{transform:rotate(0deg)}.rot1{transform:rotate(90deg)}.rot2{transform:rotate(180deg)}.rot3{transform:rotate(270deg)} #stat{padding:8px;text-align:center;font-size:13px} button{margin:8px;padding:8px 16px;font-size:14px}</style></head><body><header>選挙連立配置陣</header><div id="pal"></div><div id="grid"></div><div id="stat">政党をタップ→配置　長押し→回転</div><div style="text-align:center"><button id="chk">連立判定</button></div><script>const parties=[{id:0,n:"自民",s:18,c:"#c33"},{id:1,n:"立憲",s:14,c:"#36c"},{id:2,n:"維新",s:12,c:"#3a3"},{id:3,n:"公明",s:9,c:"#fc3"},{id:4,n:"共産",s:8,c:"#933"},{id:5,n:"国民",s:7,c:"#39c"},{id:6,n:"社民",s:5,c:"#693"},{id:7,n:"れ新",s:6,c:"#c69"}];let sel=-1,placed={},rot={};function mkPal(){const p=document.getElementById("pal");p.innerHTML="";parties.forEach(pr=>{const d=document.createElement("div");d.className="p";d.style.background=pr.c;d.textContent=pr.n;d.onclick=()=>{sel=pr.id;document.querySelectorAll(".p").forEach(x=>x.style.border="2px solid #333");d.style.border="2px solid #ff0"};p.appendChild(d)})}function mkGrid(){const g=document.getElementById("grid");g.innerHTML="";for(let i=0;i<16;i++){const c=document.createElement("div");c.className="cell";c.dataset.id=i;c.onpointerdown=e=>{e.preventDefault();const t0=Date.now();const tid=setTimeout(()=>{if(placed[i]!==undefined){rot[i]=(rot[i]||0)+1;drawGrid()}},520);c.onpointerup=()=>{clearTimeout(tid);if(Date.now()-t0<500&&sel>=0&&!placed[i]){placed[i]=sel;drawGrid()};c.onpointerup=null};c.onpointerleave=()=>clearTimeout(tid)};g.appendChild(c)}}function drawGrid(){const cs=document.querySelectorAll(".cell");cs.forEach(c=>{const i=+c.dataset.id;c.innerHTML="";c.className="cell";if(placed[i]!==undefined){const pr=parties[placed[i]];c.style.background=pr.c;c.style.color="#fff";c.textContent=pr.n;const r=rot[i]||0;c.style.transform=`rotate(${r*90}deg)`;c.classList.add("placed")}else{c.style.background="#f0f0f0";c.style.color="#222";c.style.transform="";}})}function check(){let sum=0,adj=0;const pos=Object.keys(placed).map(Number);pos.forEach(i=>{sum+=parties[placed[i]].s});for(let i=0;i<pos.length;i++)for(let j=i+1;j<pos.length;j++){const a=pos[i],b=pos[j];if(Math.abs(a%4-b%4)+Math.abs(Math.floor(a/4)-Math.floor(b/4))===1)adj++}const ok=sum>=50&&adj>=4;document.getElementById("stat").innerHTML=`支持率合計:${sum}　連立:${adj}　${ok?"多数派形成！":"条件未達"}`;if(ok)alert("連立成功！多数派を形成しました")}window.onload=()=>{mkPal();mkGrid();document.getElementById("chk").onclick=check}</script></body></html>
