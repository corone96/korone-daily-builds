<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>連立形成論理陣</title><style>body{margin:0;font-family:sans-serif;background:#111;color:#ddd;text-align:center}canvas{background:#222;border:2px solid #555;touch-action:none;max-width:100%;height:auto}.pal{display:flex;justify-content:center;gap:4px;margin:8px 0}.p{width:32px;height:32px;border:2px solid #fff;border-radius:4px}.st{font-size:14px;margin:4px}h1{font-size:16px;margin:4px}</style></head><body><h1>連立形成論理陣</h1><canvas id="c" width="320" height="320"></canvas><div class="pal" id="p"></div><div class="st" id="s">過半数175以上＋政策一致で勝利</div><button onclick="check()">判定</button><button onclick="reset()">リセット</button><script>const C=document.getElementById('c');const X=C.getContext('2d');const S=document.getElementById('s');const P=document.getElementById('p');const parties=[{id:0,n:'自民',c:'#f33'},{id:1,n:'公明',c:'#3f3'},{id:2,n:'立憲',c:'#33f'},{id:3,n:'維新',c:'#ff3'},{id:4,n:'共産',c:'#f3f'}];let sel=0;let grid=new Array(349).fill(-1);let pressT=0;function draw(){X.fillStyle='#222';X.fillRect(0,0,320,320);const sz=16;for(let i=0;i<349;i++){const x=(i%20)*16,y=Math.floor(i/20)*16;const pid=grid[i];X.fillStyle=pid>=0?parties[pid].c:'#444';X.fillRect(x+1,y+1,14,14);}}function place(x,y){const col=Math.floor(x/16),row=Math.floor(y/16);const idx=row*20+col;if(idx<349){grid[idx]=sel;draw();}}function longPlace(x,y){const col=Math.floor(x/16),row=Math.floor(y/16);const idx=row*20+col;if(idx<349&&grid[idx]>=0){grid[idx]=(grid[idx]+1)%5;draw();}}C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;pressT=setTimeout(()=>longPlace(x,y),600);});C.addEventListener('pointerup',e=>{clearTimeout(pressT);const r=C.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;place(x,y);});function makePal(){parties.forEach((pt,i)=>{const d=document.createElement('div');d.className='p';d.style.background=pt.c;d.onclick=()=>{sel=i;};P.appendChild(d);});}function check(){let cnt=0,coal=[0,1,2];for(let i=0;i<349;i++)if(grid[i]>=0&&coal.includes(grid[i]))cnt++;const ok=cnt>=175&&grid.includes(0)&&grid.includes(1);S.textContent=ok?'勝利！連立成立':'失敗：'+cnt+'議席';}function reset(){grid.fill(-1);draw();S.textContent='過半数175以上＋政策一致で勝利';}makePal();draw();</script></body></html>
