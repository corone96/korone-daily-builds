<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>睡眠研究配置パズル</title><style>body{margin:0;background:#111;color:#ddd;font-family:sans-serif;text-align:center} h1{font-size:14px;margin:8px} #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:92vw;max-width:420px;margin:0 auto;background:#222;padding:4px;border-radius:8px;touch-action:none} .cell{width:100%;aspect-ratio:1;background:#333;border:1px solid #555;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative} .cell:active{background:#444} #palette{display:flex;justify-content:center;gap:12px;margin:12px} .piece{padding:8px 14px;background:#222;border:2px solid #555;border-radius:6px;font-size:22px} .piece.sel{border-color:#0f0} #score{margin:8px;font-size:18px;color:#0f0} .info{font-size:11px;color:#888;margin:4px}</style></head><body><h1>睡眠研究配置パズル</h1><div id="grid"></div><div id="palette"></div><div id="score">スコア: 0</div><div class="info">タップ:配置/選択　長押し:回転</div><script>const grid=document.getElementById('grid');const palette=document.getElementById('palette');const scoreEl=document.getElementById('score');const types=['🛏️','🖥️','⬛'];let board=Array(25).fill(null);let selected=0;let longTimer;function createGrid(){grid.innerHTML='';for(let i=0;i<25;i++){const c=document.createElement('div');c.className='cell';c.dataset.i=i;grid.appendChild(c);updateCell(c,i);c.addEventListener('pointerdown',e=>onDown(e,i,c));c.addEventListener('pointerup',()=>clearTimeout(longTimer));c.addEventListener('pointerleave',()=>clearTimeout(longTimer));}}function updateCell(c,i){c.innerHTML=board[i]?board[i].t:'';if(board[i]&&board[i].r)c.style.transform=`rotate(${board[i].r*90}deg)`;}function onDown(e,i,c){clearTimeout(longTimer);longTimer=setTimeout(()=>{if(board[i]){board[i].r=(board[i].r||0)+1;updateCell(c,i);calcScore();}},600);const t=board[i];if(t){board[i]=null;updateCell(c,i);}else if(types[selected]){board[i]={t:types[selected],r:0};updateCell(c,i);}calcScore();}function createPalette(){palette.innerHTML='';types.forEach((t,idx)=>{const p=document.createElement('div');p.className='piece'+(idx===selected?' sel':'');p.textContent=t;p.onclick=()=>{selected=idx;createPalette();};palette.appendChild(p);});}function calcScore(){let s=0;const beds=[],mons=[],pans=[];board.forEach((p,i)=>{if(!p)return;const x=i%5,y=i/5|0;if(p.t==='🛏️')beds.push({x,y});if(p.t==='🖥️')mons.push({x,y});if(p.t==='⬛')pans.push({x,y});});beds.forEach(b=>{if(pans.some(p=>Math.abs(p.x-b.x)+Math.abs(p.y-b.y)===1))s+=30;});mons.forEach(m=>{if(beds.some(b=>Math.hypot(m.x-b.x,m.y-b.y)<=2))s+=25;});scoreEl.textContent='スコア: '+s;}createGrid();createPalette();calcScore();</script></body></html>
