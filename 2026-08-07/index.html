<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>キーで変わる線模様</title>
<style>
body{margin:0;background:#111;color:#ddd;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
canvas{border:1px solid #333;background:#000}
h1{font-size:14px;margin:8px 0;color:#666}
</style>
</head>
<body>
<h1>キーで変わる線模様</h1>
<canvas id="c" width="400" height="400"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let t=0,mode=0,lines=[];
function draw(){
  x.fillStyle='rgba(0,0,0,0.15)';x.fillRect(0,0,400,400);
  x.strokeStyle='#8cf';x.lineWidth=1.5;
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    x.beginPath();
    for(let j=0;j<l.p.length;j+=2){
      const px=l.p[j]+Math.sin(t*l.s+j)*l.a;
      const py=l.p[j+1]+Math.cos(t*l.s+j*0.7)*l.a;
      j?x.lineTo(px,py):x.moveTo(px,py);
    }
    x.stroke();
  }
  t+=0.02;
  requestAnimationFrame(draw);
}
function addLine(){
  const p=[];
  for(let i=0;i<8;i++)p.push(200+Math.random()*120-60,200+Math.random()*120-60);
  lines.push({p,s:0.8+Math.random()*0.6,a:8+Math.random()*12});
  if(lines.length>5)lines.shift();
}
addLine();addLine();
window.onkeydown=e=>{
  if(e.key===' '){mode=(mode+1)%3;lines=[];
    for(let i=0;i<3;i++)addLine();}
  else addLine();
};
setInterval(()=>{if(mode>0)addLine();},mode===2?400:800);
draw();
</script>
</body>
</html>
