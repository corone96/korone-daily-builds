<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美術館守り論理陣</title><style>body{margin:0;background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}header{padding:8px;font-size:14px;opacity:.8}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#222;padding:8px;border-radius:8px;margin:12px;max-width:92vw}#cell{width:18vw;height:18vw;max-width:72px;max-height:72px;background:#333;border:2px solid #555;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;user-select:none}.painting{color:#ffcc66}.guard{color:#66ccff}.camera{color:#ff66aa}.ok{border-color:#0a0}.status{margin:8px;font-size:13px}</style></head><body><header>美術館守り論理陣</header><div id="board"></div><div class="status" id="status">タップで配置／長押しでカメラ回転</div><script>const SIZE=4;let grid=Array(SIZE).fill().map(()=>Array(SIZE).fill(0));let dirs=Array(SIZE).fill().map(()=>Array(SIZE).fill(0));const board=document.getElementById('board');const status=document.getElementById('status');function draw(){board.innerHTML='';for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){const c=document.createElement('div');c.id=`c${x}-${y}`;c.className='cell';const v=grid[y][x];if(v===1)c.innerHTML='🖼️',c.classList.add('painting');if(v===2)c.innerHTML='👮',c.classList.add('guard');if(v===3){c.innerHTML=['📷','📹','📷','📹'][dirs[y][x]%4];c.classList.add('camera');}c.onpointerdown=e=>onTap(x,y,e);board.appendChild(c);}checkWin();}let pressTimer;function onTap(x,y,e){const cell=document.getElementById(`c${x}-${y}`);clearTimeout(pressTimer);pressTimer=setTimeout(()=>{if(grid[y][x]===3){dirs[y][x]=(dirs[y][x]+1)%4;draw();}},450);cell.onpointerup=()=>{clearTimeout(pressTimer);if(grid[y][x]===0)grid[y][x]=1;else if(grid[y][x]===1)grid[y][x]=2;else if(grid[y][x]===2)grid[y][x]=3;else grid[y][x]=0;draw();};cell.onpointerleave=()=>clearTimeout(pressTimer);}function checkWin(){let ok=true,hasPaint=false;for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){const v=grid[y][x];if(v===1){hasPaint=true;let seen=false;for(let d=0;d<4;d++){let nx=x,ny=y;const dx=[0,1,0,-1][d],dy=[-1,0,1,0][d];while(true){nx+=dx;ny+=dy;if(nx<0||nx>=SIZE||ny<0||ny>=SIZE)break;const nv=grid[ny][nx];if(nv===2){seen=true;break;}if(nv===3&&dirs[ny][nx]%4===d){seen=true;break;}if(nv!==0)break;}}if(!seen)ok=false;}}const cells=document.querySelectorAll('#board .cell');cells.forEach(c=>c.classList.remove('ok'));if(ok&&hasPaint){status.textContent='クリア！';cells.forEach(c=>c.classList.add('ok'));}else status.textContent=hasPaint?'条件を満たしてください':'タップで配置';}draw();</script></body></html>
