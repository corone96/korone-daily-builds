<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光遺伝脳探検</title><style>body{margin:0;background:#0a0a12;color:#ddd;font-family:sans-serif;overflow:hidden}header{padding:6px 10px;font-size:13px;text-align:center;border-bottom:1px solid #222}#c{display:block;width:100%;height:calc(100vh - 42px);touch-action:none}footer{position:fixed;bottom:0;left:0;right:0;padding:4px 10px;font-size:12px;background:#111;display:flex;justify-content:space-between;align-items:center}#score{color:#0ff}#info{color:#888}</style></head><body><header>光遺伝脳探検</header><canvas id="c"></canvas><footer><div id="score">発見: 0 / 12</div><div id="info">タップで光パルス</div></footer><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,nodes=[],score=0,activeSet=new Set();function resize(){W=c.width=c.offsetWidth*2;H=c.height=c.offsetHeight*2;ctx.scale(2,2)}function initNodes(){nodes=[];const cx=W/4,cy=H/4;for(let i=0;i<12;i++){const a=i/12*Math.PI*2,r=60+Math.random()*40;nodes.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r+20,act:0,id:i})}}function draw(){ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,W/2,H/2);ctx.strokeStyle='#334';ctx.lineWidth=1;for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];if(Math.hypot(a.x-b.x,a.y-b.y)<90){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}for(const n of nodes){const r=n.act>0?8:5;ctx.fillStyle=n.act>0?`hsl(${200+n.act*20},90%,70%)`:'#556';ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fill();if(n.act>0){ctx.fillStyle=`rgba(200,230,255,${n.act/12})`;ctx.beginPath();ctx.arc(n.x,n.y,14,0,Math.PI*2);ctx.fill()}n.act=Math.max(0,n.act-0.6)}requestAnimationFrame(draw)}function pulse(x,y){let hit=0;for(const n of nodes){const d=Math.hypot(n.x-x,n.y-y);if(d<55){n.act=12;if(!activeSet.has(n.id)){activeSet.add(n.id);hit++;score++}}}if(hit)document.getElementById('score').textContent=`発見: ${score} / 12`}function getPos(e){const r=c.getBoundingClientRect();return[(e.clientX-r.left)*2,(e.clientY-r.top)*2]}c.addEventListener('pointerdown',e=>{const [x,y]=getPos(e);pulse(x,y)});window.addEventListener('resize',()=>{resize();initNodes()});resize();initNodes();draw();</script></body></html>
