<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光遺伝脳迷路</title><style>body{margin:0;background:#0a0a12;color:#0ff;font-family:monospace;overflow:hidden;touch-action:none}header{padding:8px;text-align:center;font-size:13px;border-bottom:1px solid #0ff33}canvas{display:block;margin:0 auto;background:#111;border:1px solid #0ff} #info{padding:6px 12px;font-size:12px;display:flex;justify-content:space-between;align-items:center}button{background:#112;color:#0ff;border:1px solid #0ff;padding:4px 10px;margin:4px;font-size:12px} .mem{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#112;border:1px solid #0ff;padding:16px;max-width:80%;text-align:center}</style></head><body><header>光遺伝脳迷路 — コロネ</header><canvas id="c" width="320" height="420"></canvas><div id="info"><div>STAGE <span id="st">1</span>/3<br>TAPS:<span id="tp">0</span></div><button id="rst">RESET</button></div><div id="mem" class="mem"><div id="txt"></div><button onclick="next()">次へ</button></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W=320,H=420,stg=1,taps=0,nodes=[],goal=[];function init(s){stg=s;taps=0;nodes=[];if(s===1){nodes=[{x:120,y:120,s:0},{x:200,y:140,s:0},{x:160,y:220,s:0}];goal=[1,2,1]}else if(s===2){nodes=[{x:100,y:100,s:0},{x:220,y:110,s:0},{x:110,y:230,s:0},{x:210,y:240,s:0}];goal=[2,1,1,2]}else{nodes=[{x:80,y:130,s:0},{x:160,y:90,s:0},{x:240,y:130,s:0},{x:120,y:220,s:0},{x:200,y:220,s:0}];goal=[1,2,1,2,1]}document.getElementById('st').textContent=stg;document.getElementById('tp').textContent=taps}function draw(){ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#0ff';ctx.lineWidth=2;for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke()}nodes.forEach((n,i)=>{let col=n.s===0?'#444':n.s===1?'#0f0':'#f0f';ctx.fillStyle=col;ctx.beginPath();ctx.arc(n.x,n.y,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.fillText(n.s===1?'EX':n.s===2?'IN':'',n.x-10,n.y+4)});ctx.fillStyle='#0ff';ctx.fillText('光ビーム方向タップ',20,380)}function check(){for(let i=0;i<nodes.length;i++)if(nodes[i].s!==goal[i])return false;return true}function tap(x,y){let hit=false;nodes.forEach(n=>{if(Math.hypot(n.x-x,n.y-y)<25){n.s=(n.s+1)%3;hit=true;taps++;document.getElementById('tp').textContent=taps}});if(hit){draw();if(check()){showMem()}}}function showMem(){const m=document.getElementById('mem'),t=document.getElementById('txt');let txt=stg===1?'記憶解放：幼少期の光の記憶':stg===2?'洞察：神経の抑制が鍵':'全回路修正完了';if(stg===3)txt+='<br>SCORE:'+(100-taps*3);t.innerHTML=txt;m.style.display='block'}function next(){document.getElementById('mem').style.display='none';if(stg<3)init(stg+1);else{init(1)}}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;tap(x,y)});document.getElementById('rst').onclick=()=>init(stg);window.onresize=()=>{c.style.width=Math.min(360,window.innerWidth-20)+'px'};init(1);draw();</script></body></html>
