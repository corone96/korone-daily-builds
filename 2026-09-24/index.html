<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIデータ積み器</title>
<style>
body{margin:0;background:#0a0f1e;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;touch-action:none}
header{padding:8px;text-align:center;font-size:14px;border-bottom:1px solid #334}
#score{display:flex;justify-content:space-around;padding:6px 10px;background:#112}
#canvas{flex:1;background:#112;display:block;width:100%;touch-action:none}
#controls{display:flex;gap:4px;padding:8px;justify-content:center;flex-wrap:wrap}
button{padding:8px 14px;border:none;border-radius:6px;background:#334;color:#fff;font-size:13px}
button:active{background:#556}
#level{font-size:18px;font-weight:bold}
</style>
</head>
<body>
<header>AIデータ積み器 <small>by コロネ</small></header>
<div id="score">
<div>セキュリティスコア: <span id="sc">0</span></div>
<div id="level">Lv.1</div>
</div>
<canvas id="canvas" width="360" height="520"></canvas>
<div id="controls">
<button data-c="#e74c3c" data-s="rect">赤ブロック</button>
<button data-c="#3498db" data-s="circle">青ブロック</button>
<button data-c="#2ecc71" data-s="tri">緑三角</button>
<button data-c="#f1c40f" data-s="rect">黄四角</button>
<button onclick="resetAll()">リセット</button>
</div>
<script>
const c=document.getElementById('canvas');
const ctx=c.getContext('2d');
let blocks=[],score=0,level=1;
let currentColor='#e74c3c',currentShape='rect';

function drawAI(lv){
  ctx.save();
  ctx.translate(260,80);
  ctx.fillStyle='#555';
  ctx.fillRect(-25,0,50,70);
  ctx.fillStyle='#0f8';
  ctx.fillRect(-12,15,24,24);
  if(lv>=2){ctx.fillStyle='#f80';ctx.fillRect(-30,40,15,15);ctx.fillRect(15,40,15,15)}
  if(lv>=3){ctx.strokeStyle='#ff0';ctx.lineWidth=3;ctx.strokeRect(-35,-10,70,90)}
  if(lv>=4){ctx.fillStyle='#f0f';ctx.beginPath();ctx.arc(0,-15,18,0,Math.PI*2);ctx.fill()}
  ctx.restore();
}

function draw(){
  ctx.fillStyle='#112';
  ctx.fillRect(0,0,c.width,c.height);
  blocks.forEach(b=>{
    ctx.fillStyle=b.color;
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1;
    if(b.shape==='rect'){
      ctx.fillRect(b.x-12,b.y-12,24,24);
    }else if(b.shape==='circle'){
      ctx.beginPath();ctx.arc(b.x,b.y,13,0,Math.PI*2);ctx.fill();
    }else if(b.shape==='tri'){
      ctx.beginPath();ctx.moveTo(b.x,b.y-14);ctx.lineTo(b.x-14,b.y+12);ctx.lineTo(b.x+14,b.y+12);ctx.closePath();ctx.fill();
    }
  });
  drawAI(level);
  ctx.fillStyle='#fff';
  ctx.font='12px sans-serif';
  ctx.fillText('タップでデータ配置',20,500);
}

function placeBlock(x,y){
  blocks.push({x,y,color:currentColor,shape:currentShape});
  score+=Math.floor(Math.random()*3)+4;
  if(blocks.length>18)score+=2;
  document.getElementById('sc').textContent=score;
  const newLv=Math.min(5,Math.floor(score/28)+1);
  if(newLv!==level){level=newLv;document.getElementById('level').textContent='Lv.'+level}
  if(score>=120){document.getElementById('level').textContent='Lv.MAX 安全！'}
  draw();
}

function resetAll(){
  blocks=[];score=0;level=1;
  document.getElementById('sc').textContent='0';
  document.getElementById('level').textContent='Lv.1';
  draw();
}

c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)*(c.width/r.width);
  const y=(e.clientY-r.top)*(c.height/r.height);
  placeBlock(x,y);
},false);

document.querySelectorAll('#controls button[data-c]').forEach(btn=>{
  btn.addEventListener('pointerdown',()=>{
    currentColor=btn.dataset.c;
    currentShape=btn.dataset.s;
    btn.style.border='2px solid #fff';
    setTimeout(()=>btn.style.border='',180);
  });
});

window.onload=()=>{draw();}
</script>
</body>
</html>
