<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>急流バリアタップ</title><style>body{margin:0;background:#0a1f2e;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}canvas{background:#123;border:4px solid #4a9}header{padding:4px;font-size:14px} #ui{display:flex;gap:20px;padding:6px;font-size:18px}button{padding:8px 16px;font-size:16px;background:#4a9;border:none;color:#fff}</style></head><body><header>急流バリアタップ</header><div id="ui"><div>スコア:<span id="sc">0</span></div><div>生存:<span id="tm">0</span>s</div></div><canvas id="c" width="360" height="560"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let score=0,time=0,bar=[],wat=[],last=Date.now(),spd=1.2,playing=true;function addWater(){for(let i=0;i<4;i++)wat.push({x:50+i*70,y:-20-rand(60),hit:false})}function rand(n){return Math.random()*n}c.addEventListener('pointerdown',e=>{if(!playing)return;const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;bar.push({x,y,life:42});score+=3;document.getElementById('sc').textContent=score});function loop(){const now=Date.now();if(now-last>420){addWater();last=now}ctx.fillStyle='#0a1f2e';ctx.fillRect(0,0,360,560);ctx.fillStyle='#3a7';ctx.fillRect(20,0,320,560);ctx.fillStyle='#1a4';for(let i=0;i<3;i++)ctx.fillRect(45+i*70,480,50,70);ctx.fillStyle='#8b5';for(let b of bar){ctx.fillRect(b.x-18,b.y-4,36,8);b.life--;if(b.life<0)b.dead=true}bar=bar.filter(b=>!b.dead);ctx.fillStyle='#4cf';for(let w of wat){if(!w.hit){w.y+=spd;ctx.fillRect(w.x-8,w.y,16,22);for(let b of bar)if(Math.abs(b.x-w.x)<22&&Math.abs(b.y-w.y)<14){w.hit=true;score+=7}}else w.y+=0.6;if(w.y>520&&!w.hit){playing=false}}wat=wat.filter(w=>w.y<560);if(Math.random()<0.03&&playing)spd+=0.008;time=Math.floor((now-0)/1000);document.getElementById('tm').textContent=time;if(!playing){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,200,360,160);ctx.fillStyle='#fff';ctx.font='24px sans';ctx.fillText('村が浸水した…',90,280);ctx.font='18px sans';ctx.fillText('タップで再開',110,310);if(Math.random()<0.02){playing=true;score=0;time=0;bar=[];wat=[];spd=1.2}}ctx.fillStyle='#fff';ctx.font='14px sans';ctx.fillText('タップでバリア配置',80,40);requestAnimationFrame(loop)}addWater();loop();</script></body></html>
