<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>防災ヒーロータップ</title>
<style>
body{margin:0;background:#0a1628;color:#fff;font-family:sans-serif;touch-action:none}
#wrap{max-width:100%;margin:0 auto;padding:8px;box-sizing:border-box}
h1{font-size:18px;margin:4px 0;text-align:center}
#ui{display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:14px}
#damage{width:120px;height:12px;background:#333;border:1px solid #555;border-radius:6px;overflow:hidden}
#dbar{height:100%;background:#e33;width:0%}
#canvas{width:100%;max-width:100%;height:420px;background:#112b4a;border:3px solid #3a7;border-radius:12px;display:block;touch-action:none}
#msg{text-align:center;margin-top:8px;font-size:13px;opacity:.8}
</style>
</head>
<body>
<div id="wrap">
<h1>防災ヒーロータップ</h1>
<div id="ui">
<div>SCORE <span id="score">0</span></div>
<div>COMBO <span id="combo">0</span></div>
<div>TIME <span id="time">60</span></div>
<div id="damage"><div id="dbar"></div></div>
</div>
<canvas id="canvas" width="360" height="420"></canvas>
<div id="msg">災害アイコンをタップして街を守れ！</div>
</div>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');
let score=0,combo=0,time=60,damage=0,running=true;
let disasters=[],last=Date.now(),spawnT=0;
function rand(min,max){return Math.random()*(max-min)+min}
function spawn(){
  const types=['🔥','🌊','⚡'];
  disasters.push({x:rand(40,c.width-40),y:rand(60,c.height-60),type:types[Math.floor(Math.random()*3)],life:1800});
}
function draw(){
  ctx.fillStyle='#112b4a';ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#3a7';ctx.lineWidth=2;ctx.strokeRect(8,8,c.width-16,c.height-16);
  for(let d of disasters){
    ctx.font='32px sans-serif';
    ctx.fillText(d.type,d.x-16,d.y+12);
  }
}
function update(dt){
  if(!running)return;
  time-=dt/1000;
  if(time<=0){end();return}
  spawnT+=dt;
  if(spawnT>650){spawn();spawnT=0}
  for(let i=disasters.length-1;i>=0;i--){
    let d=disasters[i];
    d.life-=dt;
    if(d.life<=0){
      disasters.splice(i,1);
      damage+=18;combo=0;
      if(damage>=100)end();
    }
  }
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  document.getElementById('time').textContent=Math.max(0,Math.floor(time));
  document.getElementById('dbar').style.width=damage+'%';
}
function hit(x,y){
  for(let i=disasters.length-1;i>=0;i--){
    let d=disasters[i];
    if(Math.hypot(d.x-x,d.y-y)<38){
      disasters.splice(i,1);
      score+=10+combo*2;
      combo++;
      return true;
    }
  }
  return false;
}
function loop(){
  const now=Date.now();
  const dt=now-last;last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
function end(){
  running=false;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';
  ctx.fillText('GAME OVER',c.width/2-70,c.height/2-10);
  ctx.font='16px sans-serif';
  ctx.fillText('SCORE: '+score,c.width/2-45,c.height/2+25);
}
function start(){
  c.addEventListener('pointerdown',e=>{
    if(!running)return;
    const rect=c.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width*c.width;
    const y=(e.clientY-rect.top)/rect.height*c.height;
    if(!hit(x,y)){
      damage+=9;combo=0;
      if(damage>=100)end();
    }
  },{passive:true});
  for(let i=0;i<4;i++)spawn();
  loop();
}
start();
</script>
</body>
</html>
