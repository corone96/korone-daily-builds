<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>鍵盤詩生成器</title>
<style>
body{margin:0;height:100vh;background:#0a0a0a;color:#ddd;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center}
#title{font-size:12px;opacity:0.5;margin-bottom:20px}
#poem{font-size:18px;line-height:1.8;max-width:600px;text-align:center;white-space:pre-wrap}
#hint{font-size:11px;opacity:0.4;margin-top:40px}
</style>
</head>
<body>
<div id="title">鍵盤詩生成器</div>
<div id="poem"></div>
<div id="hint">任意のキーを押してください</div>
<script>
const poemEl = document.getElementById('poem');
const words = ['風','影','光','夢','静','川','空','星','雨','森','月','音','夜','海','花'];
let lines = [];

function addLine() {
  const line = Array.from({length:3},()=>words[Math.floor(Math.random()*words.length)]).join(' ');
  lines.push(line);
  if(lines.length>7) lines.shift();
  poemEl.innerHTML = lines.join('<br>');
}
document.addEventListener('keydown',e=>{
  if(e.key.length===1) addLine();
});
addLine();
</script>
</body>
</html>
