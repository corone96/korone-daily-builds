<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ルネサンス配置展</title><style>body{margin:0;font-family:sans-serif;background:#f5f0e6;color:#333}header{padding:8px;text-align:center;font-size:14px;border-bottom:1px solid #ccc} #cond{background:#fff9e6;padding:6px;font-size:12px;border-bottom:1px solid #ccc} #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px auto;max-width:300px;aspect-ratio:1;background:#d4c9a8;padding:6px;border:4px solid #8b5e3c} .cell{background:#e8d9b0;border:2px solid #8b5e3c;min-height:60px;display:flex;align-items:center;justify-content:center;font-size:10px;position:relative} .cell.placed{background:#c9b48a} #palette{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px} .piece{width:52px;height:52px;border:2px solid #555;border-radius:4px;background:#f4e9d8;display:flex;align-items:center;justify-content:center;font-size:9px;text-align:center;cursor:pointer;user-select:none} .piece.sel{border-color:#c33;box-shadow:0 0 0 3px #f99} .win{text-align:center;color:#060;font-weight:bold;margin:10px} .info{font-size:11px;text-align:center;color:#666}</style></head><body><header>ルネサンス配置展</header><div id="cond">条件: 1.宗教画は中央に 2.肖像画は互いに隣接 3.大型画は角に</div><div id="grid"></div><div id="palette"></div><div class="info">タップで選択→配置 / 長押しで回転</div><div id="msg"></div><script>const grid=document.getElementById('grid');const pal=document.getElementById('palette');const msg=document.getElementById('msg');let cells=[],pieces=[],sel=null;const data=[{id:1,n:'モナリザ',t:'肖像',sz:'小'},{id:2,n:'最後の晩餐',t:'宗教',sz:'大'},{id:3,n:'ヴィーナス',t:'神話',sz:'小'},{id:4,n:'聖母子',t:'宗教',sz:'大'},{id:5,n:'自画像',t:'肖像',sz:'小'}];function makeGrid(){grid.innerHTML='';cells=[];for(let i=0;i<9;i++){const c=document.createElement('div');c.className='cell';c.dataset.idx=i;c.ontouchstart=e=>place(e,i);c.onpointerdown=e=>place(e,i);grid.appendChild(c);cells.push(c)}}function makePal(){pal.innerHTML='';data.forEach(p=>{const el=document.createElement('div');el.className='piece';el.innerHTML=p.n+'<br>'+p.sz;el.dataset.id=p.id;el.ontouchstart=e=>select(e,el,p);el.onpointerdown=e=>select(e,el,p);el.ontouchstart=e=>{if(e.touches.length>1)rotate(el,p)};pal.appendChild(el)})}function select(e,el,p){if(sel)sel.classList.remove('sel');sel=el;sel.classList.add('sel');sel.piece=p}function place(e,idx){if(!sel)return;const c=cells[idx];if(c.placed)return;c.innerHTML=sel.piece.n;c.classList.add('placed');c.placed=sel.piece;sel.classList.remove('sel');sel=null;checkWin()}function rotate(el,p){el.style.transform=el.style.transform==='rotate(90deg)'?'':'rotate(90deg)'}function checkWin(){let ok=true;const pos=cells.map(c=>c.placed);if(!pos[4]||pos[4].t!=='宗教')ok=false;if(pos[0]&&pos[0].sz!=='大')ok=false;if(pos[2]&&pos[2].sz!=='大')ok=false;if(pos[6]&&pos[6].sz!=='大')ok=false;if(pos[8]&&pos[8].sz!=='大')ok=false;let port=[];for(let i=0;i<9;i++)if(pos[i]&&pos[i].t==='肖像')port.push(i);if(port.length===2&&Math.abs(port[0]-port[1])!==1&&Math.abs(port[0]-port[1])!==3)ok=false;if(ok){msg.innerHTML='<div class="win">クリア！</div>';setTimeout(()=>{if(confirm('もう一度？'))location.reload()},800)}}makeGrid();makePal();</script></body></html>
