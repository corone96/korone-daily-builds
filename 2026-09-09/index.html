<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>名画調和パズル</title><style>body{margin:0;background:#f8f1e3;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}header{padding:8px;font-size:14px;color:#444}h1{margin:0;font-size:16px}main{width:100%;max-width:420px;padding:10px;box-sizing:border-box}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#d4c4a8;padding:10px;border-radius:8px;margin:0 auto}#grid div{width:100%;aspect-ratio:1;border:3px solid #5c4033;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-align:center;flex-direction:column;cursor:pointer;user-select:none}.info{display:flex;justify-content:space-between;width:100%;max-width:420px;margin:8px 0;font-size:13px}#score{font-weight:bold;color:#5c4033}button{padding:8px 16px;background:#5c4033;color:#f8f1e3;border:none;border-radius:4px;font-size:13px}</style></head><body><header><h1>名画調和パズル</h1></header><main><div id="grid"></div><div class="info"><div id="score">適合: 0/12</div><button onclick="reset()">リセット</button></div></main><script>const pieces=[{id:1,n:'モナ',c:'#4a3c2f',t:'暖',m:'肖像'},{id:2,n:'最後の晩餐',c:'#6b5b4f',t:'暖',m:'宗教'},{id:3,n:'ヴィーナス',c:'#8b7b6b',t:'冷',m:'神話'},{id:4,n:'アテネ',c:'#5c4c3f',t:'暖',m:'宗教'},{id:5,n:'天使',c:'#7b6b5b',t:'冷',m:'肖像'},{id:6,n:'風景',c:'#4a5c3f',t:'冷',m:'神話'},{id:7,n:'聖母',c:'#6b4c3f',t:'暖',m:'宗教'},{id:8,n:'自画像',c:'#8b6b5b',t:'冷',m:'肖像'},{id:9,n:'神話',c:'#5c5c3f',t:'暖',m:'神話'}];let board=[...pieces],sel=null;function createGrid(){const g=document.getElementById('grid');g.innerHTML='';board.forEach((p,i)=>{const d=document.createElement('div');d.style.background=p.c;d.innerHTML=`<div>${p.n}</div><div style="font-size:9px">${p.t}/${p.m}</div>`;d.ontouchstart=e=>handleTouch(e,i);d.onpointerdown=e=>handleTouch(e,i);g.appendChild(d);});check()}function handleTouch(e,i){e.preventDefault();if(sel===null){sel=i}else{if(sel!==i){[board[sel],board[i]]=[board[i],board[sel]];createGrid()}sel=null}}function check(){let ok=0;const dirs=[[0,1],[1,0]];for(let y=0;y<3;y++)for(let x=0;x<3;x++){const idx=y*3+x;const p=board[idx];dirs.forEach(d=>{const nx=x+d[0],ny=y+d[1];if(nx<3&&ny<3){const np=board[ny*3+nx];if(p.t===np.t||p.m===np.m)ok++}})}const sc=document.getElementById('score');sc.textContent=`適合: ${ok}/12`;if(ok===12)sc.style.color='#2a7';else sc.style.color='#5c4033'}function reset(){board=[...pieces].sort(()=>Math.random()-0.5);createGrid()}window.onload=()=>{reset()}</script></body></html>
