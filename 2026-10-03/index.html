<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SL貴婦人</title><style>body{margin:0;background:#112;font-family:sans-serif;color:#fff;text-align:center;touch-action:none}canvas{display:block;margin:0 auto;border:4px solid #ff0;background:#003} #ui{position:fixed;bottom:0;left:0;right:0;padding:8px;background:#0008} .bar{height:20px;background:#0f0;margin:4px 0} #comment{position:fixed;top:60px;left:50%;transform:translateX(-50%);font-size:18px;color:#ff0;text-shadow:0 0 4px #000}</style></head><body><h3>SL貴婦人リズム走行</h3><canvas id="c" width="360" height="480"></canvas><div id="ui"><div>蒸気圧 <span id="pval">100</span>%</div><div class="bar" id="bar"></div><div id="score">SCORE: 0</div></div><div id="comment"></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let pressure=100,pos=0,score=0,last=Date.now(),beats=[],commentEl=document.getElementById('comment'),holding=false,swipeStart=0;function initBeats(){beats=[];for(let i=0;i<12;i++)beats.push(3000+i*650)}initBeats();function draw(){ctx.fillStyle='#112';ctx.fillRect(0,0,360,480);ctx.fillStyle='#444';ctx.fillRect(0,380,360,20);for(let i=0;i<8;i++){ctx.fillStyle='#666';ctx.fillRect((pos/30+i*60)%360-30,385,50,8)}ctx.fillStyle='#f90';ctx.fillRect(pos%360,320,90,50);ctx.fillStyle='#fff';ctx.fillRect(pos%360+60,300,20,20);ctx.fillStyle='#0f0';ctx.fillRect(20,20,pressure*3.2,12);ctx.fillStyle='#fff';ctx.font='16px sans';ctx.fillText('🚂',pos%360+20,355)}function update(){const now=Date.now(),dt=now-last;last=now;if(holding)pressure=Math.min(100,pressure+dt*0.08);else pressure=Math.max(0,pressure-dt*0.03);if(pressure>20)pos+=dt*0.12;document.getElementById('bar').style.width=pressure+'%';document.getElementById('pval').textContent=Math.floor(pressure);document.getElementById('score').textContent='SCORE: '+score;if(pos>1200){endGame();return}for(let i=beats.length-1;i>=0;i--){const t=beats[i]-now;if(t<120&&t>-120){if(holding){score+=15;beats.splice(i,1);showComment()}}}draw();requestAnimationFrame(update)}function showComment(){const msgs=['「最高の蒸気圧ですわ！」','「ゆらゆら揺れて心地いい」','「ポイント切り替え上手！」','「遅刻しそう…」','「お嬢様、素敵な運転」'];commentEl.textContent=msgs[Math.floor(Math.random()*msgs.length)];setTimeout(()=>commentEl.textContent='',900)}function endGame(){ctx.fillStyle='#0008';ctx.fillRect(0,180,360,120);ctx.fillStyle='#ff0';ctx.font='24px sans';ctx.fillText('到着！ SCORE:'+score,40,240)}c.addEventListener('pointerdown',e=>{holding=true;swipeStart=e.clientY});c.addEventListener('pointerup',()=>{holding=false});c.addEventListener('pointermove',e=>{if(holding&&Math.abs(e.clientY-swipeStart)>40){score+=5;swipeStart=e.clientY;showComment()}});c.addEventListener('pointercancel',()=>holding=false);setTimeout(update,50);draw();</script></body></html>
