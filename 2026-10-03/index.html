<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タネ拾い秋探検</title><style>body{margin:0;font-family:sans-serif;background:#f4e9c8;color:#3c2f1e} h1{font-size:14px;margin:4px;text-align:center} #ui{display:flex;justify-content:space-between;padding:4px;font-size:13px} canvas{background:#d4b77d;display:block;margin:0 auto;border:4px solid #3c2f1e;touch-action:none} #bins{display:flex;justify-content:space-around;margin-top:6px} .bin{width:30%;height:60px;border:3px solid #3c2f1e;border-radius:8px;text-align:center;line-height:60px;font-size:12px;background:#f8e8b0} .seed{display:inline-block;width:22px;height:22px;margin:2px;border-radius:50%;font-size:14px;line-height:22px;text-align:center} .info{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:3px solid #3c2f1e;padding:10px;border-radius:8px;max-width:80%;display:none;z-index:10}</style></head><body><h1>タネ拾い秋探検</h1><div id="ui"><div>拾った:<span id="cnt">0</span>/12</div><div>スコア:<span id="sc">0</span></div></div><canvas id="c" width="320" height="380"></canvas><div id="bins"><div class="bin" id="b0">どんぐり</div><div class="bin" id="b1">まつぼっくり</div><div class="bin" id="b2">かえで</div></div><div id="info" class="info"></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let seeds=[],picked=[],score=0,longT=0,longS=null;const types=['どんぐり','まつぼっくり','かえで'],desc=['森の王様！','トゲトゲ注意','紅葉の妖精'];function init(){seeds=[];for(let i=0;i<12;i++)seeds.push({x:30+Math.random()*260,y:30+Math.random()*300,t:Math.floor(Math.random()*3),picked:false});picked=[];score=0;draw();}function draw(){ctx.fillStyle='#d4b77d';ctx.fillRect(0,0,320,380);ctx.fillStyle='#8b6f3e';for(let i=0;i<18;i++){ctx.beginPath();ctx.ellipse(20+i*17,60+i%5*60,18,9,Math.random()*2,0,Math.PI*2);ctx.fill();}seeds.forEach(s=>{if(s.picked)return;ctx.fillStyle=['#6b4e31','#8b7355','#c77d3a'][s.t];ctx.beginPath();ctx.arc(s.x,s.y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillText('●',s.x-3,s.y+3);});}let sx=0,sy=0;function collect(x,y){seeds.forEach(s=>{if(!s.picked&&Math.hypot(s.x-x,s.y-y)<18){s.picked=true;picked.push(s);}});document.getElementById('cnt').textContent=picked.length;}c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=c.getBoundingClientRect();sx=t.clientX-r.left;sy=t.clientY-r.top;longT=Date.now();longS=null;seeds.forEach(s=>{if(!s.picked&&Math.hypot(s.x-sx,s.y-sy)<14)longS=s;});}, {passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],r=c.getBoundingClientRect();const x=t.clientX-r.left,y=t.clientY-r.top;collect(x,y);if(Math.hypot(x-sx,y-sy)>12)longS=null;draw();},{passive:false});c.addEventListener('touchend',e=>{e.preventDefault();if(longS&&Date.now()-longT>450){const i=document.getElementById('info');i.innerHTML=`<b>${types[longS.t]}</b><br>${desc[longS.t]}<br><small>タップで閉じる</small>`;i.style.display='block';setTimeout(()=>i.onclick=()=>i.style.display='none',10);}longS=null;});['b0','b1','b2'].forEach((id,ti)=>{const b=document.getElementById(id);b.ontouchstart=e=>{e.preventDefault();if(!picked.length)return;const s=picked.find(p=>p.t===ti);if(s){picked=picked.filter(p=>p!==s);score+=10;document.getElementById('sc').textContent=score;draw();if(picked.length===0&&seeds.filter(x=>!x.picked).length===0)alert('庭完成！スコア:'+score);}}});init();document.getElementById('c').ontouchstart=function(e){if(e.touches.length>1)init();};</script></body></html>
