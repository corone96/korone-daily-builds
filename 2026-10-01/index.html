<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コーヒー豆振り分け</title><style>body{margin:0;font-family:sans-serif;background:#f5e8c7;color:#3c2f2f}header{padding:4px 8px;font-size:14px;border-bottom:1px solid #d4b78f}canvas{display:block;width:100%;max-width:600px;height:420px;background:#e8d5b7;margin:0 auto;border:2px solid #8b5e3c;touch-action:none}#info{padding:4px 8px;font-size:13px}#order{color:#5c3317}</style></head><body><header>☕ コーヒー豆振り分け</header><div id="info">スコア: <span id="sc">0</span>　注文: <span id="order">-</span></div><canvas id="c" width="600" height="420"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let beans=[],score=0,order={type:'エスプレッソ',need:2,roast:2},hold=null,drag=null;function newBean(){beans.push({x:40+Math.random()*120,y:180+Math.random()*60,r:14,roast:0,held:0})}function draw(){ctx.clearRect(0,0,600,420);ctx.fillStyle='#d2b48c';ctx.fillRect(0,150,600,180);ctx.fillStyle='#8b5e3c';ctx.fillRect(0,330,600,20);ctx.font='14px sans-serif';ctx.fillStyle='#3c2f2f';['ライト','ミディアム','ダーク'].forEach((t,i)=>ctx.fillText(t,80+i*200,145));beans.forEach(b=>{ctx.fillStyle=b.roast<1?'#d4a017':b.roast<2?'#8b4513':'#3c2f2f';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();if(b.held>0){ctx.fillStyle='#fff';ctx.fillRect(b.x-10,b.y-2,20*(b.held/800),4)}})}function update(){beans.forEach(b=>{if(!b.drag)b.x+=0.6;if(b.x>560)b.x=40});beans=beans.filter(b=>b.x<580)}function hit(x,y){return beans.find(b=>Math.hypot(b.x-x,b.y-y)<b.r+8)}c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect(),x=(e.touches[0].clientX-r.left)*600/r.width,y=(e.touches[0].clientY-r.top)*420/r.height;const b=hit(x,y);if(b){drag=b;drag.ox=drag.x;drag.oy=drag.y;hold=setTimeout(()=>{if(drag){drag.roast=Math.min(2,drag.roast+1);drag.held=0}},800)}},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();if(drag){const r=c.getBoundingClientRect(),x=(e.touches[0].clientX-r.left)*600/r.width;drag.x=x;drag.y=Math.max(170,Math.min(300,e.touches[0].clientY-r.top)*420/r.height)}},{passive:false});c.addEventListener('touchend',e=>{e.preventDefault();if(drag){const zone=Math.floor(drag.x/200);if(zone===order.roast&&drag.roast===order.roast)score++;document.getElementById('sc').textContent=score;drag=null}clearTimeout(hold);hold=null});setInterval(()=>{if(beans.length<5)newBean()},900);setInterval(()=>{order={type:['エスプレッソ','ラテ','ドリップ'][Math.random()*3|0],need:2,roast:Math.random()*3|0};document.getElementById('order').textContent=order.type+'('+['L','M','D'][order.roast]+')'},6500);function loop(){update();draw();requestAnimationFrame(loop)}newBean();newBean();loop();</script></body></html>
