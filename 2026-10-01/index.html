<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コーヒーブリュータイミング</title><style>body{margin:0;background:#f4e9d8;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh} h1{font-size:14px;color:#5d4037;margin:4px} #game{width:100%;max-width:420px;height:520px;background:#fff;border:8px solid #5d4037;border-radius:12px;position:relative;overflow:hidden;touch-action:none} .area{position:absolute;left:10%;width:80%;height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:#fff} #grind{top:30px;background:#8d6e63} #pour{top:180px;background:#4e342e} #milk{top:330px;background:#ffcc80;color:#5d4037} #status{position:absolute;bottom:20px;left:10%;width:80%;text-align:center;font-size:16px;color:#5d4037} #score{position:absolute;top:10px;right:10px;font-size:14px;background:#fff;padding:2px 8px;border-radius:6px;border:2px solid #5d4037} button{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 30px;font-size:18px;background:#5d4037;color:#fff;border:none;border-radius:999px} .ok{background:#81c784!important}</style></head><body><h1>コーヒーブリュータイミング</h1><div id="game"><div id="grind" class="area">豆を長押しで挽く</div><div id="pour" class="area">スワイプで湯を注ぐ</div><div id="milk" class="area">ミルク投入！</div><div id="status">注文：寝坊した朝の特製ラテ</div><div id="score">スコア:0</div><button id="start">スタート</button></div><script>const g=document.getElementById('game'),gr=document.getElementById('grind'),po=document.getElementById('pour'),mi=document.getElementById('milk'),st=document.getElementById('status'),sc=document.getElementById('score'),bt=document.getElementById('start');let score=0,step=0,holdT=0,swipeOK=false;function upd(){sc.textContent='スコア:'+score}bt.onclick=()=>{bt.style.display='none';step=1;st.textContent='長押しで豆を挽こう！'};gr.onpointerdown=e=>{if(step!==1)return;holdT=Date.now();gr.style.background='#6d4c41'};gr.onpointerup=e=>{if(step!==1)return;const t=(Date.now()-holdT)/1000;gr.style.background='#8d6e63';if(t>1.2&&t<2.8){score+=30;step=2;st.textContent='今度はスワイプ！';upd()}else{st.textContent='タイミング外れ…'}};let sx=0;po.onpointerdown=e=>{if(step!==2)return;sx=e.clientX;po.style.background='#3e2723'};po.onpointerup=e=>{if(step!==2)return;const d=Math.abs(e.clientX-sx);po.style.background='#4e342e';if(d>60){score+=30;step=3;st.textContent='ミルクのタイミング！';upd()}else{st.textContent='スワイプ弱い…'}};mi.onclick=()=>{if(step!==3)return;score+=40;step=4;st.textContent='完成！ 完璧ラテ';mi.classList.add('ok');upd();setTimeout(()=>{alert('スコア:'+score+'点\n今日もいいコーヒー！');location.reload()},800)};upd()</script></body></html>
