<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オゾンシールドタップ</title><style>body{margin:0;background:#0a1628;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}canvas{background:#112244;border:3px solid #4af;border-radius:8px;margin:8px 0;width:100%;max-width:420px;height:auto}#title{font-size:14px;margin:8px 0 0;opacity:.8}#ui{display:flex;justify-content:space-between;width:100%;max-width:420px;font-size:14px;padding:0 12px}#heat{color:#f66}</style></head><body><div id="title">オゾンシールドタップ</div><div id="ui"><div>スコア: <span id="score">0</span></div><div>熱: <span id="heat">0</span>℃</div></div><canvas id="c" width="420" height="620"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let score=0,heat=0,uvs=[],shield={x:0,t:0},last=Date.now();function addUV(){uvs.push({x:40+Math.random()*340,y:30,vy:2.2+Math.random()*1.3})}for(let i=0;i<5;i++)addUV();function draw(){ctx.fillStyle='#112244';ctx.fillRect(0,0,420,620);ctx.fillStyle='#3a7';ctx.fillRect(20,140,380,18);ctx.fillStyle='#4af';ctx.fillRect(20,138,380,4);ctx.fillStyle='#8a5';ctx.beginPath();ctx.arc(210,520,95,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.fillText('地球',175,525);ctx.strokeStyle='#ff0';ctx.lineWidth=3;uvs.forEach(u=>{ctx.beginPath();ctx.moveTo(u.x,u.y);ctx.lineTo(u.x,u.y+22);ctx.stroke()});if(shield.t>0){ctx.strokeStyle='#4af';ctx.lineWidth=8;ctx.beginPath();ctx.arc(shield.x,152,38,0,Math.PI*2);ctx.stroke()}}function loop(){const now=Date.now();if(now-last>420){addUV();last=now}uvs.forEach(u=>u.y+=u.vy);for(let i=uvs.length-1;i>=0;i--){const u=uvs[i];if(u.y>148&&u.y<162&&shield.t>0&&Math.abs(u.x-shield.x)<42){score++;uvs.splice(i,1);document.getElementById('score').textContent=score;continue}if(u.y>480){heat++;uvs.splice(i,1);document.getElementById('heat').textContent=heat;if(heat>12){alert('地球が熱くなりすぎた…ゲームオーバー');location.reload()}}}uvs=uvs.filter(u=>u.y<620);if(shield.t>0)shield.t--;draw();requestAnimationFrame(loop)}function tap(x){shield.x=x;shield.t=18}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();tap((e.clientX-r.left)/r.width*420)});c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect();tap((e.touches[0].clientX-r.left)/r.width*420)},{passive:false});loop();</script></body></html>
