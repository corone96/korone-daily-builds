<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オゾンUV避けスワイプ</title><style>body{margin:0;background:#0a1628;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}header{text-align:center;padding:4px;font-size:13px;background:#112233}canvas{width:100%;height:calc(100vh - 70px);display:block;background:#112233;touch-action:none}#score{font-size:18px;margin:2px}</style></head><body><header><div>オゾンUV避けスワイプ</div><div id="score">スコア: 0</div></header><canvas id="c"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score');let W,H,playerX,score=0,gameOver=false,rays=[],spray=0,last=0;function resize(){W=c.width=innerWidth;H=c.height=innerHeight-70;playerX=W/2}window.onresize=resize;resize();function spawn(){if(Math.random()<0.06)rays.push({x:Math.random()*W,y:-20,s:2+Math.random()*3})}function draw(){ctx.fillStyle='#112233';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4af';ctx.beginPath();ctx.arc(playerX,H-40,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(playerX-3,H-55,6,15);if(spray>0){ctx.fillStyle='rgba(100,220,255,0.6)';ctx.fillRect(playerX-60,0,120,H-80)}ctx.fillStyle='#f44';rays.forEach(r=>{ctx.fillRect(r.x-2,r.y,4,18)})}function update(dt){if(gameOver)return;score+=dt*0.06;scoreEl.textContent='スコア: '+Math.floor(score);spawn();rays.forEach(r=>r.y+=r.s*dt*0.06);rays=rays.filter(r=>r.y<H);if(spray>0)spray-=dt;for(let i=rays.length-1;i>=0;i--){const r=rays[i];if(Math.abs(r.x-playerX)<25&&r.y>H-70){gameOver=true;break}if(spray>0&&Math.abs(r.x-playerX)<65){rays.splice(i,1);score+=5}}if(gameOver){ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.fillText('GAME OVER',W/2-90,H/2);ctx.font='16px sans-serif';ctx.fillText('タップでリスタート',W/2-80,H/2+30)}}let touching=false,tx=0;function start(e){touching=true;tx=e.touches?e.touches[0].clientX:e.clientX;playerX=Math.max(30,Math.min(W-30,tx));if(!gameOver)spray=180}function move(e){if(!touching)return;tx=e.touches?e.touches[0].clientX:e.clientX;playerX=Math.max(30,Math.min(W-30,tx))}function end(e){touching=false;if(gameOver){rays=[];score=0;gameOver=false;spray=0;playerX=W/2}}c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);c.addEventListener('pointerup',end);function loop(t){if(!last)last=t;const dt=t-last;last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
