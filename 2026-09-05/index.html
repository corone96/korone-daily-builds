<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洞窟灯り導き</title><style>body{margin:0;background:#111;color:#ddd;font-family:sans-serif;text-align:center}canvas{display:block;margin:0 auto;background:#000;border:2px solid #444;touch-action:none;width:100%;max-width:420px}h1{font-size:14px;margin:4px}</style></head><body><h1>洞窟灯り導き</h1><div style="margin:4px;font-size:14px">救助:<span id="sc">0</span> 残り:<span id="tm">60</span>s</div><canvas id="cv" width="320" height="480"></canvas><script>const c=document.getElementById('cv'),x=c.getContext('2d'),sc=document.getElementById('sc'),tm=document.getElementById('tm');let score=0,time=60,child={x:160,y:400},light={x:160,y:200,on:false},last=Date.now();function draw(){x.fillStyle='#0a0a0a';x.fillRect(0,0,320,480);x.strokeStyle='#333';x.lineWidth=8;x.beginPath();x.moveTo(40,0);x.lineTo(80,200);x.lineTo(40,480);x.moveTo(280,0);x.lineTo(240,200);x.lineTo(280,480);x.stroke();if(light.on){const g=x.createRadialGradient(light.x,light.y,10,light.x,light.y,90);g.addColorStop(0,'#ffeb3b');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(light.x,light.y,90,0,Math.PI*2);x.fill()}x.fillStyle='#4fc3f7';x.beginPath();x.arc(child.x,child.y,12,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.fillRect(child.x-3,child.y-18,6,12)}function loop(){const n=Date.now();if(n-last>1000){time--;tm.textContent=time;if(time<=0){alert('結果:'+score+'人');location.reload()}}last=n;if(light.on){const dx=light.x-child.x,dy=light.y-child.y,d=Math.hypot(dx,dy);if(d>2){child.x+=dx/d*2.2;child.y+=dy/d*2.2}}if(child.y<60){score++;sc.textContent=score;child={x:80+Math.random()*160,y:420};light.on=false}if(child.x<50)child.x=50;if(child.x>270)child.x=270;draw();requestAnimationFrame(loop)}function tap(e){e.preventDefault();const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;light.x=(t.clientX-r.left)/r.width*320;light.y=(t.clientY-r.top)/r.height*480;light.on=true;setTimeout(()=>light.on=false,650)}c.addEventListener('touchstart',tap,{passive:false});c.addEventListener('pointerdown',tap);setInterval(()=>{if(time>0)tm.textContent=time},200);loop();</script></body></html>
