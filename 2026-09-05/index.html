<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪水救助ラッシュ</title><style>body{margin:0;background:#0a2540;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;touch-action:none}header{padding:6px 10px;font-size:14px;background:#112b55;text-align:center}main{flex:1;display:flex;flex-direction:column;padding:4px}canvas{width:100%;height:70vh;background:#1e5a8a;border-radius:8px;touch-action:none}#ui{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 0;font-size:15px}#gauge{width:120px;height:14px;background:#333;border-radius:7px;overflow:hidden}#bar{height:100%;width:0;background:#4ade80;transition:width .1s}#score{font-weight:bold}</style></head><body><header>洪水救助ラッシュ</header><main><div id="ui"><div>スコア: <span id="score">0</span></div><div id="gauge"><div id="bar"></div></div><div>村復興</div></div><canvas id="c" width="360" height="520"></canvas></main><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let boat=180,score=0,gauge=0,entities=[],last=0,timer=30;function spawn(){if(Math.random()<0.75)entities.push({x:30+Math.random()*300,y:-20,t:Math.random()<0.75?'p':'l'})}function reset(){boat=180;score=0;gauge=0;entities=[];timer=30;document.getElementById('score').textContent=0;document.getElementById('bar').style.width='0%'}function update(dt){timer-=dt/1000;if(timer<=0){alert('終了！スコア:'+score);reset();return}entities.forEach(e=>e.y+=2.8);entities=entities.filter(e=>e.y<560);for(let i=entities.length-1;i>=0;i--){let e=entities[i];if(Math.abs(e.x-boat)<28&&e.y>440&&e.y<490){if(e.t==='p'){score++;gauge=Math.min(100,gauge+12);document.getElementById('score').textContent=score;document.getElementById('bar').style.width=gauge+'%'}else{gauge=Math.max(0,gauge-25);document.getElementById('bar').style.width=gauge+'%'}entities.splice(i,1)}}if(Math.random()<0.07)spawn()}function draw(){ctx.fillStyle='#1e5a8a';ctx.fillRect(0,0,360,520);ctx.fillStyle='#3b82f6';for(let i=0;i<8;i++)ctx.fillRect(0,((Date.now()/120+i*70)%520)-30,360,18);ctx.fillStyle='#f59e0b';ctx.fillRect(boat-22,460,44,28);ctx.fillStyle='#fff';ctx.fillRect(boat-8,452,16,12);entities.forEach(e=>{if(e.t==='p'){ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(e.x,e.y,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(e.x-3,e.y-3,6,6)}else{ctx.fillStyle='#854d0e';ctx.fillRect(e.x-16,e.y-6,32,12)}});ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.fillText('残り:'+Math.ceil(timer),10,20)}function loop(t){if(!last)last=t;update(t-last);draw();last=t;requestAnimationFrame(loop)}c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect(),x=(e.touches[0].clientX-r.left)/r.width*360;boat=x<180?90:270}, {passive:false});c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*360;boat=x<180?90:270});setInterval(spawn,900);reset();requestAnimationFrame(loop)</script></body></html>
