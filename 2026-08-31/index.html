<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨粒キャッチ冒険</title><style>body{margin:0;background:#0a1628;color:#fff;font-family:sans-serif;touch-action:none;overflow:hidden}header{position:fixed;top:0;left:0;right:0;padding:8px 12px;background:#112b4a;display:flex;justify-content:space-between;align-items:center;z-index:10;font-size:14px}canvas{display:block;width:100%;height:100vh}button{background:#2a5a8a;border:none;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px}</style></head><body><header><div>雨粒キャッチ冒険</div><div>スコア:<span id="score">0</span>　残り:<span id="life">3</span></div></header><canvas id="c"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,bucketX=0.5,score=0,life=3,items=[],last=0,running=true;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}window.onresize=resize;resize();function addItem(){const type=Math.random()<0.2?'thunder':'rain';items.push({x:Math.random(),y:0,type,s:Math.random()*1.5+2.5})}function draw(){ctx.fillStyle='#0a1628';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4a9eff';ctx.fillRect(W*bucketX-35,H-70,70,60);ctx.fillStyle='#fff';ctx.fillRect(W*bucketX-25,H-55,50,30);ctx.font='bold 18px sans-serif';items.forEach(it=>{ctx.fillStyle=it.type==='thunder'?'#ffeb3b':'#7ec8ff';ctx.beginPath();ctx.arc(W*it.x,it.y,8,0,Math.PI*2);ctx.fill();if(it.type==='thunder'){ctx.fillText('⚡',W*it.x-8,it.y+6)}})}function update(dt){items.forEach(it=>it.y+=it.s*dt*0.06);for(let i=items.length-1;i>=0;i--){const it=items[i];if(it.y>H-50&&Math.abs(it.x-bucketX)<0.08){if(it.type==='rain'){score+=10;document.getElementById('score').textContent=score}else{life--;document.getElementById('life').textContent=life;if(life<=0)running=false}items.splice(i,1)}else if(it.y>H)items.splice(i,1)}if(Math.random()<0.04)addItem()}function loop(t){if(!last)last=t;const dt=t-last;last=t;if(running){update(dt);draw();if(life>0)requestAnimationFrame(loop)}else{ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.fillText('ゲームオーバー',W/2-100,H/2-20);ctx.font='20px sans-serif';ctx.fillText('スコア: '+score,W/2-50,H/2+20)}}c.addEventListener('pointerdown',e=>{if(!running)return;const rect=c.getBoundingClientRect();const tx=(e.clientX-rect.left)/rect.width;bucketX=Math.max(0.1,Math.min(0.9,tx))});c.addEventListener('touchstart',e=>{e.preventDefault();if(!running)return;const rect=c.getBoundingClientRect();const tx=(e.touches[0].clientX-rect.left)/rect.width;bucketX=Math.max(0.1,Math.min(0.9,tx))},{passive:false});for(let i=0;i<8;i++)addItem();requestAnimationFrame(loop)</script></body></html>
