<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冠水庭回復器</title><style>body{margin:0;background:#0a2f1f;color:#ddd;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}header{padding:8px;font-size:14px;opacity:.7}#garden{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:92vw;max-width:420px;height:92vw;max-height:420px;background:#1a4a33;border:6px solid #3a6a53;border-radius:12px;padding:6px;margin:10px 0} .cell{width:100%;height:100%;background:#3a8ab8;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .2s;cursor:pointer;user-select:none} .cell.drain{background:#777;color:#ccc} .cell.plant{background:#4a9c4a;color:#fff} .cell.grown{background:#2e7d32;transform:scale(1.05)}#status{display:flex;gap:20px;font-size:15px;margin:4px 0}#bar{width:92vw;max-width:420px;height:14px;background:#1a4a33;border-radius:7px;overflow:hidden}#fill{height:100%;background:#7cc97c;width:0%}button{padding:8px 16px;margin:4px;font-size:15px;background:#2a5f45;color:#fff;border:none;border-radius:8px} .msg{font-size:13px;opacity:.8;height:18px}</style></head><body><header>冠水庭回復器</header><div id="status"><div>緑化率 <span id="green">0</span>%</div><div>安定度 <span id="stable">0</span></div></div><div id="garden"></div><div id="bar"><div id="fill"></div></div><div class="msg" id="msg"></div><div><button id="drain">排水路</button><button id="seed">苗</button><button id="reset">リセット</button></div><script>const SIZE=5;let grid=[],green=0,stable=0;const garden=document.getElementById('garden');const fill=document.getElementById('fill');const msg=document.getElementById('msg');function init(){garden.innerHTML='';grid=[];green=0;stable=0;updateUI();for(let y=0;y<SIZE;y++){for(let x=0;x<SIZE;x++){const c=document.createElement('div');c.className='cell';c.dataset.x=x;c.dataset.y=y;c.dataset.state='flood';c.addEventListener('pointerdown',tap);garden.appendChild(c);grid.push(c);}}}function tap(e){const c=e.currentTarget;if(c.dataset.state!=='flood')return;const mode=document.activeElement&&document.activeElement.id==='seed'?'seed':'drain';if(mode==='drain'){c.classList.add('drain');c.dataset.state='drain';c.innerHTML='💧';stable+=8;}else{c.classList.add('plant');c.dataset.state='plant';c.innerHTML='🌱';green+=6;stable+=4;}updateUI();setTimeout(()=>{grow(c)},280);}function grow(c){if(!c||c.dataset.state==='grown')return;if(c.dataset.state==='drain'){c.style.background='#555';stable+=4;}else if(c.dataset.state==='plant'){c.classList.remove('plant');c.classList.add('grown');c.innerHTML='🌿';green+=9;stable+=7;}updateUI();if(green>=100){win();}}function updateUI(){document.getElementById('green').textContent=Math.min(100,green);document.getElementById('stable').textContent=stable;fill.style.width=Math.min(100,Math.floor((green+stable/3)))+'%';if(green>70)msg.textContent='庭が息を吹き返した！';else if(green>40)msg.textContent='排水が進んでいる';else msg.textContent='';}function win(){msg.textContent='🎉 冠水庭完全回復！ ユーモア満点の緑化完了';setTimeout(()=>{msg.textContent='また遊ぼう！'},1800);}document.getElementById('drain').onclick=()=>{};document.getElementById('seed').onclick=()=>{};document.getElementById('reset').onclick=init;init();</script></body></html>
