<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外交バランス蓄積器</title>
<style>
body{margin:0;background:#f8f1e3;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
#title{font-size:14px;text-align:center;padding:8px;color:#555}
#score{text-align:center;font-size:18px;font-weight:bold;margin:4px}
#pile{position:relative;width:100%;height:65vh;max-height:420px;margin:0 auto;border:3px solid #8b5a2b;background:#e8d9b8;overflow:hidden;touch-action:none}
.piece{position:absolute;width:42px;height:28px;border:1px solid #333;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform .2s}
#log{position:absolute;bottom:8px;left:8px;right:8px;font-size:13px;color:#444;text-align:center;min-height:20px}
#taparea{position:absolute;inset:0}
</style>
</head>
<body>
<div id="title">外交バランス蓄積器</div>
<div id="score">合意スコア: <span id="num">0</span></div>
<div id="pile">
  <div id="taparea"></div>
  <div id="log"></div>
</div>
<script>
const pile=document.getElementById('pile');
const tap=document.getElementById('taparea');
const num=document.getElementById('num');
const log=document.getElementById('log');
let score=0,pieces=0;
const flags=['🇯🇵','🇺🇸','🇨🇳','🇰🇷','🇫🇷','🇩🇪'];
function addPiece(e){
  if(e.cancelable)e.preventDefault();
  const x=Math.random()* (pile.clientWidth-50);
  const y=Math.random()* (pile.clientHeight-80)+20;
  const rot=(Math.random()-0.5)*40;
  const el=document.createElement('div');
  el.className='piece';
  el.style.left=x+'px';
  el.style.top=y+'px';
  el.style.transform=`rotate(${rot}deg)`;
  el.style.background=score>12?'#d4e8c2':'#fff';
  el.style.zIndex=++pieces;
  el.innerHTML=flags[Math.floor(Math.random()*flags.length)];
  pile.appendChild(el);
  score+=Math.floor(Math.random()*3)+2;
  num.textContent=score;
  if(Math.random()<0.18){
    log.textContent=['貿易摩擦！','同盟破棄？','ビザ問題発生','首脳会談延期'][Math.floor(Math.random()*4)];
    setTimeout(()=>{log.textContent='';if(score>5){score-=3;num.textContent=score;}},1200);
  }
  if(score>25){
    pile.style.borderColor='#2e7d32';
    log.textContent='合意成立！';
  }
}
tap.addEventListener('pointerdown',addPiece,{passive:false});
tap.addEventListener('touchstart',addPiece,{passive:false});
</script>
</body>
</html>
