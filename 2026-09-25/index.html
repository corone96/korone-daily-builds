<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月見台成長器</title>
<style>
body{margin:0;background:#0a0f2e;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none}
#title{position:fixed;top:8px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.7;z-index:10}
#canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,#00000088);font-size:15px;text-align:center}
#score{font-size:18px;margin-bottom:4px}
#comment{font-size:13px;min-height:18px;opacity:.9}
</style>
</head>
<body>
<div id="title">月見台成長器</div>
<canvas id="canvas"></canvas>
<div id="ui">
<div id="score">月見スコア: 0</div>
<div id="comment">タップで月見道具を追加しよう</div>
</div>
<script>
const c=document.getElementById('canvas');
const ctx=c.getContext('2d');
let W,H,elems=[],score=0;
const comments=[
['月見初心者','月がきれい…'],
['ちょっと雰囲気出た','提灯が映える'],
['月見台らしくなってきた','いい感じ'],
['月見上級者','夜が華やか'],
['完璧な月見台！','お月見マスター']
];
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.onresize=resize;resize();
function add(x,y){
  const types=['lantern','dango','higan'];
  elems.push({x:x+(Math.random()-0.5)*30,y:y+(Math.random()-0.5)*30,type:types[elems.length%3],v:Math.random()*6+2,rot:Math.random()*Math.PI*2});
  score=elems.length;
  updateUI();
}
function updateUI(){
  document.getElementById('score').textContent='月見スコア: '+score;
  const idx=Math.min(Math.floor(score/4),4);
  document.getElementById('comment').textContent=comments[idx][Math.floor(Math.random()*2)];
}
function drawMoon(){
  ctx.save();
  ctx.shadowColor='#ffef9e';
  ctx.shadowBlur=60;
  ctx.fillStyle='#fff7d1';
  ctx.beginPath();
  ctx.arc(W*0.5,H*0.32,Math.min(W,H)*0.12,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function drawStar(x,y,s){ctx.fillStyle='#fff8';ctx.fillRect(x,y,s,s)}
function drawLantern(o){
  ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot*0.02);
  ctx.fillStyle='#ffaa55';ctx.fillRect(-8,-18,16,26);
  ctx.fillStyle='#ffdd88';ctx.fillRect(-5,-14,10,18);
  ctx.fillStyle='#664422';ctx.fillRect(-10,-20,20,4);ctx.fillRect(-3,8,6,8);
  ctx.restore();
}
function drawDango(o){
  ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot*0.03);
  ctx.strokeStyle='#8b5a2b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-4,-22);ctx.lineTo(-4,18);ctx.stroke();
  ctx.fillStyle='#f8d7a0';[[-4,-14],[ -4, -2],[ -4,10]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],7,0,Math.PI*2);ctx.fill()});
  ctx.restore();
}
function drawHigan(o){
  ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot*0.04);
  ctx.fillStyle='#c33';
  for(let i=0;i<5;i++){ctx.save();ctx.rotate(i*1.256);
  ctx.beginPath();ctx.ellipse(0,-9,4,10,0,0,Math.PI*2);ctx.fill();ctx.restore()}
  ctx.fillStyle='#220';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.fillStyle='#0a0f2e';ctx.fillRect(0,0,W,H);
  for(let i=0;i<28;i++)drawStar((i*37%W),(i*53% (H*0.6))+20,1.4);
  drawMoon();
  elems.forEach(o=>{
    if(o.type==='lantern')drawLantern(o);
    else if(o.type==='dango')drawDango(o);
    else drawHigan(o);
  });
}
function loop(){draw();requestAnimationFrame(loop)}
loop();
function tap(e){const r=c.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top)}
c.addEventListener('pointerdown',tap,{passive:true});
c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect();const t=e.touches[0];add(t.clientX-r.left,t.clientY-r.top)},{passive:false});
setInterval(()=>{if(elems.length>0&&Math.random()<0.4){const o=elems[Math.floor(Math.random()*elems.length)];o.x+=Math.random()*8-4;o.y+=Math.random()*8-4;o.rot+=0.1}},1200);
</script>
</body>
</html>
