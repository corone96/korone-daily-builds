<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI調和積み器</title><style>body{margin:0;background:#111;color:#ddd;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}header{padding:8px;text-align:center;font-size:14px;border-bottom:1px solid #333}#canvas{flex:1;touch-action:none;display:block;margin:auto;background:#1a1a1a}#info{padding:10px;text-align:center;font-size:18px}#score{font-size:28px;color:#0f0;margin:4px}button{margin:8px;padding:10px 20px;font-size:16px;background:#333;color:#ddd;border:none;border-radius:6px}</style></head><body><header>AI調和積み器</header><canvas id="canvas"></canvas><div id="info"><div>タップでAIと人間を交互に積む</div><div id="score">調和: 0</div><button id="reset">リセット</button></div><script>const c=document.getElementById('canvas');const ctx=c.getContext('2d');let pieces=[];let score=0;let nextAI=true;function resize(){c.width=Math.min(window.innerWidth*0.95,480);c.height=Math.min(window.innerHeight*0.65,520);draw();}function draw(){ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,c.width,c.height);const baseY=c.height-40;const size=36;pieces.forEach((p,i)=>{const y=baseY-i*size*0.85;ctx.save();ctx.translate(p.x,y);if(p.ai){ctx.fillStyle='#4a90e2';ctx.fillRect(-size/2,-size/2,size,size);ctx.fillStyle='#fff';ctx.fillRect(-size/4,-size/4,size/2,size/2);}else{ctx.fillStyle='#e67e22';ctx.beginPath();ctx.arc(0,0,size/2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-size/8,-size/8,size/5,0,Math.PI*2);ctx.fill();}ctx.restore();});ctx.fillStyle='#ddd';ctx.font='16px sans-serif';ctx.fillText('AI四角 ⇄ 人間丸',20,30);}function addPiece(x){const cx=c.width/2+(Math.random()-0.5)*40;pieces.push({x:cx,ai:nextAI});nextAI=!nextAI;score+=10;document.getElementById('score').textContent='調和: '+score;draw();if(pieces.length%4===0){const t=document.getElementById('score');t.style.color='#0f0';setTimeout(()=>t.style.color='#0f0',120);}}function reset(){pieces=[];score=0;nextAI=true;document.getElementById('score').textContent='調和: 0';draw();}function init(){resize();window.addEventListener('resize',resize);c.addEventListener('pointerdown',e=>{const rect=c.getBoundingClientRect();addPiece(e.clientX-rect.left);},false);document.getElementById('reset').addEventListener('click',reset);draw();}init();</script></body></html>
