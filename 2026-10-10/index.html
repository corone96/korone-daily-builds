<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋祭影探索</title><style>body{margin:0;background:#111;color:#ddd;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}header{padding:8px;text-align:center;font-size:14px;border-bottom:1px solid #444}main{flex:1;display:flex;flex-direction:column;padding:10px;gap:12px} .stage{font-size:18px;text-align:center;margin:10px 0} .choices{display:flex;flex-direction:column;gap:12px}button{padding:18px;font-size:16px;background:#222;color:#ddd;border:1px solid #555;border-radius:8px;touch-action:none}button:active{background:#444}.status{display:flex;justify-content:space-between;font-size:13px;padding:4px 8px;background:#1a1a1a}.end{text-align:center;margin-top:40px}.hidden{display:none}</style></head><body><header>秋祭影探索</header><main><div class="status"><div>スコア:<span id="sc">0</span></div><div>アイテム:<span id="it">0</span>/3</div></div><div id="stage" class="stage">夜の祭り会場へようこそ<br>タップで進路を選んでください</div><div id="desc" style="text-align:center;font-size:14px;line-height:1.5">3連休の裏側を探索する短編アドベンチャー</div><div id="choices" class="choices"></div><div id="result" class="end hidden"></div></main><script>let score=0,items=0,stage=0;const scenes=[{t:"第1ステージ 屋台街",d:"左の暗い路地へ進むか、右の明るい本堂へ進むか",c:["左の路地へ","右の本堂へ"],r:[(s)=>{score+=10;items++;return"影の欠片を手に入れた"},(s)=>{score-=5;return"人混みに紛れ何も得られなかった"}]},{t:"第2ステージ 裏参道",d:"急な階段を上るか、横の森へ入るか",c:["急な階段を上る","森へ入る"],r:[(s)=>{score+=5;return"古いお守りを発見"},(s)=>{items++;score+=15;return"隠しアイテム『祭の影』を発見"}]},{t:"最終ステージ 夜の舞台裏",d:"幕の向こうへ行くか、その場で待機するか",c:["幕の向こうへ","その場で待機"],r:[(s)=>{score+=20;items++;return"全ての裏側を解明！"},(s)=>{score-=10;return"何も見えず祭りは終わった"}]}];function upd(){document.getElementById('sc').textContent=score;document.getElementById('it').textContent=items}function showScene(){const s=scenes[stage];document.getElementById('stage').innerHTML=s.t;document.getElementById('desc').innerHTML=s.d;const box=document.getElementById('choices');box.innerHTML='';s.c.forEach((txt,i)=>{const b=document.createElement('button');b.textContent=txt;b.addEventListener('pointerdown',()=>choose(i));box.appendChild(b)})}function choose(i){const s=scenes[stage];const msg=s.r[i]();document.getElementById('desc').innerHTML=msg;document.getElementById('choices').innerHTML='';upd();setTimeout(()=>{stage++;if(stage<3)showScene();else end()},900)}function end(){document.getElementById('stage').innerHTML='探索終了';document.getElementById('desc').innerHTML='';document.getElementById('choices').innerHTML='';const r=document.getElementById('result');r.classList.remove('hidden');let txt=`<h2>得点:${score} アイテム:${items}/3</h2>`;if(items>=2&&score>=25)txt+='裏の祭りの秘密を暴いた！';else if(score>=10)txt+='少し裏側が見えたようだ';else txt+='何も得られず祭りは終わった';r.innerHTML=txt}window.onload=()=>{upd();showScene();const st=document.getElementById('stage');st.addEventListener('pointerdown',()=>{if(stage===0&&document.getElementById('choices').children.length===0)showScene()});}</script></body></html>
