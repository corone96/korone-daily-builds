<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>祭り提灯彩り器</title><style>body{margin:0;font-family:sans-serif;background:#111;color:#eee;text-align:center}canvas{background:#222;border:4px solid #f90;border-radius:8px;margin:8px auto;display:block;touch-action:none}h1{font-size:18px;margin:8px 0 0}#info{font-size:14px;margin:4px}#score{font-size:20px;color:#ff0;margin:4px}button{background:#f90;color:#111;border:none;padding:8px 16px;border-radius:20px;margin:4px;font-size:14px}</style></head><body><h1>祭り提灯彩り器</h1><canvas id="c" width="360" height="420"></canvas><div id="info">タップで色変更<br>隣接同じ色で調和スコア↑</div><div id="score">祭りスコア: 0</div><div id="unlock">解禁: 赤・青・黄</div><button onclick="reset()">リセット</button><script>const c=document.getElementById('c');const ctx=c.getContext('2d');let lanterns=[];let score=0;let unlocked=3;const colors=['#c33','#36c','#cc3','#3c3','#c3c'];const shapes=[0,1,2];function init(){lanterns=[];for(let y=0;y<4;y++)for(let x=0;x<3;x++){lanterns.push({x:60+x*90,y:70+y*85,color:Math.floor(Math.random()*unlocked),shape:y%3});}score=0;draw();}function draw(){ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);lanterns.forEach((l,i)=>{const col=colors[l.color];ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.fillStyle=col;const w=48+l.shape*4;ctx.beginPath();ctx.ellipse(l.x,l.y-20,22,8,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillRect(l.x-w/2,l.y-16,w,48);ctx.strokeRect(l.x-w/2,l.y-16,w,48);ctx.beginPath();ctx.ellipse(l.x,l.y+34,22,7,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#ff9';ctx.fillRect(l.x-3,l.y-8,6,14);});}function getLanternAt(px,py){let best=-1,bd=9999;for(let i=0;i<lanterns.length;i++){const l=lanterns[i];const d=Math.hypot(l.x-px,l.y-py);if(d<bd&&d<55){bd=d;best=i;}}return best;}function calcScore(){let s=0;for(let i=0;i<lanterns.length;i++){const l=lanterns[i];const x=i%3,y=Math.floor(i/3);[[1,0],[0,1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx<3&&ny<4){const ni=ny*3+nx;if(lanterns[ni].color===l.color)s+=12;}}); }score=s;document.getElementById('score').innerText='祭りスコア: '+score;if(score>80&&unlocked<5){unlocked=5;document.getElementById('unlock').innerText='解禁: 全色！';}draw();}function handle(e){const rect=c.getBoundingClientRect();const x=(e.clientX||e.touches[0].clientX)-rect.left;const y=(e.clientY||e.touches[0].clientY)-rect.top;const idx=getLanternAt(x,y);if(idx>=0){lanterns[idx].color=(lanterns[idx].color+1)%unlocked;calcScore();}}c.addEventListener('pointerdown',handle);c.addEventListener('touchstart',handle,{passive:true});function reset(){init();document.getElementById('score').innerText='祭りスコア: 0';document.getElementById('unlock').innerText='解禁: 赤・青・黄';}init();</script></body></html>
