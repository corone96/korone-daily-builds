<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月影パズル器</title><style>body{margin:0;background:#0a1428;color:#ddd;font-family:sans-serif;display:flex;flex-direction:column;align-items:center}canvas{background:#11223a;border:1px solid #334466;border-radius:12px;margin:8px 0;touch-action:none}#title{font-size:14px;margin:12px 0 4px;opacity:.7}#score{font-size:18px;margin:4px 0 8px}button{background:#334466;color:#ddd;border:0;padding:8px 16px;border-radius:6px;margin:4px}</style></head><body><div id="title">月影パズル器</div><canvas id="c" width="360" height="360"></canvas><div id="score">景観度: 0</div><button onclick="reset()">配置をリセット</button><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let pieces=[];const N=8;function init(){pieces=[];for(let i=0;i<N;i++)pieces.push({t:0,r:0});}function draw(){ctx.fillStyle='#11223a';ctx.fillRect(0,0,360,360);ctx.fillStyle='#ffeebb';ctx.beginPath();ctx.arc(180,180,58,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffcc66';ctx.beginPath();ctx.arc(165,165,12,0,Math.PI*2);ctx.fill();for(let i=0;i<N;i++){const a=i*2*Math.PI/N+Math.PI/8;const x=180+Math.cos(a)*118,y=180+Math.sin(a)*118;const p=pieces[i];ctx.save();ctx.translate(x,y);ctx.rotate(p.r*Math.PI/2);ctx.fillStyle=['#d4a017','#e67e22','#c0392b'][p.t];if(p.t===0){ctx.fillRect(-18,-6,36,12);ctx.fillRect(-10,-14,20,8);}else if(p.t===1){ctx.beginPath();ctx.ellipse(0,0,22,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8b4513';ctx.fillRect(-4,-18,8,6);}else{ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-5,4,0,Math.PI*2);ctx.fill();}ctx.restore();}}function getScore(){let s=0;for(let i=0;i<N;i++){const p=pieces[i],n=pieces[(i+1)%N];if(p.t===n.t)s+=12;if(p.r===0)s+=5;}return Math.min(99,s+Math.floor(Math.random()*3));}function updateScore(){document.getElementById('score').textContent='景観度: '+getScore();}function tap(e){const r=c.getBoundingClientRect();const x=(e.clientX||e.touches[0].clientX)-r.left,y=(e.clientY||e.touches[0].clientY)-r.top;const cx=x-180,cy=y-180;const dist=Math.hypot(cx,cy);if(dist<75||dist>160)return;let ang=Math.atan2(cy,cx);if(ang<0)ang+=Math.PI*2;const idx=Math.floor((ang+Math.PI/8)/(2*Math.PI/N))%N;pieces[idx].t=(pieces[idx].t+1)%3;pieces[idx].r=(pieces[idx].r+1)%4;draw();updateScore();}c.addEventListener('pointerdown',tap,{passive:true});c.addEventListener('touchstart',tap,{passive:true});function reset(){init();draw();updateScore();}init();draw();updateScore();</script></body></html>
