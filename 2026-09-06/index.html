<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋星軌道タップ</title><style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;touch-action:none}canvas{flex:1;display:block;width:100%;height:100%}#ui{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-size:14px;pointer-events:none}#title{font-size:12px;opacity:.6}#score{font-size:18px}#info{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;opacity:.7}</style></head><body><div id="ui"><div id="title">秋星軌道タップ</div><div id="score">SCORE:0</div></div><canvas id="c"></canvas><div id="info">タップで推進・軌道修正　隕石を避け月→火星へ</div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,star,meteors,score=0,combo=0,targets;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}window.onresize=resize;resize();function reset(){star={x:40,y:H*.6,vx:1.8,vy:-0.6,r:5};meteors=[];for(let i=0;i<4;i++)meteors.push({x:Math.random()*W*.6+W*.3,y:Math.random()*H*.7+40,r:8,vx:-1.2-Math.random(),vy:0.8+Math.random()});targets=[{x:W*.35,y:H*.22,r:18,name:'月',hit:false},{x:W*.72,y:H*.18,r:14,name:'火星',hit:false}];combo=0}reset();function draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<60;i++){let x=(i*37)%W,y=(i*53)%H;ctx.fillRect(x,y,1,1)}ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(targets[0].x,targets[0].y,targets[0].r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f55';ctx.beginPath();ctx.arc(targets[1].x,targets[1].y,targets[1].r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#888';meteors.forEach(m=>{ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill()})}function update(){star.x+=star.vx;star.y+=star.vy;star.vy+=0.008;meteors.forEach(m=>{m.x+=m.vx;m.y+=m.vy;if(m.x<0)m.x=W});if(star.y>H-20)star.vy=-Math.abs(star.vy)*.7;if(star.x>W)reset();meteors.forEach(m=>{let dx=m.x-star.x,dy=m.y-star.y;if(dx*dx+dy*dy<(m.r+star.r)**2)reset()});targets.forEach((t,i)=>{let dx=t.x-star.x,dy=t.y-star.y;if(dx*dx+dy*dy<(t.r+star.r)**2&&!t.hit){t.hit=true;score+=10+combo*5;combo++;document.getElementById('score').textContent='SCORE:'+score;if(i===0)targets[1].hit=false;if(i===1)reset()}})}function tap(e){const r=c.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left,y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;const dx=x-star.x,dy=y-star.y;const len=Math.hypot(dx,dy)||1;star.vx+=dx/len*1.4;star.vy+=dy/len*1.4;combo=Math.max(0,combo-1)}c.addEventListener('pointerdown',tap,{passive:true});c.addEventListener('touchstart',tap,{passive:true});function loop(){update();draw();requestAnimationFrame(loop)}loop();</script></body></html>
