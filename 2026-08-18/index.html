<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>甲子園スイング</title><style>body{margin:0;background:#0a2f1e;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}canvas{background:#0f4a2e;border:4px solid #f4d03f;margin:8px 0;border-radius:8px}header{font-size:14px;margin-top:8px} #ui{display:flex;gap:20px;font-size:18px}button{padding:8px 16px;font-size:16px;background:#f4d03f;color:#0a2f1e;border:none;border-radius:6px;margin:4px}</style></head><body><header>甲子園スイング</header><div id="ui"><div>得点:<span id="score">0</span></div><div>アウト:<span id="outs">0</span>/3</div></div><canvas id="c" width="320" height="440"></canvas><button id="start">リスタート</button><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let ballY=0,ballSpeed=2.8,score=0,outs=0,swinging=0,gameOver=false;function reset(){ballY=20;score=0;outs=0;swinging=0;gameOver=false;document.getElementById('score').textContent=0;document.getElementById('outs').textContent=0}function draw(){ctx.fillStyle='#0f4a2e';ctx.fillRect(0,0,320,440);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(160,ballY,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f4d03f';ctx.fillRect(240,200,12,60);if(swinging>0){ctx.save();ctx.translate(246,230);ctx.rotate((swinginging-15)*0.12);ctx.fillRect(-6,-30,12,70);ctx.restore()}ctx.fillStyle='#fff';ctx.fillRect(0,380,320,8);ctx.fillStyle='#f00';ctx.fillRect(140,200,40,4)}function update(){if(gameOver)return;ballY+=ballSpeed;if(ballY>400){outs++;document.getElementById('outs').textContent=outs;if(outs>=3){gameOver=true}else ballY=20}if(swinging>0)swinging--;if(swinging===15&&Math.abs(ballY-200)<30){score++;document.getElementById('score').textContent=score;ballY=20}}function loop(){update();draw();requestAnimationFrame(loop)}function swing(){if(gameOver)return;swinging=30}if(c.ontouchstart===undefined){c.addEventListener('mousedown',swing)}else{c.addEventListener('touchstart',e=>{e.preventDefault();swing()}, {passive:false})}document.getElementById('start').onclick=()=>{reset()};reset();loop();</script></body></html>
