<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白露露玉配置</title><style>body{margin:0;background:#f5f0e6;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none}canvas{border:2px solid #8b5a2b;background:#e8d5b7;border-radius:8px;margin:8px 0}#title{font-size:14px;color:#5c4033;margin:8px 0 0}#status{font-size:13px;color:#5c4033;margin:4px 0}#btn{margin:4px;padding:6px 14px;background:#d2b48c;border:1px solid #8b5a2b;border-radius:4px;font-size:13px}</style></head><body><div id="title">白露露玉配置</div><canvas id="c" width="320" height="320"></canvas><div id="status">タップで配置 / 長押しで色変更 / ステージクリアを目指せ</div><button id="btn">リセット</button><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),s=document.getElementById('status');let g=Array(16).fill(0),sz=80,cols=['#fff','#4a90e2','#e27a3f','#7ed321'];function draw(){ctx.clearRect(0,0,320,320);ctx.strokeStyle='#8b5a2b';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(0,i*80);ctx.lineTo(320,i*80);ctx.stroke();ctx.beginPath();ctx.moveTo(i*80,0);ctx.lineTo(i*80,320);ctx.stroke()}for(let y=0;y<4;y++)for(let x=0;x<4;x++){let v=g[y*4+x];if(v){ctx.fillStyle=cols[v];ctx.beginPath();ctx.arc(x*80+40,y*80+40,22,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.stroke()}}}function idx(x,y){return y*4+x}function win(){for(let i=0;i<16;i++)if(!g[i])return false;for(let y=0;y<4;y++)for(let x=0;x<4;x++){let v=g[idx(x,y)];if(x<3&&v===g[idx(x+1,y)])return false;if(y<3&&v===g[idx(x,y+1)])return false}return true}let sel=-1,lt=0;function down(e){e.preventDefault();let r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/sz),y=Math.floor((e.clientY-r.top)/sz);if(x<0||x>3||y<0||y>3)return;let i=idx(x,y),t=Date.now();if(sel===-1){if(!g[i]){g[i]=1;sel=i}else sel=i;lt=t}else{if(i===sel){if(t-lt>400){g[i]=g[i]%3+1;lt=0}else{g[i]=0;sel=-1}}else if(!g[i]){g[i]=g[sel];g[sel]=0;sel=-1}else sel=i}draw();if(win()){s.textContent='クリア！秋の模様完成';setTimeout(()=>s.textContent='素晴らしい配置です',1200)}}c.addEventListener('pointerdown',down);document.getElementById('btn').onclick=()=>{g.fill(0);sel=-1;s.textContent='タップで配置 / 長押しで色変更';draw()};draw();</script></body></html>
