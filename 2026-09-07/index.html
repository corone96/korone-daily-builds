<!doctype html><html><head><meta name="viewport"content="width=device-width,initial-scale=1"><style>body{margin:0;background:#111;color:#eee;font-family:sans-serif;text-align:center}canvas{background:#222;border:2px solid #0a0;display:block;margin:8px auto;touch-action:none}h1{font-size:14px;margin:4px;color:#0af}.ctrl{margin:6px}button{background:#0a0;color:#fff;border:0;padding:8px 14px;margin:3px;border-radius:4px;font-size:14px}button:active{background:#080}.info{font-size:12px;margin:4px}</style></head><body><h1>島守り配置パズル</h1><canvas id="c"width="280"height="280"></canvas><div class="info">土砂源→島を遮断（残り<span id="cnt">3</span>個）</div><div class="ctrl"><button id="test">流路チェック</button><button id="rst">リセット</button></div><div id="msg"class="info"></div><script>const cvs=document.getElementById('c'),ctx=cvs.getContext('2d'),W=5,S=56;let grid=Array(W).fill().map(()=>Array(W).fill(0)),rem=3,src=[0,0,0,4],goal=[4,1,4,2,4,3];function draw(){ctx.fillStyle='#222';ctx.fillRect(0,0,280,280);ctx.strokeStyle='#444';ctx.lineWidth=1;for(let y=0;y<W;y++)for(let x=0;x<W;x++){const px=x*S,py=y*S;if(grid[y][x])ctx.fillStyle='#0a4';else ctx.fillStyle='#333';ctx.fillRect(px+1,py+1,S-2,S-2);ctx.strokeRect(px,py,S,S)}ctx.fillStyle='#f80';src.forEach((x,i)=>{const y=i%2?1:0;ctx.fillRect(x*S+18,y*S+8,20,12)});ctx.fillStyle='#0af';goal.forEach((x,i)=>{const y=3;ctx.fillRect(x*S+8,y*S+18,40,20)})}function place(x,y){if(rem<=0||x<0||x>=W||y<0||y>=W)return;if(grid[y][x]){grid[y][x]=0;rem++}else{grid[y][x]=1;rem--}document.getElementById('cnt').innerText=rem;draw()}cvs.addEventListener('pointerdown',e=>{const r=cvs.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/S),y=Math.floor((e.clientY-r.top)/S);place(x,y)});document.getElementById('test').onclick=()=>{let vis=Array(W).fill().map(()=>Array(W).fill(0)),q=[];for(let i=0;i<src.length;i+=2)q.push({x:src[i],y:i%4?1:0});let ok=1;while(q.length){const p=q.shift();if(vis[p.y][p.x])continue;vis[p.y][p.x]=1;if(goal.includes(p.x)&&p.y===3){ok=0;break}[[0,1],[1,0],[0,-1],[-1,0]].forEach(d=>{const nx=p.x+d[0],ny=p.y+d[1];if(nx>=0&&nx<W&&ny>=0&&ny<W&&!grid[ny][nx]&&!vis[ny][nx])q.push({x:nx,y:ny})})}document.getElementById('msg').innerHTML=ok?'<span style="color:#0f0">守護成功！</span>':'<span style="color:#f44">土砂到達…</span>'};document.getElementById('rst').onclick=()=>{grid=Array(W).fill().map(()=>Array(W).fill(0));rem=3;document.getElementById('cnt').innerText=3;document.getElementById('msg').innerHTML='';draw()};draw();</script></body></html>
