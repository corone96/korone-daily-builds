<!doctype html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>万倍日の跳ね籾</title>
<style>
html,body{margin:0;height:100%;background:#f6f1e6;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}
#app{position:fixed;inset:0;touch-action:none;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;gap:14px;background:rgba(246,241,230,.42);}
h1{font:700 30px serif;color:#8d1d16;margin:0;letter-spacing:.04em;}
p{margin:0;color:#3c2a22;font:16px/1.55 sans-serif;max-width:22em;}
button{font:700 18px sans-serif;padding:14px 32px;border-radius:999px;border:2px solid #8d1d16;background:#c5362c;color:#fff;touch-action:manipulation;min-height:48px;}
#hud{position:absolute;left:0;right:0;top:0;display:none;justify-content:space-between;gap:8px;padding:12px 14px;font:700 15px sans-serif;color:#6e1a14;pointer-events:none;text-shadow:0 1px 0 #fff;}
#hud span{background:rgba(255,255,255,.55);border-radius:999px;padding:6px 10px;}
#resScore{font:700 22px serif;color:#8d1d16;}
</style>
</head>
<body>
<div id='app'>
<canvas id='c'></canvas>
<div id='hud'><span id='scoreBox'>点 0</span><span id='timeBox'>75.0</span><span id='spillBox'>こぼれ 0/10</span><span id='chainBox'>段 -</span></div>
<div id='title' class='overlay'>
<h1>万倍日の跳ね籾</h1>
<p>米粒の中心をタップするほど遠く飛ぶ。連鎖と壁跳ねで75秒・4000点、角の長飛びはこぼれる。</p>
<button id='startBtn' type='button'>はじめる</button>
</div>
<div id='result' class='overlay' style='display:none'>
<h1 id='resText'>結果</h1>
<p id='resScore'>スコア 0</p>
<button id='retryBtn' type='button'>もう一度</button>
</div>
</div>
<script>
(function(){
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var hud=document.getElementById('hud');
var titleEl=document.getElementById('title');
var resultEl=document.getElementById('result');
var scoreBox=document.getElementById('scoreBox');
var timeBox=document.getElementById('timeBox');
var spillBox=document.getElementById('spillBox');
var chainBox=document.getElementById('chainBox');
var resText=document.getElementById('resText');
var resScore=document.getElementById('resScore');
var W=360,H=640,dpr=1;
var state='title';
var score=0;
var spills=0;
var grains=[];
var flyers=[];
var effects=[];
var gid=1;
var shake=0;
var flash=0;
var lastMs=0;
var spawnAcc=0;
var elapsed=0;
var lastDepth=0;
function publish(){window.__game={score:score,state:state};}
publish();
function resize(){
dpr=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth;H=window.innerHeight;
canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
canvas.style.width=W+'px';canvas.style.height=H+'px';
ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
resize();
function params(t){
if(t>=50)return{spawn:1.7,life:2.6,cluster:0.8};
if(t>=25)return{spawn:2.6,life:3.2,cluster:0.6};
return{spawn:4.0,life:4.0,cluster:0};
}
function addGrain(x,y,life){grains.push({id:gid++,x:x,y:y,born:elapsed,life:life,sink:0});}
function spawnAt(cluster,life){
var m=22,x=W/2,y=H/2,i,g,ang,dist,ok,left,right,top,bot,inset;
for(i=0;i<12;i++){
if(grains.length&&Math.random()<cluster){
g=grains[(Math.random()*grains.length)|0];
ang=Math.random()*Math.PI*2;
dist=28+Math.random()*22;
x=g.x+Math.cos(ang)*dist;
y=g.y+Math.sin(ang)*dist;
}else{
inset=m;
left=inset;right=Math.max(inset+1,W-inset);
top=inset;bot=Math.max(inset+1,H-inset);
x=left+Math.random()*(right-left);
y=top+Math.random()*(bot-top);
}
x=Math.max(m,Math.min(W-m,x));
y=Math.max(m,Math.min(H-m,y));
ok=true;
for(g of grains){if(Math.hypot(g.x-x,g.y-y)<20)ok=false;}
if(ok)break;
}
addGrain(x,y,life);
}
function spawnCenter(life){
var sx=Math.max(12,W/2-150);
var sy=Math.max(12,H/2-150);
var x=W/2+(Math.random()-0.5)*2*sx;
var y=H/2+(Math.random()-0.5)*2*sy;
x=Math.max(22,Math.min(W-22,x));
y=Math.max(22,Math.min(H-22,y));
addGrain(x,y,life);
}
function resetWorld(){
grains=[];flyers=[];effects=[];
score=0;spills=0;shake=0;flash=0;elapsed=0;spawnAcc=0;lastDepth=0;gid=1;
var i;for(i=0;i<5;i++)spawnCenter(4.0);
}
function setState(s){
state=s;publish();
titleEl.style.display=s==='title'?'flex':'none';
resultEl.style.display=(s==='won'||s==='lost')?'flex':'none';
hud.style.display=s==='playing'?'flex':'none';
}
function startGame(){
if(state==='playing')return;
resetWorld();
lastMs=performance.now();
setState('playing');
updateHud();
}
function endGame(kind){
if(state!=='playing')return;
setState(kind);
var label=kind==='won'?(score>=7000?'最高評価　万倍':'達成'):(spills>=10?'失敗・こぼれ':'失敗');
resText.textContent=label;
var extra=(score>=7000&&kind==='won')?'　万倍':'';
resScore.textContent='スコア '+score+extra+(kind==='won'?'　勝ち':'　負け');
}
function updateHud(){
scoreBox.textContent='点 '+score;
timeBox.textContent=Math.max(0,75-elapsed).toFixed(1);
spillBox.textContent='こぼれ '+spills+'/10';
chainBox.textContent=lastDepth?('段 '+lastDepth):'段 -';
}
function crack(grain,axisX,axisY,flight,depth,chainStart,fromWall){
var idx=grains.indexOf(grain);
if(idx<0)return;
grains.splice(idx,1);
score+=20*depth;
if(fromWall)score+=25;
lastDepth=depth;
publish();
shake=Math.min(48,shake+depth*4);
flash=Math.min(1,flash+0.12+depth*0.08);
effects.push({type:'burst',x:grain.x,y:grain.y,t:0});
effects.push({type:'float',x:grain.x,y:grain.y-16,t:0,text:'+'+(20*depth+(fromWall?25:0))});
var g;for(g of grains){if(Math.hypot(g.x-grain.x,g.y-grain.y)<=30)g.sink=0.12;}
var spd=flight/0.4;
launch(grain.x,grain.y,axisX*spd,axisY*spd,depth,chainStart);
launch(grain.x,grain.y,-axisX*spd,-axisY*spd,depth,chainStart);
updateHud();
}
function launch(x,y,vx,vy,depth,chainStart){
flyers.push({x:x,y:y,vx:vx,vy:vy,t:0,depth:depth,chainStart:chainStart,bounces:0,alive:true,hit:{}});
}
function spillOne(){
spills+=1;flash=1;shake=Math.min(48,shake+10);
effects.push({type:'float',x:W/2,y:78,t:0,text:'こぼれ'});
updateHud();
if(spills>=10)endGame('lost');
}
function onPointer(x,y){
if(state!=='playing')return;
var best=null,bestD=1e9,g,d;
for(g of grains){
d=Math.hypot(x-g.x,y-g.y);
if(d<=22&&d<bestD){best=g;bestD=d;}
}
if(!best)return;
var ax=1,ay=0,flight=56;
if(bestD<4){ax=1;ay=0;flight=100;}
else if(bestD<=10){ax=(x-best.x)/bestD;ay=(y-best.y)/bestD;flight=100;}
else{ax=(x-best.x)/bestD;ay=(y-best.y)/bestD;flight=56;}
crack(best,ax,ay,flight,1,performance.now(),false);
}
canvas.addEventListener('pointerdown',function(e){
e.preventDefault();
var r=canvas.getBoundingClientRect();
onPointer(e.clientX-r.left,e.clientY-r.top);
},{passive:false});
function stepFlyer(f,dt){
if(!f.alive||state!=='playing')return;
var remain=0.4-f.t;
var step=Math.min(dt,remain);
if(step<=0){land(f);f.alive=false;return;}
f.x+=f.vx*step;f.y+=f.vy*step;f.t+=step;
var wall=0;
if(f.x<22){f.x=22;f.vx=Math.abs(f.vx);wall++;}
if(f.x>W-22){f.x=W-22;f.vx=-Math.abs(f.vx);wall++;}
if(f.y<22){f.y=22;f.vy=Math.abs(f.vy);wall++;}
if(f.y>H-22){f.y=H-22;f.vy=-Math.abs(f.vy);wall++;}
if(wall){
f.bounces+=wall;
if(f.bounces>=2){f.alive=false;spillOne();return;}
}
var now=performance.now();
var pending=[];
var g;
for(g of grains){
if(f.hit[g.id])continue;
if(Math.hypot(g.x-f.x,g.y-f.y)<=36){
f.hit[g.id]=1;
var age=(now-f.chainStart)/1000;
if(f.depth<6&&age<=0.70)pending.push(g);
}
}
var sp=Math.hypot(f.vx,f.vy)||1;
var ax=f.vx/sp,ay=f.vy/sp;
for(g of pending){
if(grains.indexOf(g)<0)continue;
crack(g,ax,ay,56,f.depth+1,f.chainStart,f.bounces>0);
}
if(f.alive&&f.t>=0.4-1e-6){land(f);f.alive=false;}
}
function land(f){
if(state!=='playing')return;
var p=params(elapsed);
var m=22;
var x=Math.max(m,Math.min(W-m,f.x));
var y=Math.max(m,Math.min(H-m,f.y));
addGrain(x,y,p.life);
effects.push({type:'ring',x:x,y:y,t:0});
var g;for(g of grains){if(Math.hypot(g.x-x,g.y-y)<=30&&Math.hypot(g.x-x,g.y-y)>1)g.sink=0.12;}
}
function tick(now){
requestAnimationFrame(tick);
var dt=Math.min(0.033,(now-lastMs)/1000||0);
lastMs=now;
if(state==='playing'){
elapsed+=dt;
var p=params(elapsed);
spawnAcc+=dt;
while(spawnAcc>=p.spawn&&state==='playing'){spawnAcc-=p.spawn;spawnAt(p.cluster,p.life);}
var g;for(g of grains){g.sink=Math.max(0,g.sink-dt);}
grains=grains.filter(function(gr){return elapsed-gr.born<gr.life;});
var list=flyers.slice();
var f,left,guard,chunk;
for(f of list){
left=dt;guard=0;
while(f.alive&&left>0&&guard<8&&state==='playing'){
chunk=Math.min(left,0.012);
stepFlyer(f,chunk);
left-=chunk;guard++;
}
}
flyers=flyers.filter(function(fl){return fl.alive;});
if(state==='playing'&&elapsed>=75)endGame(score>=4000?'won':'lost');
if(state==='playing')updateHud();
}
shake*=Math.pow(0.05,dt);
if(shake<0.25)shake=0;
flash=Math.max(0,flash-dt*1.5);
var e;for(e of effects)e.t+=dt;
effects=effects.filter(function(ef){return ef.t<(ef.type==='float'?0.7:0.45);});
publish();
draw();
}
function drawGrain(x,y,sink,flying,vx,vy){
ctx.save();
ctx.translate(x,y);
if(flying){ctx.rotate(Math.atan2(vy,vx));ctx.scale(1.3,0.55);}
else if(sink>0){ctx.scale(1.05,0.72);ctx.translate(0,6);}
ctx.fillStyle='#e2b43a';
ctx.beginPath();ctx.ellipse(0,0,22,16,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff1c4';
ctx.beginPath();ctx.ellipse(-6,-4,7,4,-0.4,0,Math.PI*2);ctx.fill();
ctx.restore();
}
function draw(){
var ox=(Math.random()-0.5)*shake;
var oy=(Math.random()-0.5)*shake;
ctx.setTransform(dpr,0,0,dpr,ox*dpr,oy*dpr);
ctx.fillStyle='#f6f1e6';
ctx.fillRect(-30,-30,W+60,H+60);
if(flash>0){ctx.fillStyle='rgba(180,40,32,'+(flash*0.18)+')';ctx.fillRect(0,0,W,H);}
ctx.save();
ctx.globalAlpha=0.16;
ctx.strokeStyle='#b42318';
ctx.lineWidth=4;
var rad=Math.min(W,H)*0.2;
ctx.beginPath();ctx.arc(W/2,H*0.46,rad,0,Math.PI*2);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,H*0.46,rad-8,0,Math.PI*2);ctx.stroke();
ctx.fillStyle='#b42318';
ctx.font='bold '+Math.max(16,Math.min(28,W*0.06))+'px serif';
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText('一粒万倍日',W/2,H*0.46);
ctx.restore();
var e;
for(e of effects){
if(e.type==='ring'){
ctx.strokeStyle='rgba(180,35,24,'+(1-e.t/0.45)+')';
ctx.beginPath();ctx.arc(e.x,e.y,8+e.t*80,0,Math.PI*2);ctx.stroke();
}else if(e.type==='burst'){
ctx.save();ctx.translate(e.x,e.y);ctx.scale(1.3,0.55);
ctx.globalAlpha=1-e.t/0.16;
ctx.fillStyle='#f0c14a';
ctx.beginPath();ctx.ellipse(0,0,22,16,0,0,Math.PI*2);ctx.fill();
ctx.restore();
}else if(e.type==='float'){
ctx.globalAlpha=1-e.t/0.7;
ctx.fillStyle='#9d1c14';
ctx.font='bold 16px sans-serif';
ctx.textAlign='center';
ctx.fillText(e.text,e.x,e.y-e.t*36);
ctx.globalAlpha=1;
}
}
if(state==='title'){
drawGrain(W*0.32,H*0.62,0,false,0,0);
drawGrain(W*0.58,H*0.7,0,false,0,0);
drawGrain(W*0.46,H*0.78,0,false,0,0);
}
var g;for(g of grains){
var fade=Math.min(1,(g.life-(elapsed-g.born))/0.35);
ctx.globalAlpha=state==='playing'?Math.max(0.15,fade):1;
drawGrain(g.x,g.y,g.sink,false,0,0);
ctx.globalAlpha=1;
}
var f;for(f of flyers)drawGrain(f.x,f.y,0,true,f.vx,f.vy);
}
document.getElementById('startBtn').addEventListener('pointerdown',function(e){e.preventDefault();startGame();},{passive:false});
document.getElementById('retryBtn').addEventListener('pointerdown',function(e){e.preventDefault();startGame();},{passive:false});
window.addEventListener('contextmenu',function(e){e.preventDefault();});
setState('title');
requestAnimationFrame(function(t){lastMs=t;tick(t);});
})();
</script>
</body>
</html>
