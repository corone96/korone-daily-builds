<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ミサイル外交論理陣</title>
<style>
body{margin:0;background:#0a1628;color:#ddd;font-family:sans-serif;touch-action:none}
#wrap{max-width:480px;margin:0 auto;padding:8px}
h1{font-size:14px;margin:4px 0;color:#8cf;text-align:center}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#334;border:3px solid #556;padding:4px;margin:8px 0}
.cell{width:100%;aspect-ratio:1;background:#112;border:1px solid #445;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;user-select:none}
.cell.missile{background:#311;color:#f66}
.cell.ok{background:#132}
.cell.inter{background:#248;color:#8cf}
.cell.dip{background:#284;color:#8f8}
#pal{display:flex;gap:8px;justify-content:center;margin:8px 0}
.btn{padding:8px 14px;background:#223;border:2px solid #556;border-radius:6px;font-size:13px}
.btn.sel{border-color:#8cf}
#stat{font-size:12px;text-align:center;margin:4px 0;height:18px}
#info{font-size:10px;color:#688;text-align:center}
</style>
</head>
<body>
<div id="wrap">
<h1>ミサイル外交論理陣</h1>
<div id="grid"></div>
<div id="pal">
<div class="btn" data-p="I">迎撃装置</div>
<div class="btn" data-p="D">外交官</div>
</div>
<div id="stat"></div>
<div id="info">タップ:配置　長押し:除去　脅威を全部中和せよ</div>
</div>
<script>
const W=5,H=5;
let grid=[],missiles=[[1,2],[3,1],[4,3]],sel='I',placed=[];
const g=document.getElementById('grid');
const stat=document.getElementById('stat');
function init(){
  grid=Array.from({length:H},()=>Array(W).fill(0));
  placed=[];
  g.innerHTML='';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=document.createElement('div');
    c.className='cell';
    c.dataset.x=x;c.dataset.y=y;
    c.addEventListener('pointerdown',e=>onTap(e,c));
    let t=0;
    c.addEventListener('pointerdown',()=>{clearTimeout(t);t=setTimeout(()=>remove(x,y),420)});
    g.appendChild(c);
  }
  missiles.forEach(m=>{
    const idx=m[1]*W+m[0];
    g.children[idx].classList.add('missile');
  });
  update();
}
function onTap(e,c){
  const x=+c.dataset.x,y=+c.dataset.y;
  if(grid[y][x])return;
  if(sel==='I')grid[y][x]=1;
  else grid[y][x]=2;
  placed.push([x,y]);
  render();
  checkWin();
}
function remove(x,y){
  if(!grid[y][x])return;
  grid[y][x]=0;
  placed=placed.filter(p=>!(p[0]===x&&p[1]===y));
  render();
  checkWin();
}
function render(){
  [...g.children].forEach(c=>{
    c.className='cell';
    const x=+c.dataset.x,y=+c.dataset.y;
    if(grid[y][x]===1)c.classList.add('inter');
    else if(grid[y][x]===2)c.classList.add('dip');
    else if(missiles.some(m=>m[0]===x&&m[1]===y))c.classList.add('missile');
  });
}
function checkWin(){
  let covered=0,over=false;
  missiles.forEach(m=>{
    const x=m[0],y=m[1];
    if(grid[y][x])over=true;
    let cov=false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&nx<W&&ny>=0&&ny<H&&grid[ny][nx]===1)cov=true;
    }
    for(let i=0;i<W;i++)if(grid[y][i]===2||grid[i][x]===2)cov=true;
    if(cov)covered++;
  });
  if(over){stat.textContent='重複禁止！';stat.style.color='#f66';return;}
  if(covered===missiles.length&&placed.length<=4){
    stat.textContent='外交成功！';stat.style.color='#8f8';
  }else{
    stat.textContent=`中和:${covered}/${missiles.length}`;stat.style.color='#8cf';
  }
}
function update(){render();checkWin();}
document.querySelectorAll('#pal .btn').forEach(b=>{
  b.addEventListener('pointerdown',()=>{
    document.querySelectorAll('#pal .btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    sel=b.dataset.p;
  });
});
document.getElementById('pal').children[0].classList.add('sel');
init();
window.onresize=()=>{};
</script>
</body>
</html>
