<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋祭り灯配置</title><style>body{margin:0;background:#1a120b;color:#ffe8c2;font-family:sans-serif}header{padding:8px;text-align:center;font-size:14px;border-bottom:2px solid #ff9f1c} #score{font-size:18px;margin:4px} #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;max-width:480px;margin:0 auto;background:#3a2a1f;border:4px solid #ff9f1c;border-radius:8px;touch-action:none} .cell{width:100%;aspect-ratio:1;background:#5c4633;border:2px solid #ff9f1c;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;user-select:none} .cell:active{background:#ff9f1c;color:#1a120b} #sel{display:flex;justify-content:center;gap:8px;margin:8px;flex-wrap:wrap} button{background:#ff9f1c;color:#1a120b;border:none;padding:8px 14px;border-radius:20px;font-size:14px} button:active{background:#e67e00} .info{font-size:12px;text-align:center;margin:4px;color:#ffcc99}</style></head><body><header><div>秋祭り灯配置</div><div id="score">スコア: 0</div></header><div id="sel"><button data-t="提">提灯</button><button data-t="屋">屋台</button><button data-t="御">みこし</button><button id="clear">クリア</button></div><div id="grid"></div><div class="info">タップ配置 / 長押し回転・削除<br>隣接禁止・バランス・視界で高得点</div><script>const gridEl=document.getElementById('grid'),scoreEl=document.getElementById('score');let grid=Array(25).fill(null),sel='提',score=0;function draw(){gridEl.innerHTML='';for(let i=0;i<25;i++){const c=document.createElement('div');c.className='cell';c.dataset.i=i;if(grid[i])c.textContent=grid[i];gridEl.appendChild(c)}calcScore()}function calcScore(){let s=0,types={提:0,屋:0,御:0};for(let i=0;i<25;i++)if(grid[i]){types[grid[i]]++;const x=i%5,y=i/5|0;[[-1,0],[1,0],[0,-1],[0,1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx>=0&&nx<5&&ny>=0&&ny<5){const ni=ny*5+nx;if(grid[ni]===grid[i])s-=5}})}const bal=Math.min(types.提,types.屋,types.御)*3;s+=bal*4;let vis=0;for(let i=0;i<25;i++)if(!grid[i])vis++;s+=vis*2;score=Math.max(0,s);scoreEl.textContent='スコア: '+score}let pressT;gridEl.addEventListener('pointerdown',e=>{const i=+e.target.dataset.i;if(isNaN(i))return;pressT=setTimeout(()=>{if(grid[i]){grid[i]=grid[i]==='提'?'屋':grid[i]==='屋'?'御':'提';draw()}},450);e.target.onpointerup=()=>{clearTimeout(pressT);if(!grid[i]){grid[i]=sel;draw()}else if(Date.now()-pressT<400){grid[i]=null;draw()};e.target.onpointerup=null}});gridEl.addEventListener('pointerleave',()=>clearTimeout(pressT));document.querySelectorAll('#sel button[data-t]').forEach(b=>b.onclick=()=>sel=b.dataset.t);document.getElementById('clear').onclick=()=>{grid.fill(null);draw()};draw();</script></body></html>
