<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分子キラリティ探検</title><style>body{margin:0;background:#0a0f1e;color:#0ff;font-family:sans-serif;touch-action:none}header{padding:4px 8px;font-size:12px;text-align:center;border-bottom:1px solid #0ff}canvas{display:block;margin:0 auto;background:#112;border:1px solid #0ff;max-width:100%;height:auto} #ui{padding:8px;text-align:center;font-size:14px}button{margin:4px;padding:8px 16px;background:#112;color:#0ff;border:1px solid #0ff;border-radius:4px;font-size:14px} .stat{display:inline-block;margin:0 8px}</style></head><body><header>分子キラリティ探検</header><canvas id="c" width="360" height="420"></canvas><div id="ui"><div><span class="stat">ステージ <span id="st">1</span></span><span class="stat">スコア <span id="sc">0</span></span></div><div><span class="stat">偏り <span id="bias">0</span>%</span><span class="stat">目標 <span id="goal">60</span>%</span></div><div style="margin-top:8px"><button id="l">左経路</button><button id="r">右経路</button><button id="n">中立</button></div></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let stage=1,score=0,left=20,right=20,goal=60;const molecules=[];function initMols(){molecules.length=0;for(let i=0;i<40;i++)molecules.push({x:Math.random()*360,y:Math.random()*380-60,chir:Math.random()<0.5?-1:1,vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.5)*1.2});}function draw(){ctx.fillStyle='#112';ctx.fillRect(0,0,360,420);ctx.strokeStyle='#0ff';ctx.lineWidth=1;for(let m of molecules){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.chir*0.8);ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,4);ctx.lineTo(6,-4);ctx.closePath();ctx.fillStyle=m.chir>0?'#0f8':'#f80';ctx.fill();ctx.stroke();ctx.restore();}ctx.fillStyle='#0ff';ctx.fillText('L:'+left+' R:'+right,10,400);}function update(){for(let m of molecules){m.x+=m.vx;m.y+=m.vy;if(m.x<10||m.x>350)m.vx*=-1;if(m.y<10||m.y>360)m.vy*=-1;}}function calcBias(){const tot=left+right;return tot?Math.round(Math.abs(left-right)/tot*100):0;}function apply(choice){let addL=0,addR=0;if(choice==='l'){addL=8;addR=3;}else if(choice==='r'){addL=3;addR=8;}else{addL=addR=5;}left+=addL;right+=addR;score+=Math.abs(addL-addR)*2;for(let i=0;i<addL+addR;i++){molecules.push({x:180+Math.random()*40-20,y:200+Math.random()*40-20,chir:Math.random()<left/(left+right)?1:-1,vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.5)*1.2});}if(molecules.length>120)molecules.splice(0,molecules.length-120);const b=calcBias();document.getElementById('bias').textContent=b;document.getElementById('sc').textContent=score;if(b>=goal){stage++;goal=Math.min(90,goal+10);left=20;right=20;initMols();document.getElementById('st').textContent=stage;document.getElementById('goal').textContent=goal;}draw();}function loop(){update();draw();requestAnimationFrame(loop);}['l','r','n'].forEach(id=>{document.getElementById(id).addEventListener('pointerdown',e=>{apply(id);e.preventDefault();});});c.addEventListener('pointerdown',e=>{const rect=c.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width*360;if(x<120)apply('l');else if(x>240)apply('r');else apply('n');e.preventDefault();},{passive:false});initMols();document.getElementById('bias').textContent=0;document.getElementById('st').textContent=1;document.getElementById('goal').textContent=goal;loop();draw();</script></body></html>
