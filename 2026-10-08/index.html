<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タコ迷宮探索</title><style>body{margin:0;background:#0a2540;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}header{padding:8px;text-align:center;font-size:14px;border-bottom:1px solid #1a3a6e}#game{flex:1;display:flex;flex-direction:column;padding:12px;gap:12px}#scene{flex:1;background:#0f3a5c;border-radius:12px;padding:16px;font-size:15px;line-height:1.5;display:flex;align-items:center;justify-content:center;text-align:center}#choices{display:grid;grid-template-columns:1fr;gap:10px}#choices button{padding:18px;font-size:16px;background:#1e5a8c;border:none;color:#fff;border-radius:999px;touch-action:none}#status{display:flex;justify-content:space-between;font-size:13px;padding:0 4px}#bar{height:6px;background:#1a3a6e;border-radius:3px;overflow:hidden}#fill{height:100%;background:#4ade80;transition:width .3s}</style></head><body><header>タコ迷宮探索</header><div id="game"><div id="status"><div>ステージ <span id="st">1</span>/3</div><div>発見 <span id="dc">0</span></div><div>時間 <span id="tm">0</span>s</div></div><div id="bar"><div id="fill" style="width:0%"></div></div><div id="scene">海底の迷宮に潜った。タコの能力で謎を解こう。</div><div id="choices"><button data-c="0">カモフラージュ</button><button data-c="1">脱出</button><button data-c="2">観察</button></div></div><script>const scene=document.getElementById('scene'),stEl=document.getElementById('st'),dcEl=document.getElementById('dc'),tmEl=document.getElementById('tm'),fill=document.getElementById('fill'),btns=document.querySelectorAll('#choices button');let stage=1,time=0,disc=0,timer;function start(){stage=1;time=0;disc=0;clearInterval(timer);timer=setInterval(()=>{time++;tmEl.textContent=time;fill.style.width=Math.min(time*3,100)+'%'},1000);nextStage()}function nextStage(){stEl.textContent=stage;if(stage>3){end();return}const texts=['暗い岩陰に何かが動いた','前方に光る宝箱がある','天井から砂が落ちてきた'];scene.textContent=texts[stage-1];btns.forEach((b,i)=>{b.onclick=null;b.onpointerdown=e=>{e.preventDefault();choose(i)}})}function choose(c){const ok=Math.random()>.35;let msg='';if(ok){if(c===2)disc++;msg='成功！次のエリアへ';stage++;setTimeout(nextStage,600)}else{msg='失敗…時間をロス';time+=5}scene.textContent=msg;setTimeout(()=>{if(stage<=3)nextStage()},900)}function end(){clearInterval(timer);const score=time*2+disc*15;scene.innerHTML=`探索終了！<br>スコア: ${score}<br>時間:${time}s 発見:${disc}<br><button onclick="location.reload()" style="margin-top:12px;padding:8px 20px">もう一度</button>`;btns.forEach(b=>b.style.display='none')}btns.forEach(b=>b.style.touchAction='none');start();</script></body></html>
