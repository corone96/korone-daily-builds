<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山霊の岩よけ旅</title><style>body{margin:0;background:#0a140f;color:#ddd;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}canvas{background:#1a2a22;border:4px solid #3a5a44;width:100%;max-width:480px;height:auto;touch-action:none}h1{font-size:14px;margin:4px 0;color:#8ab38a}#ui{font-size:13px;margin:2px;color:#8ab38a}</style></head><body><h1>山霊の岩よけ旅</h1><canvas id="c" width="480" height="640"></canvas><div id="ui">スコア: <span id="s">0</span>　距離: <span id="d">0</span>m</div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let p={x:80,y:420,vy:0},obs=[],score=0,dist=0,over=false,frame=0;function reset(){p={x:80,y:420,vy:0};obs=[];score=0;dist=0;over=false;frame=0}c.addEventListener('pointerdown',e=>{if(over)reset();else p.vy=-9.5});function loop(){ctx.fillStyle='#1a2a22';ctx.fillRect(0,0,480,640);ctx.fillStyle='#3a5a44';ctx.fillRect(0,480,480,160);ctx.strokeStyle='#5a7a66';ctx.lineWidth=2;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(i*90-20,480);ctx.lineTo(i*90+40,640);ctx.stroke()}ctx.fillStyle='#8ab38a';ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5a7a66';ctx.fillRect(p.x-8,p.y-22,16,10);if(!over){p.vy+=0.45;p.y+=p.vy;if(p.y>420)p.y=420;if(p.y<80)p.y=80;dist+=0.8;score=Math.floor(dist);if(frame%28===0){obs.push({x:480,y:380+Math.random()*80,r:16+Math.random()*8})}obs.forEach(o=>{o.x-=4.2});obs=obs.filter(o=>o.x>-20);for(let o of obs){const dx=o.x-p.x,dy=o.y-p.y;if(Math.hypot(dx,dy)<o.r+16){over=true;break}}frame++}obs.forEach(o=>{ctx.fillStyle='#6b5a44';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3a2a22';ctx.beginPath();ctx.arc(o.x-o.r*0.3,o.y-o.r*0.3,o.r*0.35,0,Math.PI*2);ctx.fill()});document.getElementById('s').textContent=score;document.getElementById('d').textContent=Math.floor(dist);if(over){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,280,480,120);ctx.fillStyle='#ddd';ctx.font='20px sans-serif';ctx.fillText('ゲームオーバー',160,320);ctx.font='14px sans-serif';ctx.fillText('タップで再挑戦',175,355)}requestAnimationFrame(loop)}reset();loop();</script></body></html>
