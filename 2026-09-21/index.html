<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台風グッズ成長器</title><style>body{margin:0;font-family:sans-serif;background:#f0f4f8;color:#333}header{padding:8px;text-align:center;font-size:14px;color:#555}canvas{display:block;margin:0 auto;border:2px solid #ccc;border-radius:8px;background:#fff;max-width:100%;touch-action:none}#status{padding:8px;text-align:center;font-size:13px}#result{margin:12px;padding:10px;background:#fff;border:1px solid #ddd;border-radius:6px;font-size:13px;display:none}button{display:block;margin:8px auto;padding:10px 20px;font-size:15px;background:#007aff;color:#fff;border:none;border-radius:6px}button:active{background:#005bb5}</style></head><body><header>台風グッズ成長器</header><canvas id="c" width="320" height="380"></canvas><div id="status">タップでアイテムを成長させよう</div><button id="fin">完成して結果を見る</button><div id="result"></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let items=[{n:'水',l:0,x:60,y:120},{n:'懐中電灯',l:0,x:160,y:120},{n:'米',l:0,x:260,y:120},{n:'ラジオ',l:0,x:110,y:240},{n:'毛布',l:0,x:210,y:240}];function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.font='12px sans-serif';items.forEach(it=>{let s=20+it.l*12;ctx.fillStyle=['#4a90e2','#f1c40f','#d4a017','#2c3e50','#27ae60'][items.indexOf(it)];if(it.n==='水'){ctx.fillRect(it.x-s/2,it.y-s/2,s,s*0.7);ctx.fillStyle='#fff';ctx.fillText('水',it.x-8,it.y+5)}else if(it.n==='懐中電灯'){ctx.fillRect(it.x-s/3,it.y-s/2,s/1.5,s);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(it.x,it.y-s/2-8,6+it.l,0,Math.PI*2);ctx.fill()}else if(it.n==='米'){ctx.fillRect(it.x-s/2,it.y-s/3,s,s*0.6);ctx.fillStyle='#fff';ctx.fillText('米',it.x-6,it.y+4)}else if(it.n==='ラジオ'){ctx.fillRect(it.x-s/2,it.y-s/2,s,s*0.5);ctx.fillStyle='#fff';ctx.fillRect(it.x-10,it.y-s/2+5,20,4)}else{ctx.fillRect(it.x-s/2,it.y-s/2,s,s*0.4);ctx.fillStyle='#fff';ctx.fillText('毛布',it.x-12,it.y+2)}ctx.fillStyle='#333';ctx.fillText(it.n+':Lv'+it.l,it.x-22,it.y+38)});}function hit(x,y){for(let it of items){let d=Math.hypot(it.x-x,it.y-y);if(d<40)return it}return null}c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,it=hit(x,y);if(it){it.l=Math.min(5,it.l+1);draw();document.getElementById('status').textContent=it.n+' が成長！'}});document.getElementById('fin').onclick=()=>{let sc=items.reduce((a,b)=>a+b.l,0)*18,txt='<b>有用度スコア: '+sc+'</b><br>';items.forEach(i=>{let m=i.n==='水'?'味は微妙だけど安心':i.n==='懐中電灯'?'暗闇で光る！でも電池忘れ注意':i.n==='米'?'炊けるまでが長い':i.n==='ラジオ'?'情報大事！でも音量注意': '暖かいけどかさばる';txt+=i.n+' Lv'+i.l+' → '+m+'<br>'});let r=document.getElementById('result');r.innerHTML=txt;r.style.display='block';};draw();</script></body></html>
