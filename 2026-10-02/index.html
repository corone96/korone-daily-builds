<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>迷いザメ観光ラリー</title><style>body{margin:0;background:#0a3d62;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none}header{text-align:center;padding:4px;font-size:14px;background:#001f3f}canvas{display:block;margin:0 auto;background:#0077b6;border-bottom:4px solid #00b4d8}#ui{position:absolute;top:50px;left:10px;font-size:13px;background:rgba(0,0,0,.4);padding:4px 8px;border-radius:6px}#msg{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:15px;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:20px;pointer-events:none}</style></head><body><header>迷いザメ観光ラリー</header><canvas id="c" width="360" height="640"></canvas><div id="ui">時間: <span id="t">0</span>s　スコア: <span id="s">0</span></div><div id="msg"></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),W=360,H=640;let shark={x:80,y:300,vx:0,vy:0},spots=[{x:120,y:180,r:22,id:1},{x:240,y:280,r:22,id:2},{x:160,y:420,r:22,id:3},{x:280,y:520,r:22,id:4}],collected=new Set(),startT=0,score=0,dashing=false,path=[],msgEl=document.getElementById('msg'),tEl=document.getElementById('t'),sEl=document.getElementById('s');function draw(){ctx.fillStyle='#0077b6';ctx.fillRect(0,0,W,H);ctx.fillStyle='#00b4d8';for(let i=0;i<8;i++){ctx.fillRect((i*47)%W,((Date.now()/40+i*30)%H),30,3)}ctx.strokeStyle='#90e0ef';ctx.lineWidth=2;for(let i=0;i<spots.length;i++){const p=spots[i];if(!collected.has(p.id)){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffd166';ctx.fillText('観光',p.x-18,p.y+4)}}ctx.fillStyle='#ff6b6b';ctx.save();ctx.translate(shark.x,shark.y);ctx.rotate(Math.atan2(shark.vy,shark.vx)||0);ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-12,9);ctx.lineTo(-12,-9);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(8,-3,6,6);ctx.restore();ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.fillText('長押しでダッシュ',10,30)}function update(){if(startT){const now=Date.now()/1000;tEl.textContent=(now-startT).toFixed(1);if(collected.size===spots.length){endGame()}}if(dashing){shark.vx*=1.08;shark.vy*=1.08}shark.x+=shark.vx;shark.y+=shark.vy;shark.vx*=0.92;shark.vy*=0.92;if(shark.x<20)shark.x=20;if(shark.x>W-20)shark.x=W-20;if(shark.y<40)shark.y=40;if(shark.y>H-20)shark.y=H-20;for(let p of spots){if(!collected.has(p.id)&&Math.hypot(p.x-shark.x,p.y-shark.y)<p.r+12){collected.add(p.id);score+=100;sEl.textContent=score;msgEl.textContent='おっ！観光完了！';setTimeout(()=>msgEl.textContent='',800)}}if(Math.random()<0.01&&collected.size<2){msgEl.textContent=['ザメが迷子…','海藻に絡まった','観光客に逃げられた'][Math.floor(Math.random()*3)];setTimeout(()=>msgEl.textContent='',900)}}function loop(){update();draw();requestAnimationFrame(loop)}function endGame(){const time=(Date.now()/1000-startT).toFixed(1);msgEl.textContent=`完走！ ${time}s / ${score}pt`;setTimeout(()=>{msgEl.textContent='もう一度タップでリセット';c.onclick=()=>{location.reload()}},1200)}function start(pos){startT=Date.now()/1000;shark.x=pos.x;shark.y=pos.y;collected.clear();score=0;sEl.textContent=0;msgEl.textContent=''}let holdTimer=null;function onDown(e){e.preventDefault();const rect=c.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left,y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;const pos={x:x*W/rect.width,y:y*H/rect.height};if(!startT)start(pos);path=[pos];dashing=true;holdTimer=setTimeout(()=>{dashing=true},180)}function onMove(e){e.preventDefault();if(!startT)return;const rect=c.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left,y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;const pos={x:x*W/rect.width,y:y*H/rect.height};path.push(pos);if(path.length>2)path.shift();shark.vx=(pos.x-shark.x)*0.35;shark.vy=(pos.y-shark.y)*0.35}function onUp(){dashing=false;clearTimeout(holdTimer);path=[]}c.addEventListener('pointerdown',onDown,{passive:false});c.addEventListener('pointermove',onMove,{passive:false});c.addEventListener('pointerup',onUp);c.addEventListener('pointercancel',onUp);c.addEventListener('touchstart',onDown,{passive:false});c.addEventListener('touchmove',onMove,{passive:false});c.addEventListener('touchend',onUp);loop();msgEl.textContent='指でザメをスワイプ！';setTimeout(()=>msgEl.textContent='',1400);</script></body></html>
