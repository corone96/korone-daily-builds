<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>急雨パチン取り込み</title><style>html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#1a2836;color:#f4f7fb;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;}#app{height:100%;display:flex;flex-direction:column;position:relative;}#hud{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:8px 10px 6px;background:rgba(8,14,22,.78);z-index:4;font-size:14px;}#hud b{font-size:20px;}#hud .danger{color:#ffb4a8;}#msg{flex:1 1 100%;min-height:1.2em;font-size:13px;color:#ffe08a;}#stage{flex:1;position:relative;min-height:0;overflow:hidden;}#sky{position:absolute;inset:0 0 18% 0;background:linear-gradient(#9ec9e4,#5d7e9a 55%,#3e5164);overflow:hidden;}#sky.w3{filter:brightness(.86);}#sky.w4{filter:brightness(.74);}#sky.w5{filter:brightness(.62);}#rain{position:absolute;inset:0;pointer-events:none;opacity:.28;background:repeating-linear-gradient(105deg,transparent 0 10px,rgba(220,235,255,.45) 10px 11px);animation:rain .45s linear infinite;}@keyframes rain{to{background-position:16px 24px;}} .cloud{position:absolute;background:#3c4a5c;border-radius:40px;opacity:.72;animation:drift 16s linear infinite;} .cloud:before,.cloud:after{content:'';position:absolute;background:#3c4a5c;border-radius:50%;} .c1{width:38vw;height:46px;top:8%;left:-40vw;animation-duration:14s;} .c1:before{width:24px;height:24px;top:-12px;left:20px;} .c1:after{width:34px;height:28px;top:-16px;left:48px;} .c2{width:52vw;height:58px;top:18%;left:-60vw;animation-duration:11s;animation-delay:-4s;background:#2c3848;} .c3{width:30vw;height:36px;top:4%;left:-30vw;animation-duration:9s;animation-delay:-2s;opacity:.85;}@keyframes drift{from{transform:translateX(0);}to{transform:translateX(160vw);}}#rope{position:absolute;left:2%;right:2%;top:34%;height:4px;background:#d8c3a0;border-radius:2px;box-shadow:0 2px 0 #8a704c;z-index:1;}#items{position:absolute;left:0;right:0;top:34%;bottom:0;display:flex;justify-content:space-evenly;align-items:flex-start;padding:0 1vw;z-index:2;} .slot{flex:1 1 0;max-width:22%;display:flex;flex-direction:column;align-items:center;min-width:0;} .track{position:relative;width:92%;height:16px;margin:8px 0 6px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden;} .drop{position:absolute;top:1px;left:0;width:14px;height:14px;border-radius:50% 50% 50% 0;background:#b9e4ff;transform:rotate(-45deg);box-shadow:0 0 6px #fff;} .drop.near{background:#ffd166;} .drop.now{background:#ff6b6b;} .tag{font-size:10px;color:#ffd6a8;min-height:1em;}button.cloth{touch-action:none;border:3px solid transparent;border-radius:10px 10px 16px 16px;padding:4px 2px 6px;font-weight:800;line-height:1.15;color:#1b2430;box-shadow:0 6px 0 rgba(0,0,0,.25);width:92%;max-width:96px;min-height:48px;}button.cloth b{display:block;font-size:16px;}button.sock{background:repeating-linear-gradient(90deg,#f7d6d6 0 6px,#fff 6px 10px);height:12vh;min-height:52px;}button.shirt{background:#8ec6ef;height:16vh;min-height:64px;}button.coat{background:#31425e;color:#f4f7fb;height:24vh;min-height:84px;max-height:180px;}button.cloth.hot{filter:brightness(1.35);transform:translateY(2px) scale(1.04);}button.cloth.win30{border-color:#ffe08a;box-shadow:0 0 0 3px rgba(255,224,138,.45),0 6px 0 rgba(0,0,0,.25);}button.cloth.win15{border-color:#cde7ff;}button.cloth.wet{filter:grayscale(1) brightness(.7);background:#6d7580;color:#ddd;}button.cloth.saved{opacity:.25;transform:scale(.6);}#balcony{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(#c4a574,#8d6b45);border-top:8px solid #6e5238;z-index:3;}#rail{position:absolute;left:0;right:0;top:-18px;height:18px;background:repeating-linear-gradient(90deg,#6e5238 0 8px,transparent 8px 22px);border-top:4px solid #4e3926;}#basket{position:absolute;right:6%;bottom:18%;width:72px;height:46px;background:#c47b4a;border:4px solid #7a4324;border-radius:0 0 18px 18px;z-index:4;text-align:center;font-size:12px;line-height:42px;box-shadow:inset 0 8px 0 #e0a36e;}#basket:before{content:'';position:absolute;left:-8px;right:-8px;top:-10px;height:12px;border:4px solid #7a4324;border-bottom:none;border-radius:10px 10px 0 0;}#basket.bump{transform:scale(1.12);}#whip{position:fixed;height:7px;background:linear-gradient(#f6e7c1,#e0b98a);border-radius:4px;transform-origin:0 50%;display:none;z-index:6;pointer-events:none;box-shadow:0 1px 0 #8a6840;}#ov{position:absolute;inset:0;background:rgba(8,12,20,.78);z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}#ov.hide{display:none;}#ov h1{margin:0 0 8px;font-size:28px;}#ov p{margin:4px 0;line-height:1.45;max-width:28em;}#go{margin-top:16px;font-size:20px;padding:14px 28px;border:none;border-radius:14px;background:#ffd166;color:#2a2112;font-weight:800;touch-action:none;} .pop{position:fixed;z-index:7;font-weight:800;pointer-events:none;animation:up .7s ease forwards;}@keyframes up{to{transform:translateY(-28px);opacity:0;}} .credit{opacity:.7;font-size:12px;margin-top:10px;}</style></head><body><div id='app'><div id='hud'><div>スコア <b id='sc'>0</b></div><div>波 <b id='wv'>1/6</b></div><div>残り <b id='tm'>12.0</b></div><div id='wetbox'>濡れ <b id='wt'>0</b>/3</div><div id='msg'>高い服を、雨の直前に</div></div><div id='stage'><div id='sky'><div id='rain'></div><div class='cloud c1'></div><div class='cloud c2'></div><div class='cloud c3'></div><div id='rope'></div><div id='items'></div></div><div id='balcony'><div id='rail'></div></div><div id='basket'>かご</div></div><div id='whip'></div><div id='ov'><h1 id='ot'>急雨パチン取り込み</h1><p id='od'>服をタップすると0.35秒でかごへパチン。雨の直前ほど高得点。</p><p id='od2'>6波で濡れ3枚以内なら勝ち。濡れ4枚でその場で失敗。</p><button id='go' type='button'>はじめる</button><div class='credit'>コロネ</div></div></div><script>const SNAP=0.35,WAVE=12,GAP=1;const INFO={sock:{v:20,n:'靴下'},shirt:{v:40,n:'シャツ'},coat:{v:80,n:'コート'}};const WAVES=[[{k:'sock',t:1.5},{k:'shirt',t:3.2},{k:'shirt',t:5.2}],[{k:'shirt',t:1.5},{k:'coat',t:2.7},{k:'shirt',t:4.0},{k:'sock',t:5.5}],[{k:'coat',t:1.5},{k:'shirt',t:2.5},{k:'coat',t:3.6},{k:'shirt',t:4.8}],[{k:'shirt',t:1.5},{k:'coat',t:2.4},{k:'coat',t:3.3},{k:'sock',t:3.5},{k:'shirt',t:4.5}],[{k:'coat',t:1.5},{k:'shirt',t:2.3},{k:'sock',t:3.1},{k:'coat',t:3.3},{k:'shirt',t:4.3}],[{k:'shirt',t:1.5},{k:'coat',t:2.3},{k:'coat',t:3.2},{k:'sock',t:3.4},{k:'shirt',t:4.3}]];let G={score:0,state:'title',wet:0,wave:0,sub:'idle',t0:0,lockUntil:0,items:[],msg:'',timeText:'--',finger:null,ac:null};function publish(){window.__game={score:G.score,state:G.state};}function beep(freq,dur,type){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;G.ac=G.ac||new AC();const o=G.ac.createOscillator(),g=G.ac.createGain();o.type=type||'triangle';o.frequency.value=freq;g.gain.setValueAtTime(0.1,G.ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,G.ac.currentTime+dur);o.connect(g);g.connect(G.ac.destination);o.start();o.stop(G.ac.currentTime+dur);}catch(e){}}function hud(){document.getElementById('sc').textContent=G.score;document.getElementById('wv').textContent=(Math.min(G.wave,5)+1)+'/6';document.getElementById('tm').textContent=G.timeText;document.getElementById('wt').textContent=G.wet;document.getElementById('msg').textContent=G.msg;document.getElementById('wetbox').className=G.wet>=3?'danger':'';publish();}function popAt(it,text){const r=it.btn.getBoundingClientRect();const p=document.createElement('div');p.className='pop';p.textContent=text;p.style.left=(r.left+r.width/2)+'px';p.style.top=(r.top)+'px';document.body.appendChild(p);setTimeout(function(){p.remove();},700);}function bump(){const b=document.getElementById('basket');b.classList.add('bump');setTimeout(function(){b.classList.remove('bump');},160);}function placeWhip(a,b){const w=document.getElementById('whip');const dx=b.x-a.x,dy=b.y-a.y;const len=Math.hypot(dx,dy)||1;w.style.display='block';w.style.left=a.x+'px';w.style.top=a.y+'px';w.style.width=len+'px';w.style.transform='rotate('+Math.atan2(dy,dx)*180/Math.PI+'deg)';}function hideWhip(){document.getElementById('whip').style.display='none';}function clothCenter(it){const r=it.btn.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height*0.25};}function basketPoint(){const r=document.getElementById('basket').getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+8};}function spawn(){const box=document.getElementById('items');box.innerHTML='';G.items=WAVES[G.wave].map(function(d){const slot=document.createElement('div');slot.className='slot';const track=document.createElement('div');track.className='track';const drop=document.createElement('i');drop.className='drop';track.appendChild(drop);const btn=document.createElement('button');btn.type='button';btn.className='cloth '+d.k;btn.textContent=INFO[d.k].n;const vb=document.createElement('b');vb.textContent=INFO[d.k].v;btn.appendChild(vb);const tag=document.createElement('em');tag.className='tag';slot.appendChild(track);slot.appendChild(btn);slot.appendChild(tag);box.appendChild(slot);const it={k:d.k,t:d.t,status:'wait',btn:btn,drop:drop,tag:tag,pullStart:0};function onDown(e){e.preventDefault();pull(it,e);}btn.addEventListener('pointerdown',onDown);btn.addEventListener('touchstart',onDown,{passive:false});return it;});G.items.forEach(function(a){if(G.items.some(function(b){return b!==a&&Math.abs(b.t-a.t)<=0.21;}))a.tag.textContent='重なり';});}function pull(it,e){if(G.state!=='playing'||G.sub!=='wave')return;if(performance.now()<G.lockUntil)return;if(it.status!=='wait')return;const nowE=(performance.now()-G.t0)/1000;it.status='pull';it.pullStart=nowE;G.lockUntil=performance.now()+SNAP*1000;const pt=e.touches?e.touches[0]:e;G.finger={x:pt.clientX,y:pt.clientY};it.btn.classList.add('hot');beep(520,0.05,'square');}function soak(it){if(it.status==='wet'||it.status==='saved')return;it.status='wet';G.wet++;it.btn.classList.remove('hot','win30','win15');it.btn.classList.add('wet');G.msg='濡れ 0点';beep(120,0.18,'sawtooth');popAt(it,'濡れ');}function save(it,d){if(it.status!=='pull')return;it.status='saved';let b=0;if(d<=0.12)b=30;else if(d<=0.25)b=15;const gain=INFO[it.k].v+b;G.score+=gain;it.btn.classList.remove('hot','win30','win15');it.btn.classList.add('saved');G.msg=INFO[it.k].n+'+'+INFO[it.k].v+(b?(' タイミング+'+b):' 早め+0');beep(b>=30?920:b?680:420,0.09,'triangle');popAt(it,'+'+gain);bump();}function tickItems(el){const list=G.items.slice().sort(function(a,b){return a.t-b.t;});for(let i=0;i<list.length;i++){if(G.state!=='playing')return;const it=list[i];if(it.status==='pull'){const done=it.pullStart+SNAP;if(el+1e-4>=it.t&&el<done-1e-4){soak(it);if(G.wet>=4){lose();return;}}else if(el+1e-4>=done){const delta=it.t-done;if(delta<=1e-4){soak(it);if(G.wet>=4){lose();return;}}else save(it,delta);}}else if(it.status==='wait'&&el+1e-4>=it.t){soak(it);if(G.wet>=4){lose();return;}}}}function visuals(el){let pulling=null;G.items.forEach(function(it){const remain=it.t-el;const p=Math.max(0,Math.min(1,el/it.t));it.drop.style.left='calc('+(p*100)+'% - 8px)';it.drop.classList.toggle('near',it.status==='wait'&&remain<0.6);it.drop.classList.toggle('now',it.status==='wait'&&remain<0.35);if(it.status==='wait'){it.btn.classList.toggle('win30',remain<=0.47&&remain>=0.35);it.btn.classList.toggle('win15',remain<=0.60&&remain>0.47);}if(it.status==='pull')pulling=it;});if(pulling){const a=clothCenter(pulling);const u=Math.min(1,Math.max(0,(el-pulling.pullStart)/SNAP));const target=u<0.72?G.finger:basketPoint();if(target){const x=u<0.72?target.x:G.finger.x+(target.x-G.finger.x)*((u-0.72)/0.28);const y=u<0.72?target.y:G.finger.y+(target.y-G.finger.y)*((u-0.72)/0.28);placeWhip(a,{x:x,y:y});}}else hideWhip();}function beginWave(){G.sub='wave';G.t0=performance.now();G.lockUntil=0;spawn();const sky=document.getElementById('sky');sky.className='';if(G.wave>=2)sky.classList.add('w'+(G.wave+1>5?5:G.wave+1));G.msg=G.wave>=3?'重なりは1枚しか救えない':'雨の印が届く直前にタップ';}function endWave(){hideWhip();if(G.wave>=5){finish(G.wet<=3?'won':'lost');return;}G.wave++;G.sub='gap';G.gapEnd=performance.now()+GAP*1000;G.msg='次の波へ';}function finish(st){G.state=st;hideWhip();const win=st==='won';document.getElementById('ot').textContent=win?'雨をやり過ごした':'びしょ濡れ';document.getElementById('od').textContent=(win?'勝ち':'負け')+'  スコア '+G.score+'  濡れ '+G.wet+'枚';document.getElementById('od2').textContent=win?'6波終了。濡れは3枚以内。':'濡れが4枚に達した。';document.getElementById('go').textContent='もう一度';document.getElementById('ov').classList.remove('hide');G.timeText='0.0';G.msg=win?'勝利':'失敗';hud();}function lose(){if(G.state!=='playing')return;finish('lost');}function start(){G.score=0;G.wet=0;G.wave=0;G.state='playing';G.msg='スタート';document.getElementById('ov').classList.add('hide');beginWave();hud();}function update(now){if(G.state!=='playing')return;if(G.sub==='gap'){const left=Math.max(0,(G.gapEnd-now)/1000);G.timeText=left.toFixed(1);if(now>=G.gapEnd)beginWave();hud();return;}const el=(now-G.t0)/1000;visuals(el);tickItems(el);if(G.state!=='playing')return;G.timeText=Math.max(0,WAVE-el).toFixed(1);if(el>=WAVE){G.items.forEach(function(it){if(it.status==='wait')soak(it);});if(G.wet>=4){lose();return;}if(!G.items.some(function(it){return it.status==='pull';}))endWave();}hud();}function loop(ts){update(ts);requestAnimationFrame(loop);}document.getElementById('go').addEventListener('pointerdown',function(e){e.preventDefault();start();});document.getElementById('go').addEventListener('touchstart',function(e){e.preventDefault();start();},{passive:false});publish();hud();requestAnimationFrame(loop);</script></body></html>
